# cargo audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# RUSTSEC-2024-0449: unsafe-libyaml 0.2.11 is unmaintained (informational
# "unmaintained" warning, not a vulnerability). Reached only through
# serde_yaml_ng 0.10, which has 8 mentions in src/ (6 code sites, 2 comments):
# src/parsing/skill_md.rs:58, src/parsing/skill_md.rs:185,
# src/mcp/tools/skill_export.rs:478 (comment), :767 (comment), :777, :801, :806
# and src/federation/identity/inventory.rs:307. All of them parse or emit
# operator-supplied skill and inventory YAML; no fixed unsafe-libyaml version
# exists. Review by 2027-02-01; tracked by #8473 item 3 and by #8476 (the
# serde_yaml_ng replacement work). Remove this record and the ignore when
# serde_yaml_ng is replaced or moves off unsafe-libyaml.
#
# RUSTSEC-2023-0071: Marvin Attack on rsa crate via timing side-channels.
# Reached transitively only when `--features sal-postgres` is built
# (sqlx-macros-core unconditionally pulls sqlx-mysql → rsa). Default
# builds of ai-memory are unaffected. We never enable the MySQL
# backend and never expose sqlx' MySQL client surface. No fixed
# upgrade is available on the rsa crate (per the advisory body).
# Tracked for removal when sqlx-macros stops pulling sibling drivers.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained; review by 2027-02-01, see #8473 and #8476
]

# cargo audit configuration
# https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# RUSTSEC-2026-0097: rand unsound with custom logger using rand::rng()
# Affects rand 0.8.5 (via instant-distance, hf-hub) and 0.9.2 (via tokenizers, candle-core).
# Not applicable: we do not use a custom global logger that calls rand::rng().
# No upstream fix available — blocked on rand crate patch.
#
# RUSTSEC-2023-0071: Marvin Attack on rsa crate via timing side-channels.
# Reached transitively only when `--features sal-postgres` is built
# (sqlx-macros-core unconditionally pulls sqlx-mysql → rsa). Default
# builds of ai-memory are unaffected. We never enable the MySQL
# backend and never expose sqlx' MySQL client surface. No fixed
# upgrade is available on the rsa crate (per the advisory body).
# Tracked for removal when sqlx-macros stops pulling sibling drivers.
#
# RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369: zip 7.2.0 archive
# extraction advisories, pulled in via candle-core 0.10.2 (#7301).
# All three apply only to zip's extract() / ZipStreamReader::extract(); they
# are patched only in zip >= 9.0.0. Each ignore below shares this record:
#   - reached only via candle-core npy.rs and pickle.rs (ZipArchive::new /
#     by_name / ZipWriter), never via extract;
#   - no candle release supports zip >= 9 (candle-core 0.10.x needs ^7.2.0,
#     0.11.0 needs ^8.6.0);
#   - remove when candle moves to zip >= 9 (tracked by #7302);
#   - guarded by scripts/check-zip-extract-unreachable.py, which runs before
#     `cargo audit` in CI and fails if zip becomes reachable from our code.
# zip 7.2.0 was yanked on crates.io when this record was written (2026-10-17):
# `cargo audit` printed it as an allowed "yanked" warning, never a failure. The
# crates.io index later listed 7.2.0 as not yanked; either state leaves
# `cargo audit` at rc 0. The yank note is tracked by #7302 as well and ends with
# the same removal.
# Decision: 3-agent vote (6def5ab6), memory 34425e02.
ignore = [
    "RUSTSEC-2026-0097",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0367", # zip extract(); see #7302, guarded by check-zip-extract-unreachable.py
    "RUSTSEC-2026-0368", # zip extract(); see #7302, guarded by check-zip-extract-unreachable.py
    "RUSTSEC-2026-0369", # zip extract() (CVSS 9.1); see #7302, guarded by check-zip-extract-unreachable.py
]

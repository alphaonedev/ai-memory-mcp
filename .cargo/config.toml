# Cargo build configuration.
#
# CI-speed (windows) — rust-lld linker trial. The windows `Check` job's
# `cargo test` cost is dominated by linking ~392 separate integration-test
# binaries with the default MSVC `link.exe`; the bundled `rust-lld`
# (lld-link) links substantially faster. ubuntu/coverage already use `mold`
# via per-job RUSTFLAGS; windows had no fast linker configured.
#
# Scoped to the windows-msvc target ONLY, so it cannot affect Linux/macOS or
# the aarch64 mobile cross-compile builds. `-C linker-features=+lld` makes
# rustc drive the toolchain-bundled rust-lld in `link` flavor (no external
# linker install needed). Local windows developers also get the faster link.
#
# Trial posture: introduced on release/v0.8.0, where the `Check (os)` jobs
# are NOT required status checks, so a regression is observable + revertible
# with zero merge impact before this ever reaches main/develop (where the
# three `Check (os)` ARE the required gates).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "linker-features=+lld"]

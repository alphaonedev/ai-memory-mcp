# .github/branch-protection.yml
#
# =============================================================================
# *** STATUS: DOCUMENTATION ONLY. THIS FILE ENFORCES NOTHING, IS APPLIED BY
# *** NOTHING, AND IS **NOT** THE REQUIRED-STATUS-CHECK DECLARATION.
# ***
# *** The declaration is  scripts/qc-allowlists/required-contexts-release.txt
# *** — hand-authored from intent, and mechanically verified against the
# *** workflows on EVERY PR by scripts/check-required-contexts.sh (the
# *** `Required-context + classify-base soundness gate (#2494/#2496/#2508)`
# *** job in .github/workflows/c8-precheck.yml).
# ***
# *** Add or remove a required context THERE, never here. Read that file's
# *** "HOW TO CHANGE THIS FILE" section first — the mirror and the protection
# *** API call cannot be atomic, and the safe landing ORDER differs between an
# *** ADDITION (mirror first) and a REMOVAL (protection first).
# =============================================================================
#
# WHO READS THIS FILE (#2443 — answered mechanically, not from memory).
# Nobody. `grep -rn 'branch-protection' .` over the whole tree returns exactly
# two references to this path, and both are prose: this header, and a comment
# in `.github/workflows/batman-mode-acceptance.yml` pointing at the
# `nightly_schedule` block below. No workflow step, no script under scripts/,
# and no action parses it; there is no `gh api .../protection` write anywhere
# in the repository. GitHub itself never reads a checked-in file — branch
# protection lives on the API and requires an admin token.
#
# Two consequences follow, and both are load-bearing:
#
#   1. Reconciling this file CANNOT mutate live protection. It is safe to edit.
#   2. This file can never be an attestation of anything. Whatever it says
#      about enforcement is a CLAIM with no mechanism behind it.
#
# WHY IT WAS RECONCILED (#2443). Until this change the header called this file
# "the SOURCE-OF-TRUTH manifest for the branch-protection rules" and listed
# five `required_checks` for each of `main`, `release/**` and `develop`. That
# declaration was wrong in both directions at once:
#
#   * OVER-declared, unrequireable. Three of the five per branch were written
#     as `Batman Mode acceptance gate / <job>` — a `<workflow> / <job>` form
#     that a GitHub Actions job NEVER reports. The check-run name is the JOB
#     name alone (`Rust integration (issue_800_batman_mode)`), so the prefixed
#     string names no context that exists. Pinning it into protection would
#     leave it `Expected — waiting` forever, and `enforce_admins: true` means
#     no admin merge clears it: the branch wedges. It is unrequireable a
#     SECOND time over independently, because the carrying workflow's
#     `pull_request` trigger is `paths:`-filtered, so on any PR outside that
#     path list the job produces no check-run at all. That is rule (c) of
#     scripts/check-required-contexts.sh, and both halves are the same defect
#     class #2494 found and closed on the release branch.
#   * UNDER-declared. It named two contexts that do exist and are live-required
#     (`C8 caller-context allowlist check`, `Vendor-monoculture + SECS_PER_*
#     lint-gate (#1174 PR10)`) while omitting the other twenty-two that
#     `release/v1.0.0` actually requires.
#
# A committed policy file asserting `enforce_admins: true` over a check set
# that cannot report is worse than having no policy file: an enterprise
# reviewer reads the file, not the API, so the file MANUFACTURES assurance.
# The fix is not a better list here — a second hand-maintained list is how
# #2443 happened. The fix is that there is now exactly ONE declaration, it is
# gate-verified, and this file points at it.
#
# WHAT REMAINS BELOW. Only the two contracts that are genuinely documented
# here and nowhere else — the Batman nightly-schedule contract and the
# CODEOWNERS cross-link — plus per-branch POLICY INTENT (admin enforcement,
# force-push, up-to-date). Policy intent is recorded as intent, not as an
# attestation of live state; no required-context list is duplicated.

version: 2

# The required-status-check declaration for this repository. One place.
required_checks_declaration:
  release_branches:
    file: scripts/qc-allowlists/required-contexts-release.txt
    verified_by: scripts/check-required-contexts.sh
    verified_in: .github/workflows/c8-precheck.yml
    job: "Required-context + classify-base soundness gate (#2494/#2496/#2508)"
  main_and_develop:
    file: null
    note: |
      There is no gate-verified mirror for `main` or `develop`. That gap is
      recorded in the KNOWN GAPS section of the release mirror above and
      tracked as the #2496 exposure: those branches require only the
      `Check (…-latest)` matrix, so the branch that ships production tags is
      in fact the least gated. Closing it is a branch-protection edit
      (Sensitive class, docs/AI_DEVELOPER_GOVERNANCE.md) and is deliberately
      NOT done by editing this file, which enforces nothing.

branches:
  - pattern: main
    description: |
      Production release tags only. POLICY INTENT: admin enforcement on, no
      force-push, PRs must be up to date before merging. The required-check
      set is NOT declared here — see `required_checks_declaration` above.
    require_up_to_date: true
    enforce_admins: true
    allow_force_push: false

  - pattern: release/**
    description: |
      Release-cut branches (release/v1.0.0, …). POLICY INTENT: admin
      enforcement on, no force-push, PRs must be up to date before merging.
      The required-check set is declared ONLY in
      scripts/qc-allowlists/required-contexts-release.txt.
    require_up_to_date: true
    enforce_admins: true
    allow_force_push: false

  - pattern: develop
    description: |
      Integration branch. POLICY INTENT: no force-push, PRs must be up to date
      before merging. The required-check set is NOT declared here.
    require_up_to_date: true
    enforce_admins: true
    allow_force_push: false

# KNOWN-INERT LIVE RULESET (#2486). `required_signatures` on the live
# GitHub ruleset `signed-attested-branches` (id 17752665, targets
# `refs/heads/{main,develop,release/*}`, confirmed live via
# `gh api repos/alphaonedev/ai-memory-mcp/rulesets/17752665`) is NOT the
# control it names itself. Under this repo's exclusively-API-squash-merge
# flow, GitHub CREATES and SIGNS the merge commit with its own web-flow key
# (`B5690EEEBB952194`), so the rule is SELF-SATISFYING — it verifies a
# signature it produced itself and can structurally never reject anything.
# This is the same class as #2444 / #2449 / #2452 / #2443: a control that
# reports success while doing nothing.
#
# Per this file's own doctrine above (nobody reads this file; it enforces
# nothing; GitHub's live ruleset state is the only authoritative artefact),
# this note changes NOTHING live — it exists so a reviewer of this file
# does not COUNT `required_signatures` in the release-gate control
# inventory. The controls actually holding `release/**` are
# `non_fast_forward`, `deletion`, and the required-status-check set
# declared in `scripts/qc-allowlists/required-contexts-release.txt`
# (verified by `scripts/check-required-contexts.sh`). Do NOT remove
# `required_signatures` from the live ruleset as part of reconciling this
# note — that is a live security-config mutation (Sensitive class,
# operator-gated) #2486 did not ask for and this file cannot make (see
# doctrine above: nobody reads this file, nothing enforces it).
#
# The ACTUAL commit-signing posture control is
# `scripts/check-commit-signing-posture.sh`, wired as the
# `Commit-signing posture gate (#2486)` job in
# `.github/workflows/c8-precheck.yml` — it inspects the PR's OWN commits
# (identity + signature verified against
# `scripts/qc-allowlists/enrolled-commit-signers.txt`) rather than the
# GitHub-produced merge artefact `required_signatures` inspects.
signing_posture_note:
  ruleset_id: 17752665
  ruleset_name: signed-attested-branches
  rule: required_signatures
  status: self_satisfying_under_api_merge
  not_a_control_because: |
    GitHub signs its own web-flow squash-merge commits, so
    required_signatures verifies a signature GitHub itself produced.
    It cannot fail on the merge path it governs.
  actual_control: scripts/check-commit-signing-posture.sh
  actual_control_ci_job: "Commit-signing posture gate (#2486)"
  issue: "#2486"

# Auxiliary policy: nightly run-against-develop.
# The Batman acceptance workflow runs on path-filtered PRs by default;
# the nightly schedule below catches regressions whose triggering edit
# fell outside the path filter (refactors elsewhere in src/governance
# that change the canonical-bytes shape, etc.). The workflow file
# carries the schedule entry; this manifest records the contract.
#
# NOTE (#2443): that path filter is exactly why none of this workflow's three
# jobs can be a required status check on any branch. The nightly schedule is
# the compensating control, and it is a DETECTION control (a red nightly run),
# never a merge gate.
nightly_schedule:
  workflow: .github/workflows/batman-mode-acceptance.yml
  cron: "0 8 * * *"  # 08:00 UTC daily
  branch: develop
  description: |
    Nightly Batman Mode acceptance regardless of paths. Catches
    cross-module refactors that drift the canonical-bytes shape
    without touching the immediate file allowlist.

# CODEOWNERS reminder — the security owner is the operator. Any
# change to src/governance/** or src/cli/rules.rs requires explicit
# CODEOWNERS approval (already enforced via .github/CODEOWNERS at the
# directory level; #807 acceptance pins the requirement here as a
# cross-link).
codeowners_gate:
  paths:
    - src/governance/**
    - src/cli/rules.rs
  required_reviewers_from_codeowners: 1
  description: |
    The L1-6 fail-closed posture is operator-set. Any edit to the
    rules engine or the rules signer requires a CODEOWNERS sign-off
    so the bypass class that #807 closes cannot reappear under a
    routine refactor merge.

# HISTORICAL CONTEXT — why this file was created (v0.7.0 issue #807).
# PR #775 shipped an L1-6 governance posture that silently passed
# verification because the canonical-bytes encoding mismatched between the
# rule signer and the rule verifier. The bypass lived ~24 hours post-tag at
# v0.7.0. The fix (PR #801) shipped integration tests + an acceptance
# workflow, and this file was written to be the audit trail for pinning
# those tests as required checks. That pinning never happened and — per the
# analysis at the top of this file — could not have, in the form declared.
# The tests still run: on every path-matching PR, on every push to
# main/develop/release/**, and nightly against develop.

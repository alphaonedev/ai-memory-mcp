name: CI

# This workflow performs VERIFICATION ONLY: lint, cross-platform check
# matrix, feature-gate jobs, dockerfile-validate. It does
# NOT publish releases — that lives in `release.yml` and only fires from
# an explicit `workflow_dispatch` invocation (operator-gated). The
# separation is deliberate: ci.yml passing on a tag-push is necessary
# but not sufficient for publication; a maintainer must run
#   gh workflow run release.yml --repo alphaonedev/ai-memory-mcp -f tag=v0.7.0
# to actually ship.
#
# See `release.yml` for the publish pipeline (binary builds, GitHub
# Release page, crates.io, Homebrew tap, GHCR Docker image, Fedora COPR).
#
# 2026-05-27 — full-pipeline re-validation triggered post-CI-flake-closure
# sweep (#1372 / #1373 / #1334 closures landed via PRs #1375 / #1376 /
# #1377; the immediate post-merge HEAD short-circuited because the PR
# #1377 merge commit was docs-only). Local pm-v3.3 recompile-retest on
# HEAD 0e30d23f6 returned 7,332 / 0 / 16 across 309 binaries — a strict
# superset of the 2026-05-22 dossier baseline; this push refreshes the
# integrated full-platform CI signal as Tier 1 ship-gate evidence.

# ---------------------------------------------------------------------------
# RUNNER PLACEMENT — THE RULE (cited by every `# RUNNER PLACEMENT` comment in
# this repository's workflows; this block is its single statement).
# ---------------------------------------------------------------------------
# OPERATOR DIRECTIVE, 2026-08-22: "Linux CI: push all Linux CI back onto GitHub
# except for the PostgreSQL, which we can do local here faster — that will
# prevent all these OOM events."
#
# So on LINUX there is now exactly ONE reason to be self-hosted:
#
#   pg-tier   the always-up native PG 18.6 + AGE 1.8.0 + pgvector 0.8.6
#             instance on :5445. A job qualifies if it reads the node-local
#             tier-URL file, CREATE DATABASEs an ephemeral db on it, or points
#             AI_MEMORY_TEST_POSTGRES_URL / AI_MEMORY_TEST_AGE_URL at it. TWO
#             jobs qualify — this workflow's `Check (linux-fed,enterprise-fed)`
#             leg and `cert-postgres-age.yml`. That is the entire Linux fleet
#             workload.
#
# EVERYTHING ELSE ON LINUX IS `ubuntu-latest`. In particular, WARM-CACHE IS NO
# LONGER A REASON TO BE SELF-HOSTED ON LINUX. It was, under #3129's rule, and
# the measurements since say that trade was wrong:
#
#   * f2 is ONE shared box. Four runner instances each running a compile+test
#     job oversubscribed 14 cores ~2x. #3139: `SAL-only feature gate` took
#     34.5 min under low contention and was CANCELLED at 40:15 under high
#     contention — mid-step, healthy, just slow. #3137: `Check (linux-fed,
#     sqlite)` panicked in `tests/integration.rs` step 19 at load 36 on a
#     bench assertion that passed on every isolated hosted VM. Contention did
#     not merely slow the fleet down, it produced FALSE RED on jobs whose code
#     was fine — and OOM pressure on the operator's own dev box.
#   * GitHub-hosted runners are effectively unbounded in parallelism and give
#     each job a whole VM. A cold `target/` costs minutes; a false red costs a
#     re-run of the entire required matrix plus the reviewer time to tell the
#     two apart.
#
# macOS is UNCHANGED and stays on the f1 node: the directive is Linux-only, and
# there is no GitHub-hosted arm64 macOS class these legs are calibrated for.
#
# One absolute survives from #3128 and still binds: A JOB THAT OTHER JOBS
# `needs:` MUST NEVER BE SELF-HOSTED UNLESS IT IS ITSELF pg-tier. A queued
# decider stalls its whole graph — that was #3128, where `Classify changes` sat
# behind ~37 fleet jobs and the required `Check (…)` legs never started.
#
# A job moving to the hosted pool must not keep anything the fleet supplied
# implicitly — a PATH entry for ~/.cargo/bin, CARGO_BUILD_JOBS, a runner-managed
# RUNNER_TOOL_CACHE, a job-started hook — and must give BACK what the fleet made
# unnecessary: `Swatinem/rust-cache` (already gated
# `runner.environment == 'github-hosted'`, so it simply starts firing again) and
# actions/setup-python / actions/setup-node wherever a job needs the #2452
# fail-closed interpreter guarantee. The fleet-only `rustup` presence assertion
# is dropped from every job that no longer runs there. CARGO_INCREMENTAL=0 stays
# declared in each workflow `env:` block — not inherited from the runner .env,
# and not from rust-cache.
#
# Adding a job: does it need the :5445 tier? If not, it is `ubuntu-latest` — and
# record the answer as a `# RUNNER PLACEMENT` comment on the job.

on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, develop, "release/**"]
  # Merge Queue (#3089) — GitHub runs a queued PR's REQUIRED checks against the
  # ephemeral `merge_group` ref, NOT the PR ref. A required workflow that does
  # not trigger on `merge_group` never reports on that ref, so its context stays
  # pending forever and the queue wedges the branch. Adding the trigger keeps
  # the SAME required-context names (no `name:` changed). The `classify` decider
  # defaults to `docs_only=false` on `merge_group` (explicit arm below): a merge
  # group must exercise the FULL gate, never short-circuit to a docs-only skip.
  merge_group:
    types: [checks_requested]

# Concurrency: coalesces `push` + same-branch internal `pull_request`
# events while keeping fork PRs isolated.
#
# Expression chain (evaluated left-to-right via && / ||):
#   - INTERNAL PR (head.repo == upstream): key = head.ref
#     → SAME branch name as the push event → coalesces correctly.
#       Example: push to release/v0.7.0 AND the PR #N (release/v0.7.0
#       → main) synchronize event both produce key
#       "ci-CI-release/v0.7.0".
#   - FORK PR (head.repo != upstream): key = pull_request.number
#     → unique integer, cannot collide with protected-branch refs.
#       Example: fork PR with head.ref="release/v0.7.0" gets key
#       "ci-CI-<PR#>", which never matches an upstream push.
#   - PUSH event: key = github.ref_name (branch name, no refs/ prefix).
#
# v0.7.0 (2026-05-31, operator directive "fix it all 100%") —
# Pre-fix, both push and pull_request triggers fired concurrently on
# every push to a branch with an open PR (release/v0.7.0 → main),
# producing 2 CI runs per push (~2x CI cost).
#
# Earlier "head.ref || ref_name" key (2b83bc6ea) coalesced correctly
# for same-branch events but enabled a fork-PR DoS: an attacker could
# open a fork PR with head.ref="release/v0.7.0" to share the upstream
# branch's group, then trigger cancel-in-progress against the
# protected-branch CI. The chained key below restricts the coalescing
# to head.repo==github.repository (internal-PR / maintainer paths) so
# fork PRs cannot collide with branch keys.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # #3128 — EXPLICIT, not inherited. `Swatinem/rust-cache` is what used to export
  # CARGO_INCREMENTAL=0, and it is now skipped on the self-hosted fleet (see the
  # rust-cache guards below), so the value must be declared here. Incremental
  # state is the most fragile thing in a `target/` tree, and the fleet's
  # `target/` is PERSISTENT and reused across branches — leaving incremental on
  # there would be a worse version of the very inconsistency the guard closes.
  # Declaring it at workflow level also means no job depends on the runner
  # `.env` supplying it.
  CARGO_INCREMENTAL: "0"

jobs:
  # Classify the diff so docs-only PRs can short-circuit the heavy Rust
  # matrix instead of waiting on the full per-OS test build. Required status
  # checks are still satisfied because the matrix jobs keep their names AND
  # complete with status SUCCESS — they just no-op on docs-only diffs.
  #
  # THE INVARIANT THIS JOB'S CONSUMERS MUST HONOUR (#2494 / #2496):
  # A job that carries a REQUIRED context name must NEVER take a
  # job-level `if:` when it is ALSO a `strategy: matrix` job. GitHub
  # evaluates the job-level `if:` BEFORE matrix expansion, so a skipped
  # matrix job emits exactly ONE check-run bearing the UNEXPANDED
  # template name (verified live on docs-only commit 45ba8741:
  # `Cross-compile (${{ matrix.target }})` skipped, while BOTH
  # `Cross-compile (aarch64-apple-ios)` and
  # `Cross-compile (aarch64-linux-android)` were never created). An
  # ABSENT required context is `pending` forever and `enforce_admins:
  # true` means no admin merge clears it — the branch wedges. The
  # correct shape is the `check` job below: NO job-level `if:`, the
  # docs-only guard on EVERY step, matrix names expand, contexts report
  # `success` in <30 s. `scripts/check-required-contexts.sh` (rule b1)
  # statically enforces this so the class cannot re-land.
  #
  # TWO BASES, NOT ONE (#2496 — the classifier fail-open):
  # `docs_only` CLASSIFICATION and test-impact SELECTION want different
  # diff bases and must never share one. Classification is a property of
  # the WHOLE PR (base..head); selection may legitimately use the
  # incremental previous head. Sharing one base let a PR whose LAST push
  # was docs-only classify docs-only for its entire head — which merged
  # PR #2031 into `main` with zero compilation/tests/clippy, and fired
  # again live on the #2497 security fix (a CLAUDE.md-only third commit
  # skipped Lint/MSRV/Postgres/SAL/vectorlite on a 12-file backend
  # change). `coverage.yml`'s classifier already used the PR base and
  # correctly reported `docs_only=false` on that same commit.
  classify:
    name: Classify changes
    # RUNNER PLACEMENT — GITHUB-HOSTED, AND THIS ONE IS LOAD-BEARING
    # (the rule is stated at the head of this file).
    #
    # `classify` is the ROOT of this workflow's `needs:` graph: `lint`,
    # `actionlint`, `msrv`, `check` (×4), `postgres-feature`,
    # `mobile-cross-compile` (×2), `sal-feature`, `vectorlite-feature` and
    # `dockerfile-validate` all wait on it, so NOTHING in the pipeline can start
    # until it finishes. #3109 put it on `[self-hosted, linux-fed]`, where it
    # queued behind ~37 other self-hosted jobs on a 2-node fleet — with several
    # PRs open the decider itself sat `queued` for 40+ minutes and the four
    # REQUIRED `Check (…)` legs never started. Head-of-line blocking on the one
    # job that must never wait.
    #
    # It is a toolchain-free git/bash decider — no cargo, no Postgres — so it
    # has nothing to gain from a self-hosted node and belongs on the hosted
    # pool, which has no slot contention. DO NOT re-home this job onto
    # `self-hosted`. The `- id: cls` two-base body is UNCHANGED (frozen by
    # scripts/test/test-ci-workflow-invariants.sh §A).
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.cls.outputs.docs_only }}
      # v0.7.0 Task #12 (#1399) — test-impact selection output.
      # Possible values:
      #   __SKIP__   docs-only diff (no Rust pipeline)
      #   __ALL__    foundational change OR fallback (full integration suite)
      #   <names>    space-separated tests/*.rs binary names to dispatch
      # Consumed by the `Run tests` steps in `check` + `postgres-feature`.
      # The consumer ALWAYS runs `cargo test --lib` regardless of this
      # value; impact selection optimises only the slow tests/*.rs
      # integration binaries (~5-15s setup per binary).
      test_impact: ${{ steps.cls.outputs.test_impact }}
      test_impact_count: ${{ steps.cls.outputs.test_impact_count }}
      test_impact_total: ${{ steps.cls.outputs.test_impact_total }}
      test_impact_reason: ${{ steps.cls.outputs.test_impact_reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2 }
      - id: cls
        shell: bash
        env:
          # github.* contexts come in through env: per security-guidance
          # plugin best practice. SHA fields are still validated via
          # `git rev-parse` downstream before any use; this just keeps
          # the values out of run: interpolation reach.
          EVENT_NAME: ${{ github.event_name }}
          PR_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_ACTION: ${{ github.event.action }}
        run: |
          # TWO SEPARATE BASES (#2496). Sharing one was the defect.
          #
          #   cls_base    — CLASSIFICATION base. Must span the WHOLE
          #                 change under review, because `docs_only`
          #                 decides whether eight required contexts run
          #                 at all. On `pull_request` that is ALWAYS the
          #                 PR base ($PR_BASE_SHA), for every action
          #                 (opened / reopened / synchronize alike).
          #   impact_base — test-impact SELECTION base. Wants the
          #                 SMALLEST defensible diff so per-push
          #                 selection stays effective, so on
          #                 `synchronize` it may use $PR_BEFORE (the
          #                 previous PR head). Narrowing which
          #                 tests/*.rs binaries run is a cost
          #                 optimisation inside an already-running job;
          #                 it never decides whether a gate runs.
          #
          # Event-by-event:
          #   - pull_request: cls_base = $PR_BASE_SHA always;
          #     impact_base = $PR_BEFORE on synchronize when present,
          #     else $PR_BASE_SHA.
          #   - push: no PR base exists, so both = $EVENT_BEFORE
          #     (=$PR_BEFORE here; `github.event.before` carries the
          #     previous branch tip). A push delta genuinely IS the
          #     change being introduced to the branch, and push events
          #     do not gate merges — required contexts are matched on
          #     the PR head commit.
          ZERO=0000000000000000000000000000000000000000
          # Merge Queue (#3089) — a `merge_group` event has no PR diff to
          # classify, and a merge group MUST run the whole pipeline (never a
          # docs-only short-circuit). Pin it here to `docs_only=false` +
          # `__ALL__`. The generic fail-closed `else` arm below would also
          # yield this (empty base → run everything), but the merge queue's
          # correctness depends on it, so it is explicit and not left implicit
          # to a future refactor of the base-resolution block.
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "test_impact=__ALL__" >> "$GITHUB_OUTPUT"
            echo "test_impact_count=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_total=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_reason=merge_group-full-pipeline" >> "$GITHUB_OUTPUT"
            echo "::notice::merge_group event — running the full pipeline (not docs-only)"
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            cls_base="$PR_BASE_SHA"
            if [ -n "$PR_BEFORE" ] && [ "$PR_BEFORE" != "$ZERO" ] && [ "$PR_ACTION" = "synchronize" ]; then
              impact_base="$PR_BEFORE"
            else
              impact_base="$PR_BASE_SHA"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            cls_base="$PR_BEFORE"
            impact_base="$PR_BEFORE"
          else
            cls_base=""
            impact_base=""
          fi
          # FAIL CLOSED on an unresolvable CLASSIFICATION base: without a
          # base we cannot prove the diff is docs-only, so run everything.
          if [ -z "$cls_base" ] || [ "$cls_base" = "$ZERO" ] || ! git rev-parse "$cls_base" >/dev/null 2>&1; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "test_impact=__ALL__" >> "$GITHUB_OUTPUT"
            echo "test_impact_count=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_total=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_reason=base-unreachable" >> "$GITHUB_OUTPUT"
            echo "::notice::cannot resolve classification base commit ($cls_base) — running full pipeline"
            exit 0
          fi
          # Per issue #1193 PR #1203 — `fetch-depth: 2` is too shallow
          # when the PR base SHA is more than 1 commit behind the
          # PR-merge ref; `git rev-parse $base` returns the SHA from
          # GitHub's pull/N/merge representation but the tree itself
          # isn't downloaded, so `git diff $base HEAD` fails with
          # `fatal: bad object`. Fetch the base commit on demand
          # before the diff. This is a no-op when fetch-depth was
          # already deep enough.
          fetch_base_tree() {
            if git cat-file -e "$1^{tree}" 2>/dev/null; then return 0; fi
            git fetch --depth=50 origin "$1" 2>/dev/null || \
              git fetch --depth=200 origin "$1" 2>/dev/null || \
              git fetch --unshallow origin 2>/dev/null || true
            git cat-file -e "$1^{tree}" 2>/dev/null
          }
          if ! fetch_base_tree "$cls_base"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "test_impact=__ALL__" >> "$GITHUB_OUTPUT"
            echo "test_impact_count=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_total=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_reason=base-fetch-failed" >> "$GITHUB_OUTPUT"
            echo "::notice::cannot fetch classification base tree ($cls_base) after retry — running full pipeline"
            exit 0
          fi
          # The impact base is a cost optimisation only. If it is
          # unreachable, widen to the classification base (an
          # OVER-inclusive test selection, never an under-inclusive one).
          if [ "$impact_base" != "$cls_base" ] && ! fetch_base_tree "$impact_base"; then
            echo "::notice::cannot fetch impact base tree ($impact_base) — widening impact selection to the classification base"
            impact_base="$cls_base"
          fi
          changed=$(git diff --name-only "$cls_base" HEAD)
          if [ -z "$changed" ]; then
            # FAIL CLOSED (#2494 §3 / #2496 fix 4). An empty diff vs the
            # PR base means "no NET changes", which is NOT "docs only" —
            # and a `git commit --amend && git push --force` produces a
            # fresh SHA with an identical tree, so the old
            # `docs_only=true` arm let an amend-force-push neutralise
            # eight required gates on a PR that is not docs-only at all.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "test_impact=__ALL__" >> "$GITHUB_OUTPUT"
            echo "test_impact_count=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_total=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_reason=empty-diff-fail-closed" >> "$GITHUB_OUTPUT"
            echo "::notice::no net diff vs classification base — failing CLOSED (full pipeline), NOT docs-only"
            exit 0
          fi
          # docs-only iff every changed file matches docs/** OR *.md anywhere
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
            docs_only=false
            echo "::notice::code changes detected — running full pipeline"
          else
            docs_only=true
            echo "::notice::docs-only diff — skipping Rust pipeline"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "--- Changed files vs classification base $cls_base ($(echo "$changed" | wc -l) files) ---"
          echo "$changed"

          # v0.7.0 Task #12 (#1399) — compute test-impact set.
          # Always runs; the consumer steps decide whether to honor
          # the output based on docs_only. The script is self-contained
          # POSIX-compatible bash; full discipline + foundational list
          # documented inline in scripts/ci-test-impact.sh.
          # NOTE the base: SELECTION uses $impact_base (may be the
          # incremental previous head), never $cls_base's classification
          # role. See the two-bases comment above.
          chmod +x scripts/ci-test-impact.sh
          # SECOND-ORDER FAIL-OPEN, closed here (#2496). Splitting the two
          # bases is NECESSARY BUT NOT SUFFICIENT, and this was caught by
          # probing the fix's own CI run rather than by reading it. The
          # `__SKIP__` sentinel is a DOCS-ONLY VERDICT — the consumer steps
          # (`Run tests (impact-aware)` in `check`, `pg_test` in
          # `postgres-feature`) treat it as "no-op the test step". But
          # `ci-test-impact.sh` derives it from the INCREMENTAL base, so on a
          # code PR whose last push is docs-only it still emitted `__SKIP__`
          # even with `docs_only=false`. Measured on this very fix's first
          # run (head 13f0b53d, a CHANGELOG-only last commit over 9 non-docs
          # files): every heavy gate correctly RAN, and `Check (macos-latest)`
          # then logged `TEST_IMPACT: __SKIP__` / `docs-only diff — test step
          # is a no-op` — compilation and clippy were restored while
          # `cargo test` still ran ZERO tests. So the impact lane carried its
          # own copy of the same fail-open one layer down.
          #
          # A verdict the classifier did not reach must never be inferred from
          # a narrower diff: `__SKIP__` is honoured ONLY when `docs_only` is
          # genuinely true, and otherwise degrades to `__ALL__` (run more, not
          # fewer). The script is run with GITHUB_OUTPUT redirected to scratch
          # so its emission is inspected BEFORE it can reach the real outputs
          # — the guard is structural, not a hope that a later duplicate key
          # wins.
          impact_out="${RUNNER_TEMP:-.}/ci-test-impact.out"
          : > "$impact_out"
          GITHUB_OUTPUT="$impact_out" scripts/ci-test-impact.sh "$impact_base" "HEAD"
          if [ "$docs_only" != "true" ] && grep -q '^test_impact=__SKIP__$' "$impact_out"; then
            echo "test_impact=__ALL__" >> "$GITHUB_OUTPUT"
            echo "test_impact_count=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_total=ALL" >> "$GITHUB_OUTPUT"
            echo "test_impact_reason=impact-skip-overridden-not-docs-only" >> "$GITHUB_OUTPUT"
            echo "::notice::impact selection returned __SKIP__ from the incremental base ($impact_base) but the PR is NOT docs-only — overriding to __ALL__ (fail closed)"
          else
            cat "$impact_out" >> "$GITHUB_OUTPUT"
          fi

  # Fast lint job — fmt + clippy on ubuntu only. Toolchain-portable, no
  # need to run on macOS where it just duplicates work and burns
  # ~3 min per platform.
  #
  # #2494 doc-vs-reality fix: this comment previously read "Advisory (not
  # in required-status-checks)". FALSE — live branch protection on
  # `release/v1.0.0` REQUIRES `Lint (fmt + clippy)`. Because it is
  # required AND carries a job-level `if:`, a docs-only classification
  # makes it report `skipped`, which GitHub counts as SATISFIED — it
  # fails OPEN. That is tolerable ONLY while the classifier is correct,
  # which is why the two-base split above had to land in the same commit.
  # This job is NOT a matrix job, so the job-level `if:` does not wedge
  # the branch the way it did on `mobile-cross-compile`; it is tracked as
  # a burn-down entry in
  # `scripts/qc-allowlists/required-contexts-joblevel-if-allow.txt`.
  lint:
    name: Lint (fmt + clippy)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). Linux
    # warm-cache is no longer a reason to be self-hosted; only the pg tier is.
    # Two full pedantic clippy passes (default + `--all-targets --features
    # sal`). `Swatinem/rust-cache` below carries the warm `target/` on the
    # hosted pool, as it did before #3109.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt, clippy
      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings -D clippy::all -D clippy::pedantic
      # #1986 — widened pass at the STRIPPED feature combo. Test files gated
      # `#![cfg(feature = "sal-postgres")]` lose their file-level
      # `#![allow(clippy::*)]` attributes when that cfg is false, but their
      # crate-level `//!` docs are still linted, so pedantic doc lints fire
      # ONLY in this configuration — invisible to both the default-features
      # pass above and the postgres-feature job's fully-compiled pass.
      - name: Clippy (all targets, sal — cfg-stripped doc-lint class)
        run: cargo clippy --all-targets --features sal -- -D warnings -D clippy::all -D clippy::pedantic
      # (#2635) The build-script vetting gate used to run HERE, as a step of
      # this job. It now has its own job below — see the note there for why a
      # step of `lint` was the wrong place for it.

  # Build-script custom-build ledger gate (#2259 / #2635).
  #
  # WHY THIS IS ITS OWN JOB AND CARRIES NO JOB-LEVEL `if:`. Until #2635 this
  # ran as a STEP of `Lint (fmt + clippy)` above, which carries
  # `if: needs.classify.outputs.docs_only != 'true'` and therefore reports
  # `skipped` on a docs-only pull request — and branch protection COUNTS
  # `skipped` AS SATISFIED. A supply-chain gate that a docs-only diff can
  # switch off is not a gate, and "docs-only" is a classifier verdict, not a
  # proof that `Cargo.toml` / `Cargo.lock` are untouched (#2496 is the standing
  # demonstration that the classifier can be wrong).
  #
  # It is deliberately NOT in `c8-precheck.yml` with the other integrity gates:
  # those jobs are toolchain-free with 5-minute timeouts, and this one needs a
  # pinned Rust toolchain plus a registry fetch. Importing that dependency into
  # the workflow carrying nine required contexts would be the wrong trade. Here
  # the toolchain and `Swatinem/rust-cache` are already the house pattern.
  #
  # No `needs:` at all, so rules (b3)/(b4) of scripts/check-required-contexts.sh
  # do not apply, and it always runs — which is the entire point.
  build-script-vetting:
    name: "Build-script custom-build ledger gate (#2635)"
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). This job
    # RESOLVES the dependency graph (`cargo fetch --locked` +
    # `cargo metadata --offline`) and then runs a python verifier; it never
    # COMPILES anything, so the self-hosted nodes' warm `target/` directory buys
    # it nothing. `Swatinem/rust-cache` restores the registry on hosted exactly
    # as it did before #3109.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: Fetch the locked dependency graph
        # `cargo metadata --offline` resolves the complete CROSS-PLATFORM graph,
        # including target-only crates (the windows_* / wasm / haiku families)
        # that no single CI leg compiles — which is exactly the set a
        # target-gated hostile build script would hide in. Fetch first; the
        # verifier then runs offline and content-pinned.
        run: cargo fetch --locked
      - name: Verify every custom-build package is ledgered
        run: python3 scripts/check-build-script-vetting.py
      - name: Self-test (prove the gate is load-bearing)
        # Runs AFTER the gate, mirroring the vendor-literal gate's convention:
        # if the detection logic regresses, this trips even when the ledger
        # happens to be clean. Includes the R-203 leg that runs the FROZEN
        # pre-#2635 ledger-only algorithm over a planted unvetted package and
        # requires it to MISS — so the leg cannot pass tautologically.
        run: python3 scripts/check-build-script-vetting.py --self-test

  # actionlint — workflow-injection guard (#1851, audit follow-up #1855).
  # actionlint's NATIVE expression-injection check flags the #1851 class: an
  # untrusted `${{ github.event.* }}` expression interpolated directly into a
  # `run:` shell block (the fix env-indirects those inputs). shellcheck is
  # disabled (`-shellcheck=`) so the bundled bash-style SC* warnings across the
  # ~15 legacy workflows don't drown out that guard — the injection check is
  # built into actionlint and does not depend on shellcheck. `ubuntu-24.04-arm`
  # is whitelisted via `.github/actionlint.yaml`.
  #
  # #2494 doc-vs-reality fix: previously "Advisory until added to branch
  # protection". It IS required on `release/v1.0.0` now
  # (`actionlint (workflow-injection guard)`) — see the `lint` job's note
  # above for the skipped-counts-as-satisfied consequence and the
  # burn-down allowlist entry.
  actionlint:
    name: actionlint (workflow-injection guard)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). A single
    # container-action step over `.github/workflows/`: no cargo, no Postgres.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.1
        with:
          args: -shellcheck= -color

  # MSRV gate — ai-memory standardizes on Rust 1.98, declared in
  # Cargo.toml `rust-version`. CI's other jobs build on `@stable` (which
  # floats forward), so without this pin the declared floor is never
  # actually exercised: a stray use of a >1.98 API would only surface
  # downstream. This job installs exactly 1.98.0 and `cargo check`s the
  # whole crate against it, failing CI if the real minimum drifts above
  # the declared one.
  #
  # #2494 doc-vs-reality fix: previously "Advisory until added to branch
  # protection". It IS required on `release/v1.0.0` now
  # (`MSRV (Rust 1.98)`) — see the `lint` job's note above.
  #
  # NOTE — this job's context NAME changed from `MSRV (Rust 1.96)` to
  # `MSRV (Rust 1.98)` when the MSRV floor moved to 1.98 (chore/rust-1.98).
  # Renaming a branch-protection-required context requires updating the
  # required-status-check list on `release/v1.0.0` (and the mirrors in
  # scripts/qc-allowlists/ + scripts/test/fixtures/) in lockstep.
  msrv:
    name: MSRV (Rust 1.98)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). Linux
    # warm-cache is no longer a reason to be self-hosted; only the pg tier is.
    # `cargo check --all-targets` over the whole crate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
      - name: cargo check on MSRV
        run: cargo check --all-targets

  # Cross-platform correctness matrix. These job names are required by
  # branch protection on main/develop/release/**, so the jobs MUST run
  # and complete SUCCESS even on docs-only PRs. Per-step `if:` makes the
  # heavy work skip on docs-only diffs while the job still returns green
  # in <30 seconds.
  # v1.0.0 self-hosted 2x2 correctness matrix. {linux-fed, macos-fed} nodes
  # × {sqlite (default features), enterprise-fed (sal-postgres against the
  # always-up native pg18.6+AGE1.8.0+pgvector0.8.6 tier)}. These four
  # `Check (…)` job names are REQUIRED contexts on release/v1.0.0 — declared
  # in scripts/qc-allowlists/required-contexts-release.txt — so all four
  # expansions MUST run and complete SUCCESS even on docs-only PRs; the
  # per-step docs-only guards keep the heavy work off while the contexts
  # still report green in <30s.
  #
  # ONE matrix variable in the NAME (`matrix.leg`) — a hard requirement of
  # scripts/check-required-contexts.sh, whose name-expander resolves EXACTLY
  # one `${{ matrix.<key> }}` per job name (a two-placeholder name is
  # "unexpandable" and fails rule (a)). `leg` carries the display string;
  # `node`/`tier`, supplied by the same `include:` entry, drive `runs-on`
  # and the feature/URL selection without appearing in the name.
  #
  # No GitHub-hosted disk-freeing / swap / simulator-purge steps: those
  # `sudo rm -rf /usr/share/dotnet …` recipes are for the ephemeral hosted
  # images and would DELETE real files on the persistent self-hosted hosts.
  # The enterprise-fed tier is always up on each node, so there is no
  # `services: postgres:` block and no per-PR pg image build.
  check:
    name: Check (${{ matrix.leg }})
    needs: classify
    # RUNNER PLACEMENT — PER-LEG (rule at the head of this file). Only the leg
    # that needs the native pg tier is self-hosted on Linux; the Linux sqlite
    # leg is GitHub-hosted. `runs-on` therefore cannot be a fixed shape, so it
    # comes from the matrix: `runner` is a JSON array of runner LABELS, which
    # `fromJSON` turns into the list `runs-on` wants. A one-element
    # `["ubuntu-latest"]` is the hosted form; `["self-hosted","linux-fed"]` is
    # the label-set form. macOS is unchanged (operator directive is Linux-only).
    runs-on: ${{ fromJSON(matrix.runner) }}
    # #1487 — bound the job so a wedged test (e.g. a stalled HF-Hub model
    # download on the semantic-tier CLI recall path) fails fast instead of
    # pinning a runner for hours.
    #
    # PER-LEG (#3139), because the legs no longer share a runner class and a
    # single cap sized for the slowest one is a 35-minute blind spot on the
    # fastest. Values and their basis:
    #
    #   ubuntu-latest,sqlite      55  Pre-#3109 this exact workload ran on this
    #                                 exact runner class under a 45-min cap and
    #                                 passed (`Check (ubuntu-latest)`), so 45 is
    #                                 a MEASURED hosted value, not an f2 value.
    #                                 The 2x2 rewrite added the release build +
    #                                 `cargo audit` steps to the leg, so +10.
    #                                 The 1500s (25 min) sqlite watchdog stays
    #                                 well inside it.
    #   linux-fed,enterprise-fed  80  Unchanged. Compile ~12 min (hoisted
    #                                 OUTSIDE the per-invocation watchdog) plus
    #                                 the 3300s (55 min) hang-watchdog can
    #                                 legitimately approach ~67 min, so the
    #                                 outer cap must sit above that — the
    #                                 watchdog, not the job cap, must be what
    #                                 fires on a genuine hang (a job-level
    #                                 cancel is silent and nameless, the exact
    #                                 #1492 failure mode). #3139 proposed 60 for
    #                                 the self-hosted compile+test jobs; 60 is
    #                                 BELOW compile+watchdog here, so applying
    #                                 it to this leg would re-introduce #1492.
    #                                 It also no longer needs the contention
    #                                 headroom #3139 measured: this is now the
    #                                 ONLY Linux `check` leg on the fleet.
    #   macos-fed,*               80  Unchanged. With the #3140 watchdog fix
    #                                 below, a macOS hang is now cut at the
    #                                 per-invocation cap instead of burning
    #                                 this whole 80-min budget (#3140 observed
    #                                 72 wasted minutes on a nondeterministic
    #                                 `Check (macos-fed,sqlite)` hang).
    #                                 #3461 raised the macos-fed SQLITE
    #                                 per-invocation cap to 2400s; compile is
    #                                 hoisted outside it (#2657) and 2400s
    #                                 (40 min) still sits well inside this 80,
    #                                 so the named watchdog, not a nameless
    #                                 job-level cancel, is still what fires.
    timeout-minutes: ${{ matrix.timeout }}
    env:
      # Debuginfo budget for this job — the heaviest compile in CI (~600
      # integration test binaries per leg).
      #
      # #3453/#3461 — `1` is cargo's "limited" level, NOT line tables (the
      # comment this replaces was wrong: `line-tables-only` is a distinct,
      # strictly smaller setting). Limited debuginfo produced 100-400 MB test
      # binaries, which (a) filled the f2 root filesystem — 350 GB of
      # `target/debug/deps` across two runners, until rust-lld died with
      # `ld terminated with signal 7 [Bus error]` on a full disk (#3453) — and
      # (b) charged the link time to the macOS full-suite job that then blew
      # the #1492 watchdog (#3461). `line-tables-only` keeps file:line in every
      # backtrace and panic location (the only debuginfo CI actually reads;
      # nothing here runs a debugger) at roughly a third of the size and link
      # cost. DECLARED HERE, in the workflow, deliberately: a runner-side
      # `.env` is per-node operator state that no repo change can preserve or
      # audit, so a re-imaged or added runner would silently regress.
      #
      # TEST is set explicitly alongside DEV because the `test` profile only
      # INHERITS `dev` while nothing overrides it — a leg that overrides
      # CARGO_PROFILE_DEV_DEBUG (the hosted low-mem step below) would otherwise
      # leave the test profile at this value. Both are stated at every point
      # they are set, so the pair can never drift apart.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # 2x2 via `include:` so the single name variable `leg` co-varies with
        # `runner` (runs-on labels), `node` (a descriptive tag used by the
        # macOS-only prebuild step + the artifact name) and `tier`
        # (feature/URL selection).
        include:
          # `leg` carries NO whitespace: scripts/check-required-contexts.sh's
          # name-expander word-splits matrix values on IFS, so a space in the
          # value would fracture the expanded context name. Comma-without-space
          # keeps both dimensions legible while staying one token.
          #
          # NAME CHANGE (operator directive 2026-08-22): this leg was
          # `linux-fed,sqlite`. `linux-fed` is a self-hosted RUNNER LABEL, so
          # the old name asserted a node this leg no longer runs on — the name
          # would have become false the moment the leg moved to the hosted
          # pool. Renamed rather than kept, and the required-context mirror
          # `scripts/qc-allowlists/required-contexts-release.txt` is updated in
          # lockstep. This is the ONLY context name that changes.
          - leg: ubuntu-latest,sqlite
            runner: '["ubuntu-latest"]'
            node: ubuntu-latest
            tier: sqlite
            timeout: 55
            # `once` marks the ONE leg that carries the 2x2-invariant extras
            # (cargo-audit, the release-profile smoke build) so they do not
            # multiply across four legs. It is an explicit flag rather than a
            # `matrix.node == '<label>'` comparison ON PURPOSE: those
            # comparisons silently stopped matching when this leg was renamed
            # from `linux-fed` to `ubuntu-latest`, which would have switched
            # `cargo audit` — a supply-chain control — off with no signal at
            # all. A named flag cannot drift out of a rename.
            once: true
          - leg: linux-fed,enterprise-fed
            runner: '["self-hosted","linux-fed"]'
            node: linux-fed
            tier: enterprise-fed
            timeout: 80
          - leg: macos-fed,sqlite
            runner: '["self-hosted","macos-fed"]'
            node: macos-fed
            tier: sqlite
            timeout: 80
          - leg: macos-fed,enterprise-fed
            runner: '["self-hosted","macos-fed"]'
            node: macos-fed
            tier: enterprise-fed
            timeout: 80
    steps:
      # 2026-08-26 rigid-security-controls: a fork PR must NEVER have its code
      # checked out on a self-hosted node (f2 = the operator's home gateway,
      # f1 = the macOS fed node). Primary control is the repository's Actions
      # policy "require approval for all external contributors"; this step is
      # the defence-in-depth for an accidental "Approve and run" — it fails the
      # self-hosted legs BEFORE `actions/checkout` so no fork code lands on the
      # node. GitHub-hosted legs are unaffected (no secrets, ephemeral VM).
      # STEP-level, not job-level: this is a matrix job carrying required
      # contexts and rule (b1) of scripts/check-required-contexts.sh forbids a
      # job-level `if:` here (#2494 wedge class).
      - name: Fork-PR refusal (self-hosted legs never run fork code)
        if: needs.classify.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && contains(matrix.runner, 'self-hosted')
        run: |
          echo "::error::Refusing to run fork PR code on a self-hosted runner (leg ${{ matrix.leg }})."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: docs-only short-circuit
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "::notice::docs-only PR — ${{ matrix.leg }} matrix leg is a no-op"

      # #2452 — tests/conformance_readers.rs is FAIL-CLOSED: an absent
      # python3/node is a test FAILURE, not a silent pass. This job now spans
      # BOTH runner classes, so the guarantee is met two ways:
      #
      #   HOSTED  — PROVISION with actions/setup-python / actions/setup-node,
      #             the #2452 pattern. The interpreters are pinned, not
      #             inherited from whatever the image happens to ship.
      #   FLEET   — ASSERT presence instead. Those actions try to populate the
      #             GitHub-hosted RUNNER_TOOL_CACHE default
      #             (/Users/runner/hostedtoolcache), which the `fate`/`fate_two`
      #             runner user cannot create (`mkdir: /Users/runner: Permission
      #             denied`), and RUNNER_TOOL_CACHE is runner-managed so .env
      #             cannot override it. The nodes ship python3 + node on PATH
      #             (f1 /opt/homebrew/bin python3 3.14 + node v26), so assert —
      #             same fail-closed guarantee (an absent tool reds the step),
      #             no tool-cache write.
      #
      # The dedicated self-tested proof lives in c8-precheck.yml
      # (`Non-Rust conformance-reader proof gate (#2452)`), on the hosted pool.
      # RESTORED (operator directive 2026-08-22) together with this leg's move
      # back to `ubuntu-latest`. #3109 removed it as a hosted-image hack — true,
      # and precisely why it must come back with the hosted image. It is
      # LOAD-BEARING for this leg specifically, on measured evidence: run
      # 31911087758 died here with `rustc-LLVM ERROR: No space left on device`
      # before the reclaim was widened (#2960/#1810), and #1407 added the 8 GB
      # swapfile because the lib-test LINK step hit `ld … signal 7 [Bus error]`
      # against the hosted ~7 GB RAM ceiling. This is the heaviest job in CI —
      # full integration compile at DEV_DEBUG=1 plus a release build.
      #
      # The `if:` is keyed on `runner.environment == 'github-hosted'`, NOT on a
      # matrix value: this step deletes SYSTEM PATHS, and on an ephemeral hosted
      # image that is routine while on the persistent fleet it would destroy
      # real files. Keying it to the runner CLASS makes that structural — no
      # future matrix edit can route it onto a self-hosted node.
      #
      # ORDERING IS LOAD-BEARING: it frees $AGENT_TOOLSDIRECTORY, so it must run
      # BEFORE the setup-python / setup-node steps that repopulate exactly the
      # versions the #2452 conformance readers need.
      - name: Free disk before tests (hosted image only, #1407/#1405/#1387 fix)
        if: needs.classify.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "::group::Disk usage before cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet              || true  # ~17 GiB
          sudo rm -rf /opt/hostedtoolcache/CodeQL    || true  # ~5 GiB
          sudo rm -rf /usr/local/lib/android         || true  # ~13 GiB
          sudo rm -rf /opt/ghc                       || true  # ~5 GiB
          sudo rm -rf /usr/local/.ghcup              || true  # ~6 GiB (#1810)
          # #2960 — the existing pruning above (dotnet/CodeQL/android/ghc/
          # ghcup) was no longer enough headroom for the grown ~200k-LOC +
          # ~600-dep debug test-compile: run 31911087758 died with
          # `rustc-LLVM ERROR: No space left on device` on this Check
          # (ubuntu-latest) leg. Bring the Check reclaim up to parity with
          # the (heavier, already-passing-on-space) Postgres + Coverage
          # legs and additionally free the whole tool cache
          # ($AGENT_TOOLSDIRECTORY = /opt/hostedtoolcache, ~10 GiB of
          # Python/Node/Go/Ruby/PyPy) — safe here because setup-python /
          # setup-node run AFTER this step and repopulate exactly the
          # versions the conformance readers (#2452) need. Pure first-party
          # shell per the no-external-code-injection rule; each rm is
          # best-effort so a shifting runner image never fails the step.
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-}"    || true  # ~10 GiB (#2960)
          sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/google /usr/lib/jvm /opt/microsoft \
                      /usr/share/swift /usr/share/miniconda || true  # ~15 GiB (#2960)
          sudo docker system prune -af --volumes     || true  # ~4 GiB (#1810)
          sudo apt-get autoremove --purge -y         || true
          sudo apt-get clean
          # #1810 — bring the Check job's pre-test disk cleanup up to parity
          # with the (passing, heavier-llvm-cov) Coverage job, which already
          # frees `.ghcup` + docker images. The full `cargo test` compile of
          # all integration bins under DEV_DEBUG=1 (full debug symbols)
          # exhausted the ubuntu runner disk on c3087e33 with
          # `rustc-LLVM ERROR: No space left on device`; the extra ~10 GiB
          # restores headroom. macOS Check + Coverage were unaffected.
          # #1407 — add swap on /mnt (ephemeral data disk) so the
          # heavy lib-test link step has headroom above the ~7 GB RAM
          # ceiling and stops dying with `ld ... signal 7 [Bus error]`.
          # Mirrors the postgres-feature / coverage swap recipe.
          # 2026-08-28 — 8G was not enough: 605ae49c rerun of this
          # REQUIRED Check (ubuntu-latest,sqlite) leg died with
          # `collect2: fatal error: ld terminated with signal 7
          # [Bus error], core dumped` on the hosted 14/16 GB image
          # (prior attempt was ENOSPC). 16G is still well inside
          # /mnt on the hosted image; combined with CARGO_BUILD_JOBS=1
          # on this leg only (step below) it serialises rustc/ld so
          # peak RSS stays under the hosted ceiling. Do NOT apply
          # CARGO_BUILD_JOBS=1 to self-hosted legs (operator topology:
          # f2 is pg-tier only; macos-fed already covers sqlite on
          # capable HW).
          sudo fallocate -l 16G /mnt/swapfile-1407
          sudo chmod 600 /mnt/swapfile-1407
          sudo mkswap /mnt/swapfile-1407
          sudo swapon /mnt/swapfile-1407
          echo "::group::Disk + memory after cleanup"
          df -h /
          free -h
          echo "::endgroup::"

      # #2960 — macOS reclaim. The macos-latest image ships a large bundled
      # iOS/tvOS/watchOS Simulator runtime set (each ~7-13 GiB) that a
      # pure-Rust host build + test suite never touches, plus their caches.
      # Freeing them before any cargo/toolchain step gives the grown
      # ~200k-LOC debug test-compile headroom on the same
      # `rustc-LLVM ERROR: No space left on device` class the ubuntu leg
      # hit (run 31911087758). Pure first-party shell (no external action)
      # per the no-external-code-injection rule; every rm is best-effort so
      # a shifting runner image never fails the step. The df -h before/after
      # makes the freed space (or a non-disk root cause) visible in the log.

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: needs.classify.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.classify.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        with:
          node-version: '22'
      - name: Ensure python3 + node present (self-hosted; #2452 fail-closed)
        if: needs.classify.outputs.docs_only != 'true' && runner.environment != 'github-hosted'
        shell: bash
        run: |
          command -v python3 >/dev/null || { echo "::error::python3 not on PATH on $RUNNER_NAME"; exit 1; }
          command -v node    >/dev/null || { echo "::error::node not on PATH on $RUNNER_NAME"; exit 1; }
          echo "python3=$(python3 --version) node=$(node --version)"

      # FAIL CLOSED if rustup is missing on a self-hosted node — see the
      # `lint` job in ci.yml for the full rationale (#3128 / restore #3293).
      - name: Assert rustup is provisioned (self-hosted; fail-closed #3128)
        if: runner.environment != 'github-hosted' && needs.classify.outputs.docs_only != 'true'
        shell: bash
        run: |
          test -x "$HOME/.cargo/bin/rustup" || {
            echo "::error::rustup is not provisioned at \$HOME/.cargo/bin/rustup on $RUNNER_NAME — repair the node."
            exit 1
          }
      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        if: needs.classify.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.classify.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        with:
          # CI-speed (#3089) — SAVE the cache only on trunk `push` events
          # (push.branches = main/develop/release/**). `pull_request` and
          # `merge_group` runs RESTORE the warm trunk cache but never SAVE, so
          # (a) a failed/partial PR compile cannot poison the shared cache
          # (the "save-always: false" property) and (b) per-PR caches do not
          # evict the trunk cache under GitHub's 10 GB/repo LRU limit, keeping
          # the hit-rate high across PRs. Worst case degrades to a colder
          # cache (slower, never wrong). rust-cache@v2 is the repo's existing
          # house action — no new/unpinned Action is introduced.
          save-if: ${{ github.event_name == 'push' }}

      # v0.9.0 pre-GA (#1853) — e1 macOS anti-flake. The
      # tests/e1_orchestration_dry_run.rs harness historically ran a NESTED
      # `cargo build --release` for the tools/t0-orchestrate sibling crate
      # INSIDE the test process; on the resource-constrained macOS runner
      # that nested build intermittently failed, false-redding the whole
      # Check (macos-latest) gate. Build the tool binary HERE — as its own
      # step, with nothing else competing for the runner — and advertise it
      # via AI_MEMORY_T0_ORCHESTRATOR_BIN; the test uses the artifact and
      # skips the nested build (falling back to building when unset, so
      # local runs and the other OSes are unchanged). macOS-only: the
      # nested build never flaked on ubuntu, and skipping the step there
      # keeps the tool build off the ubuntu critical path.
      - name: Prebuild t0 orchestrator (macOS e1 anti-flake, #1853)
        if: needs.classify.outputs.docs_only != 'true' && matrix.node == 'macos-fed'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet --release \
            --manifest-path tools/t0-orchestrate/Cargo.toml \
            --target-dir .local-runs/ci-prebuilt-t0
          BIN="$PWD/.local-runs/ci-prebuilt-t0/release/ai-memory-t0"
          test -x "$BIN"
          echo "AI_MEMORY_T0_ORCHESTRATOR_BIN=$BIN" >> "$GITHUB_ENV"
          echo "::notice::[#1853] e1 orchestrator prebuilt at $BIN"

      # v0.7.0 Task #12 (#1399) — test-impact-aware test dispatch.
      # ALWAYS runs `cargo test --lib` so every inline `#[cfg(test)] mod
      # tests` in `src/` exercises on every push (huge surface, one
      # compile-once / link-once pass). Then dispatches the slow
      # `tests/*.rs` integration binaries selectively:
      #   __ALL__   → `cargo test` (full suite, the v0.6.x posture)
      #   __SKIP__  → no-op (docs-only diff)
      #   <names>   → `cargo test --lib --test t1 --test t2 ...`
      # The `classify` job's foundational-fallback list (in
      # scripts/ci-test-impact.sh) HARD-FORCES __ALL__ on any change
      # to a cross-cutting surface (Cargo.toml, src/lib.rs, schema
      # migrations, SAL trait, MCP dispatch, etc.) — false-positive
      # is always preferred over false-negative per discipline rule.
      # Parity-test invariants (route_count_invariant,
      # cli_subcommand_count_invariant, memory_link_relation_count_invariant,
      # etc.) are always-on in the impact set so cross-cutting drift
      # the heuristic might otherwise miss still fails the build.
      # v1.0.0 self-hosted 2x2 — enterprise-fed tier wiring. Only the
      # `enterprise-fed` legs point at the node's always-up native pg tier
      # (pg18.6 + AGE 1.8.0 + pgvector 0.8.6, TLS verify-full). The URL lives
      # ONLY on that node's disk ($HOME/.ai-memory-ci-fed-url); reading it into
      # $GITHUB_ENV switches on the `sal-postgres` integration cells. The
      # `sqlite` legs deliberately leave AI_MEMORY_TEST_POSTGRES_URL UNSET so
      # the pg-gated tests self-skip and the default (sqlite-bundled) build is
      # what is exercised. psql for the native tier lives under a
      # platform-specific prefix; prepend whichever exists.
      # v1.0.0 per-job ephemeral database (concurrent-runner safety). With 4
      # linux-fed + 3 macos-fed runner instances, multiple pg jobs can run on
      # ONE node at once. Pointing every job at the shared `ai_memory_test`
      # base db would collide (concurrent CREATE/DROP schema + shared tables ->
      # flaky). Instead each enterprise-fed leg CREATEs its OWN uniquely-named
      # db on the native tier, points the tests at it, and DROPs it in the
      # always() cleanup step below. The base `ai_memory_test` is used ONLY as
      # a maintenance connection to issue CREATE/DROP DATABASE. Fail-closed:
      # a missing URL file or a failed CREATE reds the leg.
      - name: Configure enterprise-fed tier (per-job ephemeral db, enterprise-fed legs only)
        if: needs.classify.outputs.docs_only != 'true' && matrix.tier == 'enterprise-fed'
        shell: bash
        env:
          # matrix.leg via env (never inlined into the script body) so the
          # actionlint expression-injection guard stays satisfied; sanitised
          # in-shell below into a pg-identifier-safe suffix.
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          # psql lives under a platform-specific prefix. Prepend it to
          # GITHUB_PATH (for LATER steps: the test run + the always() cleanup)
          # AND to THIS step's own PATH (GITHUB_PATH does not affect the current
          # step) so the CREATE DATABASE below can find psql.
          for d in /usr/lib/postgresql/18/bin /opt/homebrew/opt/postgresql@18/bin; do
            if [ -d "$d" ]; then
              echo "$d" >> "$GITHUB_PATH"
              PATH="$d:$PATH"
            fi
          done
          export PATH
          url_file="$HOME/.ai-memory-ci-fed-url"
          if [ ! -f "$url_file" ]; then
            echo "::error::enterprise-fed leg on $RUNNER_NAME is missing $url_file — the native pg tier URL is not provisioned on this node"
            exit 1
          fi
          base_url="$(cat "$url_file")"
          # Unique db name: valid pg identifier (lowercase, [a-z0-9_], <=63
          # chars). run_id+attempt make it unique across concurrent runs; the
          # sanitised matrix leg keeps the two enterprise-fed legs distinct and
          # never sharing a name with the cert-postgres-age job.
          leg_sanitized="$(printf '%s' "$LEG" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '_')"
          CI_FED_DB="$(printf '%s' "ai_memory_test_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${leg_sanitized}" | cut -c1-63)"
          # Compute-once, pass to the cleanup step via $GITHUB_ENV so create
          # and drop use the byte-identical name.
          echo "CI_FED_DB=$CI_FED_DB" >> "$GITHUB_ENV"
          # Create the ephemeral db on the base tier (connected to ai_memory_test).
          if ! psql "$base_url" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$CI_FED_DB\";"; then
            echo "::error::enterprise-fed leg on $RUNNER_NAME failed to CREATE DATABASE $CI_FED_DB on the native tier"
            exit 1
          fi
          # Rewrite the base URL's db-name path segment (the last path segment,
          # before any '?') to the ephemeral db, preserving every query param
          # (sslmode/sslrootcert). The db name is [a-z0-9_] so needs no encoding.
          case "$base_url" in
            *\?*) q="?${base_url#*\?}"; head="${base_url%%\?*}" ;;
            *)    q=""; head="$base_url" ;;
          esac
          new_url="${head%/*}/${CI_FED_DB}${q}"
          # Provision the ephemeral db's extensions (the tier role is SUPERUSER).
          if ! psql "$new_url" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS age; CREATE EXTENSION IF NOT EXISTS vector;"; then
            echo "::error::enterprise-fed leg on $RUNNER_NAME failed to create age/vector extensions in $CI_FED_DB"
            exit 1
          fi
          echo "AI_MEMORY_TEST_POSTGRES_URL=$new_url" >> "$GITHUB_ENV"
          echo "::notice::[enterprise-fed] created ephemeral db $CI_FED_DB on the native tier ($RUNNER_NAME) and pointed AI_MEMORY_TEST_POSTGRES_URL at it"

      # Isolation shot after e380ca5d: mold + debuginfo=0 linked and RAN
      # the sqlite suite, then `hot_swap_llm_2166` SIGSEGV'd. That binary
      # does NOT load candle weights (hermetic OllamaClient, #2166/#2172);
      # #2469 already recorded it aborting in CI on GNU ld (exit 101, no
      # test lines) — so this is likely the latent flake now that the
      # suite actually runs, NOT a candle model-load OOM. One clean
      # isolation: drop mold, keep debuginfo=0 + CARGO_BUILD_JOBS=1 +
      # system ld.bfd. If it LINKS and still SIGSEGV → not mold, escalate
      # / quarantine #2469. If it ld-SIGBUS again → mold is still needed
      # for link and the SIGSEGV is independent. Hosted sqlite only.
      - name: Low-mem hosted sqlite link (debuginfo=0, system ld — mold isolation)
        if: needs.classify.outputs.docs_only != 'true' && matrix.leg == 'ubuntu-latest,sqlite'
        run: |
          {
            echo "CARGO_BUILD_JOBS=1"
            echo "CARGO_PROFILE_DEV_DEBUG=0"
            # #3461 — the job-level env now sets CARGO_PROFILE_TEST_DEBUG
            # explicitly, so the `test` profile no longer inherits the `dev`
            # override above. State the 0 here too, or this leg would silently
            # regain debuginfo on exactly the binaries whose link it is
            # isolating.
            echo "CARGO_PROFILE_TEST_DEBUG=0"
            echo "RUSTFLAGS=-C debuginfo=0"
          } >> "$GITHUB_ENV"

      - name: Run tests (impact-aware)
        if: needs.classify.outputs.docs_only != 'true'
        env:
          AI_MEMORY_NO_CONFIG: "1"
          TIER: ${{ matrix.tier }}
          # #3461 — the watchdog budget is a property of (node, tier), not of
          # tier alone: the macos-fed sqlite leg runs the same suite as the
          # hosted ubuntu one on slower, shared hardware. Named CI_NODE rather
          # than NODE so it cannot collide with the `NODE` variable some
          # JavaScript tooling reads as a path to the node binary.
          CI_NODE: ${{ matrix.node }}
          TEST_IMPACT: ${{ needs.classify.outputs.test_impact }}
          TEST_IMPACT_REASON: ${{ needs.classify.outputs.test_impact_reason }}
          TEST_IMPACT_COUNT: ${{ needs.classify.outputs.test_impact_count }}
          TEST_IMPACT_TOTAL: ${{ needs.classify.outputs.test_impact_total }}
        shell: bash
        run: |
          set -euo pipefail
          # v1.0.0 2x2 — tier-parametrised feature/thread selection. The
          # `enterprise-fed` legs add `--features sal-postgres` and serialise
          # DDL with `-- --test-threads=1` (the sal-postgres suite shares one
          # database); the `sqlite` legs run the default build. $FEAT/$TAIL are
          # word-split intentionally (no spaces inside their tokens) so the
          # exact `cargo test --no-fail-fast $FEAT "$@" $TAIL` shape below stays
          # a single line the #2500 --no-fail-fast invariant gate can see.
          FEAT=""
          TAIL=""
          # #1492 hung-test watchdog cap (seconds), TIER- and NODE-AWARE
          # (#3461 made it node-aware; see the sqlite branch below). The
          # `sqlite` legs run the default suite in PARALLEL and finish fast, so
          # 1500s is ample hang-detection headroom on the hosted ubuntu runner
          # — but NOT on the shared macos-fed node, which gets 2400s below.
          # The `enterprise-fed` legs run
          # the sal-postgres suite SINGLE-THREADED (`-- --test-threads=1`, to
          # serialise the shared-database DDL) — the exact discipline the
          # release `postgres-feature` job uses, which measured a ~1605s
          # runtime under a 2100s cap on a DEDICATED GitHub-hosted runner.
          # On the self-hosted 2x2 the enterprise-fed leg runs CPU-CONTENDED
          # (its sibling `sqlite` leg saturates every core of the same host
          # while this leg is pinned to one), so the serialised run measured
          # ~2231s on run 32515454158 (`--lib` 1019s directly timed +
          # ~1212s integration extrapolated from 250/630 binaries reached
          # before the old 1500s cap killed it — record_stop_r45_1955, being
          # alphabetically late, never even started). 1500s therefore killed
          # a suite that was still actively PASSING — the same class of
          # regression the postgres-feature job already fixed by raising its
          # cap. Because BOTH linux legs land on the SAME host (this leg pinned
          # to one core while its sibling saturates the rest), that ~2231s is
          # the NORMAL max-contention case, not an outlier, and other f2 jobs
          # push it higher — so 3300s (~1.48x the measured runtime) buys real
          # variance headroom rather than a knife-edge margin. The cap must
          # stay a hang-detector, so the job-level `timeout-minutes` is the
          # outer bound (see that key on this job).
          WATCHDOG_SECS=1500
          if [ "${TIER:-sqlite}" = "enterprise-fed" ]; then
            FEAT="--features sal-postgres"
            TAIL="-- --test-threads=1"
            WATCHDOG_SECS=3300
            echo "::notice::[enterprise-fed] cargo test $FEAT ... $TAIL (watchdog ${WATCHDOG_SECS}s)"
          else
            # #3461 — macos-fed sqlite is NODE-aware on top of the tier. On
            # e06961ca the full suite was terminated at 1500s with ZERO failing
            # tests: 581 binaries had reported `test result: ok` and the kill
            # landed mid-`tests/recall_observations.rs`. The same leg on
            # e35ce473 an hour earlier finished the whole job in 26m48s, i.e.
            # the RUN was already within a minute or two of the cap and #3364's
            # new tests tipped it over. That is a suite that grew, not a hang —
            # and a watchdog that fires on a healthy suite reports a hang that
            # did not happen, which misdirects triage exactly as #2657
            # described. 2400s is ~1.6x the measured runtime: real variance
            # headroom on shared hardware, still far short of the 80-minute
            # (4800s) job cap, so the watchdog — not a silent, nameless
            # job-level cancel — remains what fires on a genuine hang.
            #
            # RAISED RATHER THAN SPLIT. Splitting the macOS `__ALL__`
            # invocation in two would mean hand-enumerating ~600 `--test`
            # names (or a shell-side partition of them) that drifts out of date
            # the moment a tests/*.rs file is added, and it would break the
            # single `cargo test --no-fail-fast "$@"` shape the #2500 and #2657
            # invariant gates pin. Raising one integer keeps the hang-detection
            # intent intact with nothing new to maintain.
            #
            # The linux tiers are UNCHANGED: ubuntu-latest,sqlite keeps 1500s
            # (a hosted runner that finishes well inside it) and
            # linux-fed,enterprise-fed keeps its 3300s above.
            if [ "${CI_NODE:-}" = "macos-fed" ]; then
              WATCHDOG_SECS=2400
            fi
            echo "::notice::[sqlite] cargo test (default features) (watchdog ${WATCHDOG_SECS}s, node=${CI_NODE:-unknown})"
          fi
          # Durable audit artifact (#4): tee ALL test output to a per-leg log
          # that the next step uploads. PIPESTATUS[0] preserves the real test
          # exit code through the tee pipe (pipefail would otherwise mask it).
          RESULT_LOG="${RUNNER_TEMP:-/tmp}/test-output-${TIER:-sqlite}.log"
          echo "TEST_RESULT_LOG=$RESULT_LOG" >> "$GITHUB_ENV"
          run_all() {
          echo "::group::test-impact decision"
          echo "reason: ${TEST_IMPACT_REASON:-unset}"
          echo "count:  ${TEST_IMPACT_COUNT:-unset} / ${TEST_IMPACT_TOTAL:-unset}"
          echo "impact: ${TEST_IMPACT:-unset}"
          echo "::endgroup::"

          # #1492 hung-test watchdog. libtest has no built-in per-test
          # timeout, so a single wedged integration test (e.g. an ephemeral
          # TCP port-bind / wait_for_ready race) used to stall this step
          # silently until the job-level `timeout-minutes` killed it —
          # wasted budget and ZERO diagnosability (the hung test's name never
          # printed). Wrap each invocation in GNU `timeout` (cap = the
          # tier-aware $WATCHDOG_SECS set above) so a hang fails the STEP fast
          # (< the job cap) with a named ::error:: pointing at the logged
          # impact set, instead of a silent job-level cancel. SIGTERM lets
          # libtest flush partial output; --kill-after escalates to SIGKILL
          # for a truly wedged process.
          #
          # PLATFORM DETECTION, NOT A PLATFORM GATE (#3140 item 2). This block
          # used to be wrapped in `if [ "$RUNNER_OS" = "Linux" ]`, because the
          # #1492 hang was first seen on ubuntu and macOS ships no GNU
          # `timeout` (coreutils, when installed, is g-prefixed `gtimeout`) —
          # bare detection would have crashed the step with
          # `timeout: command not found`.
          #
          # That gate cost 72 minutes on 2026-08-22: `Check (macos-fed,sqlite)`
          # (run 32565464216) went silent after its last unit test and burned
          # the ENTIRE 80-minute job cap before a nameless job-level cancel —
          # the exact diagnosability failure #1492 exists to prevent, on the
          # one platform the watchdog was switched off. `coreutils` is now
          # installed on both f1 runners, so DETECT the binary on every
          # platform instead of gating on the OS: `gtimeout` if present, else a
          # `timeout` that identifies itself as coreutils. Where neither exists
          # the step still degrades to a bare `cargo test` and the job-level
          # `timeout-minutes` remains the universal backstop, so a node without
          # coreutils loses hang-NAMING, never correctness.
          TIMEOUT_BIN=""
          if command -v gtimeout >/dev/null 2>&1; then
            TIMEOUT_BIN=gtimeout
          elif timeout --version 2>/dev/null | grep -qi coreutils; then
            TIMEOUT_BIN=timeout
          fi
          if [ -n "$TIMEOUT_BIN" ]; then
            echo "::notice::[#1492] hung-test watchdog active via '$TIMEOUT_BIN' (${WATCHDOG_SECS}s per invocation, tier=${TIER:-sqlite})"
          else
            echo "::notice::[#1492] watchdog disabled on ${RUNNER_OS:-unknown} — no coreutils gtimeout/timeout found (job-level timeout-minutes still applies)"
          fi
          run_tests() {
            local label="$1"; shift
            local rc=0
            # #3461 — margin telemetry. The 1500s kill on e06961ca was a
            # surprise only because no green run had ever printed how close it
            # came: the step reported the budget and nothing else, so a suite
            # creeping from 20 to 25 minutes was invisible until it crossed the
            # line. Time the WATCHDOGGED window only (the `--no-run` prebuild
            # below is deliberately outside it, #2657) and print elapsed vs
            # budget on every invocation, pass or fail.
            local started elapsed
            # #1989: COMPILE the test binaries OUTSIDE the watchdog first, so
            # the $WATCHDOG_SECS per-invocation cap times test RUNTIME (the
            # hang-detection purpose) rather than compile+run wall-time. The
            # __ALL__ tag path builds ~448 debug integration binaries; that
            # compile legitimately grew past the cap during the v1.0.0 epic,
            # which the watchdog was misreading as a hang (it is not — the full
            # suite runs to completion). The job-level `timeout-minutes` cap
            # still bounds the build. A genuine runtime hang still trips the
            # $WATCHDOG_SECS cap below.
            cargo test --no-run "$@" || return "$?"
            # `--no-fail-fast` (#2500) — see the identical rationale on
            # `pg_test` in the postgres-feature job below. Cargo otherwise
            # exits after the FIRST failing test executable, so on the
            # `__ALL__` path a single transient flake discards the results of
            # every later binary. Probed: the flag does not change the exit
            # code (a failing run stays non-zero), so it cannot mask a real
            # failure — it only stops the run from throwing away evidence.
            # Runtime stays bounded by the $WATCHDOG_SECS per-invocation
            # watchdog below plus the job-level `timeout-minutes`. The tier's feature
            # flag + `-- --test-threads=1` arrive via "$@" from the call sites
            # (folded into $FEAT/$TAIL there), so these two cargo lines stay the
            # exact `... "$@" ...` shape the #2657 / #2500 invariant gates pin.
            started=$(date +%s)
            if [ -n "$TIMEOUT_BIN" ]; then
              "$TIMEOUT_BIN" --signal=TERM --kill-after=60 "$WATCHDOG_SECS" cargo test --no-fail-fast "$@" || rc=$?
            else
              cargo test --no-fail-fast "$@" || rc=$?
            fi
            elapsed=$(( $(date +%s) - started ))
            echo "::notice::[#1492] '${label}' ran ${elapsed}s of the ${WATCHDOG_SECS}s per-invocation watchdog budget ($((elapsed * 100 / WATCHDOG_SECS))% used, $((WATCHDOG_SECS - elapsed))s margin; tier=${TIER:-sqlite} node=${CI_NODE:-unknown} watchdog=${TIMEOUT_BIN:-disabled})"
            if [ "$rc" -ne 0 ]; then
              if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
                echo "::error::[#1492 watchdog] '${label}' exceeded the ${WATCHDOG_SECS}s per-invocation timeout (tier=${TIER:-sqlite}) and was terminated (previously a silent ~34min hang until the job cap). Reproduce with the impact set logged above; then file a follow-up for the specific flaky test."
              fi
              return "$rc"
            fi
          }

          case "${TEST_IMPACT:-__ALL__}" in
            __SKIP__)
              echo "::notice::docs-only diff — test step is a no-op"
              ;;
            __ALL__|"")
              echo "::notice::running FULL test suite (tier=${TIER:-sqlite})"
              # $FEAT/$TAIL are UNQUOTED on purpose: on enterprise-fed they
              # word-split into `--features sal-postgres` before and
              # `-- --test-threads=1` after "$@"; on sqlite both are empty.
              run_tests "full suite (cargo test)" $FEAT $TAIL
              ;;
            *)
              # Always run --lib first (catches every inline unit test)
              echo "::notice::running cargo test --lib + impact-selected integration binaries (tier=${TIER:-sqlite})"
              run_tests "cargo test --lib" $FEAT --lib $TAIL
              # Dispatch each impacted tests/*.rs binary
              ARGS=()
              for t in $TEST_IMPACT; do
                ARGS+=(--test "$t")
              done
              run_tests "impact-selected integration binaries (${TEST_IMPACT})" $FEAT "${ARGS[@]}" $TAIL
              ;;
          esac
          }
          # Run the whole dispatch, teeing to the durable per-leg log. errexit +
          # pipefail (set at the top of this step) stay ON through the pipe: if
          # any run_tests fails, run_all's subshell aborts at that point and the
          # pipeline's non-zero status (pipefail — tee itself exits 0) fails the
          # step. A later passing invocation therefore cannot mask an earlier
          # failure, and the completed pipe flushes the log before the upload
          # step reads it. No `set +e`/PIPESTATUS dance — that would have
          # disabled the fail-fast the invariants depend on.
          run_all 2>&1 | tee "$RESULT_LOG"

      # Durable audit-history artifact (#4). Uploaded on success AND failure so
      # a red leg's full output is retrievable long after the log view expires.
      # A real JUnit XML would require swapping the runner to cargo-nextest —
      # deliberately avoided here so the #1492 watchdog + #2500 --no-fail-fast +
      # impact-aware dispatch invariants keep their exact `cargo test` shape;
      # the captured log is the honest durable record of what ran.
      - name: Upload test results (durable audit history)
        if: needs.classify.outputs.docs_only != 'true' && always() && env.TEST_RESULT_LOG != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.node }}-${{ matrix.tier }}
          path: ${{ env.TEST_RESULT_LOG }}
          if-no-files-found: ignore
          retention-days: 30

      # cargo-audit runs once (the advisory DB is platform-independent) — on
      # the `once` leg so it does not multiply across the 2x2.
      - name: Security audit
        if: needs.classify.outputs.docs_only != 'true' && matrix.once
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # CI-speed: the release build here is only a release-PROFILE compile
      # smoke (opt-level + thin-LTO). The distributable per-OS artifacts are
      # produced by release.yml on tag, and a release-profile-only break that
      # the debug `cargo test` build wouldn't already catch is vanishingly rare
      # for this pure-Rust + bundled-sqlite crate. Run it on the `once` leg
      # so it does not multiply across the 2x2.
      # RESTORED with the hosted move (see the free-disk step above). The
      # release build follows a full debug test compile; pre-#3109 this leg
      # needed the debug artifacts dropped first to fit. Tradeoff, stated: when
      # this job saves the rust-cache (trunk `push` only — `save-if` above), the
      # saved `target/` no longer carries debug artifacts, so PR restores are
      # cooler. That is the pre-#3109 behaviour exactly, and it degrades speed,
      # never correctness. `cargo clean --profile dev` touches only the
      # workspace `target/`, never a system path.
      - name: Trim target/debug before release build (hosted)
        if: needs.classify.outputs.docs_only != 'true' && runner.environment == 'github-hosted'
        run: |
          set -eu
          echo "::group::Disk usage before cargo clean"
          df -h /
          du -sh target 2>/dev/null || true
          echo "::endgroup::"
          cargo clean --profile dev || true
          echo "::group::Disk usage after cargo clean"
          df -h /
          du -sh target 2>/dev/null || true
          echo "::endgroup::"

      # CI-speed: the release build here is only a release-PROFILE compile
      # smoke (opt-level + thin-LTO). The distributable per-OS artifacts are
      # produced by release.yml on tag, and a release-profile-only break that
      # the debug `cargo test` build on ubuntu wouldn't already catch is
      # vanishingly rare for this pure-Rust + bundled-sqlite crate. Running it
      # on ubuntu ONLY takes it off the macos critical path (-~400s) — the
      # prep `cargo clean` step above is already ubuntu-only.

      - name: Build release (once leg — release-profile smoke)
        if: needs.classify.outputs.docs_only != 'true' && matrix.once
        run: cargo build --release

      # Drop the per-job ephemeral db (created by "Configure enterprise-fed
      # tier" above). always() so a failed/cancelled test run still reclaims
      # it. Guarded on CI_FED_DB so it no-ops on the sqlite legs (where it was
      # never set) and if the configure step failed before creating the db.
      - name: Cleanup enterprise-fed ephemeral db
        # always() so a failed/cancelled test run still reclaims the db, but
        # still docs_only-guarded (rule (b3)): on a docs-only run the configure
        # step is skipped, no db is created, so there is nothing to drop.
        if: always() && needs.classify.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CI_FED_DB:-}" ]; then
            echo "::notice::no ephemeral db to drop (CI_FED_DB unset — sqlite leg or configure never ran)"
            exit 0
          fi
          # Re-derive psql on PATH defensively (GITHUB_PATH from the configure
          # step normally carries it, but this step must not depend on that).
          for d in /usr/lib/postgresql/18/bin /opt/homebrew/opt/postgresql@18/bin; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          export PATH
          url_file="$HOME/.ai-memory-ci-fed-url"
          if [ ! -f "$url_file" ]; then
            echo "::warning::cannot drop $CI_FED_DB — $url_file missing on $RUNNER_NAME (leaked ephemeral db)"
            exit 0
          fi
          base_url="$(cat "$url_file")"
          # Connect to the base ai_memory_test to drop the ephemeral db. FORCE
          # terminates any lingering backend so the drop cannot wedge on a
          # still-connected test process.
          if psql "$base_url" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$CI_FED_DB\" WITH (FORCE);"; then
            echo "::notice::dropped ephemeral db $CI_FED_DB on $RUNNER_NAME"
          else
            echo "::warning::failed to drop ephemeral db $CI_FED_DB on $RUNNER_NAME (leaked)"
          fi

  # Postgres feature gate — the `sal-postgres` CLIPPY-parity leg.
  #
  # v1.0.0 self-hosted rewrite. Under the old GitHub-hosted topology this job
  # spun up a `services: pgvector/pgvector:pg16` container and ran the whole
  # sal-postgres integration suite. That coverage now lives in the 2x2 `check`
  # matrix's `enterprise-fed` legs, which run the sal-postgres tests against
  # the node's ALWAYS-UP native pg18.6 + AGE 1.8.0 + pgvector 0.8.6 tier — a
  # truer target than a throwaway pg16 container. So there is no `services:`
  # block, no per-PR pg image, no mold/disk/swap hosted-runner hacks here.
  #
  # What this job still uniquely owns is the CI-parity CLIPPY leg for the
  # `sal-postgres` feature: `clippy --features sal-postgres --tests` at
  # `-D warnings -D clippy::all -D clippy::pedantic`. The `check` matrix
  # COMPILES + RUNS that feature but does not run pedantic clippy over its
  # test targets, and the default-features `lint` job cannot see the
  # postgres-only code paths — so a pedantic regression that only surfaces
  # under `sal-postgres` would otherwise slip through. Keeping the required
  # context name `Postgres feature gate` unchanged means branch protection
  # needs no edit for this job. Retains its job-level `if:` (docs-only skip),
  # tracked in required-contexts-joblevel-if-allow.txt like the other gates.
  postgres-feature:
    name: Postgres feature gate
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). Linux
    # warm-cache is no longer a reason to be self-hosted; only the pg tier is.
    #
    # DESPITE THE NAME, this job does not need the tier: since the #3109 rewrite
    # it does not talk to Postgres at all (no `services:`, no
    # `AI_MEMORY_TEST_POSTGRES_URL`) — the live-tier coverage lives in the
    # `enterprise-fed` legs of `check`. What is left is a
    # `--features sal-postgres --tests` compile for pedantic clippy, which is a
    # cache workload, so under the Linux rule it goes hosted. The context NAME
    # is unchanged, so branch protection is unaffected.
    runs-on: ubuntu-latest
    # #1487 — bound the job so a wedged compile can't pin the runner. 45 is the
    # pre-#3109 value MEASURED on this runner class; #3109 tightened it to 40
    # for a dedicated self-hosted node, which is not this job's world any more.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'
        with:
          # CI-speed (#3089) — save the cache only on trunk `push` events;
          # PR + merge_group runs restore-only. See the `check` job for the
          # full rationale.
          save-if: ${{ github.event_name == 'push' }}

      - name: Clippy (sal-postgres feature, lib + tests)
        run: cargo clippy --features sal-postgres --tests -- -D warnings -D clippy::all -D clippy::pedantic

  # v0.7.0 Posture-1a (issue #1068) — mobile cross-compile gate.
  # Verifies that the `--features sqlite-bundled --lib` build cross-compiles
  # cleanly for the two mobile Rust targets the v0.7.0 §1067 Posture-1a
  # row claims (iPhone via `aarch64-apple-ios`, Android via
  # `aarch64-linux-android`). Catches ~80% of mobile-bit-rot risk: any
  # crate update that drops mobile portability (introduces a pthread-only
  # / OpenSSL / libc-gap dependency, etc.) surfaces here instead of
  # silently breaking integration when a downstream app developer tries
  # to consume the v0.7.x release artifacts. The job is `--lib` only —
  # we never build a CLI binary for mobile; the consumer is FFI from an
  # iOS / Android app. No-ops on docs-only PRs alongside the rest of
  # the heavy matrix. CI cost: ~5-8 min per target on a cold cache, ~1
  # min on a warm cache; well under the $5/mo budget the issue projected.
  #
  # #2494 UN-WEDGE — DO NOT ADD A JOB-LEVEL `if:` TO THIS JOB.
  # `Cross-compile (aarch64-apple-ios)` and
  # `Cross-compile (aarch64-linux-android)` are REQUIRED contexts on
  # `release/v1.0.0`. This job is a `strategy: matrix` job, and GitHub
  # evaluates a job-level `if:` BEFORE matrix expansion — so the former
  # `if: needs.classify.outputs.docs_only != 'true'` made a docs-only PR
  # emit ONE check-run named `Cross-compile (${{ matrix.target }})` while
  # the two required names were NEVER CREATED. An absent required context
  # is `pending` forever and `enforce_admins: true` blocks the admin
  # override, so the branch wedged for every docs-only PR shape (proven
  # live on commit 45ba8741). It now follows the `check` job's pattern:
  # NO job-level `if:` (so it still runs only when `needs: classify`
  # SUCCEEDED — a failed/cancelled classify skips it and the required
  # contexts go absent, which fails CLOSED by blocking the merge rather
  # than reporting green on an unclassified diff), with the docs-only
  # guard on EVERY step. `if: always()` was REJECTED for exactly that
  # reason: it would report success even when classify never ran.
  # `scripts/check-required-contexts.sh` rules (b1)+(b3) enforce both
  # halves statically.
  mobile-cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: classify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS device — cross-compiled on macOS so the Apple SDK
          # (`xcrun --sdk iphoneos --show-sdk-path`) is in place for
          # the C bits of rusqlite's bundled SQLite.
          - target: aarch64-apple-ios
            os: macos-latest
          # Android arm64 — cross-compiled on Linux with the NDK toolchain
          # providing the `aarch64-linux-android-clang` C compiler that
          # rusqlite-sys's build.rs invokes for the bundled SQLite C code.
          - target: aarch64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: docs-only short-circuit
        if: needs.classify.outputs.docs_only == 'true'
        run: echo "::notice::docs-only PR — ${{ matrix.target }} cross-compile is a no-op"

      - name: Install Rust 1.98.0 (target ${{ matrix.target }}, matches rust-toolchain.toml pin)
        if: needs.classify.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.classify.outputs.docs_only != 'true'
        with:
          key: mobile-${{ matrix.target }}

      # Android NDK r26d — provides the clang toolchain we point at via
      # CC_aarch64_linux_android / AR_aarch64_linux_android below so the
      # bundled SQLite C blob compiles against the Android sysroot
      # instead of the host's. r26d is the latest LTS at the time of
      # writing; bumps tracked alongside Rust stable cadence.
      - name: Install Android NDK r26d
        if: needs.classify.outputs.docs_only != 'true' && matrix.target == 'aarch64-linux-android'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Configure NDK toolchain for cargo
        if: needs.classify.outputs.docs_only != 'true' && matrix.target == 'aarch64-linux-android'
        shell: bash
        run: |
          set -euo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TC/aarch64-linux-android24-clang" || {
            echo "::error::NDK clang for android24 not found at $TC"
            ls "$TC" | head -40
            exit 1
          }
          # Bundled SQLite (rusqlite/bundled feature) compiles its C
          # blob via the `cc` crate, which honors the per-target
          # CC_<target_underscores> and AR_<target_underscores> env
          # vars. We point them at the NDK's clang + llvm-ar so the C
          # bits link against the Android sysroot, not the host's.
          # min-sdk 24 (Android 7.0+) — matches the floor v0.7.0
          # Posture-1a documents in ROADMAP §1067.
          {
            echo "CC_aarch64_linux_android=$TC/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$TC/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$TC/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - name: cargo check (--lib --features sqlite-bundled)
        if: needs.classify.outputs.docs_only != 'true'
        run: |
          cargo check \
            --target ${{ matrix.target }} \
            --no-default-features \
            --features sqlite-bundled \
            --lib

  # v0.7.0 Phase D regression closeout — `sal`-only feature gate. The
  # `check` matrix above builds the default (sqlite-bundled only) and
  # `postgres-feature` builds `sal-postgres` (which transitively enables
  # sal). Neither exercises the `sqlite-bundled + sal` combination —
  # the exact build config the A2A campaign workflow + most production
  # daemons use (`cargo build --release --features sal`). A Phase D
  # round caught a real regression here at run 25890925457: two
  # postgres-fanout wire-points were gated `#[cfg(feature = "sal")]`
  # instead of `#[cfg(feature = "sal-postgres")]`, so they compiled
  # under `sal-postgres` (where the symbol exists) AND default (where
  # the cfg gate skips them) but FAILED to compile under sal-only.
  # This job closes that observability gap by exercising the same
  # cargo invocation the A2A workflow uses, plus the four standard
  # gates (clippy / build / lib tests) at the same feature combo.
  # Skipped on docs-only PRs alongside the rest of the heavy matrix.
  sal-feature:
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). Linux
    # warm-cache is no longer a reason to be self-hosted; only the pg tier is.
    # clippy + `cargo build --release --features sal` + `cargo test`.
    name: SAL-only feature gate
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # NOTE the `Free disk` step that #3109 removed (it recursively deleted
    # system paths such as the bundled dotnet SDK to make headroom on the
    # ephemeral hosted image) is deliberately NOT restored. This job has since
    # proven it does not need it, and a step that deletes system paths must
    # never come back on the word of a revert — if hosted disk pressure
    # returns, that is a measured decision with its own change.
    runs-on: ubuntu-latest
    # #1487 — bound the job so a wedged test can't pin the runner. 40 was the
    # pre-#3109 value on this runner class AND the self-hosted value; #3139
    # measured 34.5 min here under low fleet contention and a cancel at 40:15
    # under high contention. On the hosted pool this job is alone on its VM, so
    # the contention term disappears — but 34.5 min against a 40 min cap is a
    # 16% margin, a knife edge on a 2-core VM. 55 restores real headroom without
    # masking a genuine hang (this job has no #1492 watchdog, so its cap is its
    # only bound).
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'

      - name: Clippy (sal feature)
        run: cargo clippy --features sal -- -D warnings -D clippy::all -D clippy::pedantic

      - name: Build release (sal feature)
        run: cargo build --release --features sal

      - name: Run lib tests (sal feature)
        env:
          AI_MEMORY_NO_CONFIG: "1"
        run: cargo test --features sal --lib

  # v1.0.0 #2257 — vectorlite OPT-IN feature gate. The `vectorlite` cargo
  # feature (#1860/#2219; `rusqlite/load_extension` + `src/vectorlite.rs`)
  # is OFF by default and was in NO CI job, so the no-native-lib fail-closed
  # seam contract (`tests/vectorlite_1860.rs`, which needs NO native
  # artifact to compile + run) never compiled on a PR — a bit-rot gap of the
  # v0.8.1 full-feature-matrix lesson. This job compiles + lints + runs the
  # feature-gated surface on every code PR: clippy under the feature (catches
  # the opt-in module + its tests drifting) and the no-native-lib test layer
  # (`vectorlite_1860` — the `#[ignore]`d live-extension layer self-skips).
  # It also runs `config_precedence` under the feature so the #2256
  # feature-gated env-resolution pin is exercised. Skipped on docs-only PRs.
  vectorlite-feature:
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). Linux
    # warm-cache is no longer a reason to be self-hosted; only the pg tier is.
    # `--all-targets --features vectorlite` clippy + two test binaries.
    name: vectorlite feature gate
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # #1487 — bound the job so a wedged test can't pin the runner. 30 is the
    # pre-#3109 value measured on this runner class and is unchanged by #3109.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'

      - name: Clippy (vectorlite feature, all targets)
        run: cargo clippy --all-targets --features vectorlite -- -D warnings -D clippy::all -D clippy::pedantic

      - name: Run vectorlite no-native-lib seam tests (#1860)
        env:
          AI_MEMORY_NO_CONFIG: "1"
        run: cargo test --features vectorlite --test vectorlite_1860

      - name: Run config-precedence under vectorlite (#2256 feature-gated pin)
        env:
          AI_MEMORY_NO_CONFIG: "1"
        run: cargo test --features vectorlite --test config_precedence

  # v0.6.5 — Dockerfile-build smoke. Runs on EVERY push to main / develop /
  # release/** AND on EVERY PR that touches code. Builds the Docker image;
  # does NOT push to GHCR. Catches Dockerfile drift (missing COPY of new
  # files referenced by include_str!, glibc mismatch from build/runtime
  # base drift, etc.) BEFORE we cut a release tag.
  #
  # Retrospective: v0.6.3 added include_str! refs to migrations/sqlite/
  # but the Dockerfile didn't COPY migrations/. v0.6.4's image built
  # but used rust:1.94-slim (trixie, glibc 2.41) on top of bookworm
  # runtime (glibc 2.36) — built but failed at runtime with
  # "version GLIBC_2.39 not found". Both bugs were caught at release
  # time, not PR time. This job closes that gap.
  #
  # Skipped on docs-only PRs — a Dockerfile build can't possibly differ
  # when only /docs/ or *.md changed.
  dockerfile-validate:
    name: Dockerfile build (no push)
    needs: classify
    # RUNNER PLACEMENT — GitHub-hosted (rule at the head of this file). The
    # build happens inside a Docker layer cache backed by `type=gha` (the
    # GitHub Actions cache service), NOT by the self-hosted nodes' `target/`
    # directory — the container build cannot see the host's cargo cache at all,
    # so re-homing it onto the fleet in #3109 consumed a scarce slot for zero
    # cache benefit. It also keeps buildx/BuildKit state off the persistent
    # hosts.
    runs-on: ubuntu-latest
    # Skip on tag pushes — the docker job below handles those (with push).
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && needs.classify.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: ai-memory:ci-validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run --rm ai-memory:ci-validate --version
          docker run --rm ai-memory:ci-validate --help | head -20

  # NOTE (#1993): the former `Code Coverage` job (full `cargo llvm-cov`
  # sweep + sticky PR comment) was REMOVED here to stop it spuriously
  # failing on every substantial PR — the heavy instrumented build died
  # mid-`Generate coverage report` (~22-23 min, disk/wall pressure) and
  # duplicated the authoritative `Per-Module Coverage Thresholds` gate in
  # `.github/workflows/coverage.yml`, which already enforces BOTH the
  # global line floor (`coverage/thresholds.toml [global].min_line_coverage`)
  # AND every per-module floor and now also posts the sticky coverage PR
  # comment. Coverage is owned end-to-end by `coverage.yml`; running the
  # full instrumented sweep twice per PR was pure waste.

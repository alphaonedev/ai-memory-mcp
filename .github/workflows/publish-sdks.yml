name: publish-sdks

# OIDC-based Trusted Publishing for both SDKs.
# - PyPI: pypa/gh-action-pypi-publish using `id-token: write` (no API token).
# - npm: `npm publish --provenance --access public` using `id-token: write`
#   against a Trusted Publisher configured at npmjs.com.
#
# Both jobs declare a GitHub Environment (`pypi-publish` / `npm-publish`).
#
# ⚠ #2467 TRUTH-FIX — those environments have NO protection rules configured
# (`gh api repos/:owner/:repo/environments` -> `protection_rules: []` on both),
# so declaring them does NOT create an approval gate. This comment previously
# asserted "a maintainer must approve each publish", which was false: nothing
# holds a publish for review today. Contrast `github-pages`, which does carry a
# protection rule -- the mechanism works and was simply never applied here.
#
# Adding required reviewers is a repository-SETTINGS change, not a workflow
# change, so it cannot be fixed in this file. Until it is, the prerelease guard
# below is the only thing standing between a tag push and an irreversible
# publish to two public registries.
#
# #2455 — TEST-BEFORE-PUBLISH. This workflow triggers on `push: tags: v*`, so
# cutting the GA tag publishes both SDKs. Before #2455 the steps were
# setup -> build -> publish with NO test step anywhere on the path, while the
# sibling `publish-sdk-shims.yml` deliberately ran each package's suite first.
# Combined with `clients-ci.yml` being path-filtered to `clients/**` (so the
# flagship SDKs were tested by NOTHING at all), a tag cut would have shipped
# untested artifacts to PyPI and npm — unrecoverable, since a published
# version cannot be un-published cleanly. Each job now runs the package's own
# suite BEFORE its build+publish steps; a red suite fails the job and nothing
# is uploaded. `clients-ci.yml` runs the SAME suites on the PR side.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which SDK(s) to publish"
        required: true
        default: "both"
        type: choice
        options: [both, pypi, npm]
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish-pypi:
    # #2467 — PRERELEASE GUARD. `github.event_name == 'push'` alone is true for
    # EVERY `v*` tag, so before this guard `git push origin v1.0.0-rc.1` published
    # the STABLE slot: the SDK versions are hardcoded in the manifests
    # (`sdk/python/ai_memory/_version.py`, `sdk/typescript/package.json`), not
    # derived from the tag. Registry version slots are not reusable -- the 0.9.0
    # slot was burned exactly this way (`987f24fb`), forcing 0.9.0.post1 / 0.9.1.
    #
    # SemVer prereleases carry a hyphen (`v1.0.0-rc.1`, `v1.0.0-alpha.2`); the
    # test mirrors `release.yml`'s preflight (`if [[ "$TAG" == *-* ]]`, :76-82).
    # `release.yml` guards SIX publishing jobs this way but is `workflow_dispatch`-
    # only -- the automatic publisher was the unguarded one.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.target == 'both' || github.event.inputs.target == 'pypi' }}
    name: publish ai-memory to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ai-memory-mcp/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # #2455 — the suite runs BEFORE the build so a red test aborts the job
      # with nothing built and nothing uploaded. Mirrors publish-sdk-shims.yml.
      - name: test (gate the publish)
        working-directory: sdk/python
        env:
          AI_MEMORY_NO_CONFIG: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: build wheel + sdist
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish via PyPI Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          print-hash: true
          # Re-runs (or a tag re-push) must not fail when the version is
          # already on PyPI — the upload is idempotent, not an error.
          skip-existing: true

  publish-npm:
    # #2467 — PRERELEASE GUARD; see the rationale on `publish-pypi` above.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.target == 'both' || github.event.inputs.target == 'npm' }}
    name: publish @alphaone/ai-memory to npm
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@alphaone/ai-memory
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"
      # #2455 — `npm test` (jest + ts-jest) runs BEFORE `npm run build`, so a
      # red suite aborts the job with no `dist/` and nothing published.
      # Mirrors the `install + test + build` shape in publish-sdk-shims.yml.
      - name: install + test + build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm run build
      # Auth via the npm automation token (env-scoped secret on the
      # npm-publish environment). id-token:write still enables --provenance.
      - name: publish to npm (token auth + provenance)
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

name: publish-sdks

# OIDC-based Trusted Publishing for both SDKs.
# - PyPI: pypa/gh-action-pypi-publish using `id-token: write` (no API token).
# - npm: `npm publish --provenance --access public` using `id-token: write`
#   against a Trusted Publisher configured at npmjs.com.
#
# Both jobs declare a GitHub Environment (`pypi-publish` / `npm-publish`).
#
# ⚠ #2467 — WHAT THOSE ENVIRONMENTS ACTUALLY ENFORCE. Declaring an
# `environment:` does NOT by itself create an approval gate; the protection
# rules are repository SETTINGS, not workflow config, so this comment can only
# describe them -- never establish them. Verify, don't trust this text:
#
#     gh api repos/:owner/:repo/environments/pypi-publish --jq .protection_rules
#     gh api repos/:owner/:repo/environments/npm-publish  --jq .protection_rules
#
# As of 2026-07-30 both carry `wait_timer=30` with `can_admins_bypass=false`
# (applied via the API; before/after snapshots committed under
# `governance/control-plane/` by #2507). The `can_admins_bypass=false` half is
# the load-bearing one: with it true the timer is advisory and the same
# identity that pushed the tag can skip it. Until that change BOTH environments
# were `protection_rules: []` -- nothing held a publish for review -- while
# this comment asserted "a maintainer must approve each publish." It was false.
#
# Required REVIEWERS are deliberately NOT configured: the reviewer pool is one
# account (sole collaborator), so required-reviewers would block EVERY publish
# rather than gate one -- the CODEOWNERS deadlock in a new costume (#2475). A
# wait timer cannot deadlock; it always proceeds. (An earlier revision of this
# comment cited `github-pages` as proof "the mechanism works and was simply
# never applied here." That environment carries `branch_policy`, not required
# reviewers -- a different mechanism. The precedent did not say that.)
#
# HONEST SCOPE -- this buys a 30-minute cancellation window, NOT a gate:
#   - no tag protection (`/tags/protection` -> 404) and no tag ruleset (the
#     sole ruleset is `target: "branch"`, so it does not reach tag refs)
#   - `release.yml`'s preflight validates SemVer SHAPE only (:66-82) -- never
#     tag ancestry, never CI status on the tagged commit
# So a stable-shaped tag at ANY commit still publishes after 30 minutes. The
# durable fix is deriving SDK versions from the tag (see the guard below for
# why hardcoded manifests are what makes a wrong tag unrecoverable). Remaining
# controls tracked on #2467.
#
# #2455 — TEST-BEFORE-PUBLISH. This workflow triggers on `push: tags: v*`, so
# cutting the GA tag publishes both SDKs. Before #2455 the steps were
# setup -> build -> publish with NO test step anywhere on the path, while the
# sibling `publish-sdk-shims.yml` deliberately ran each package's suite first.
# Combined with `clients-ci.yml` being path-filtered to `clients/**` (so the
# flagship SDKs were tested by NOTHING at all), a tag cut would have shipped
# untested artifacts to PyPI and npm — unrecoverable, since a published
# version cannot be un-published cleanly. Each job now runs the package's own
# suite BEFORE its build+publish steps; a red suite fails the job and nothing
# is uploaded. `clients-ci.yml` runs the SAME suites on the PR side.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which SDK(s) to publish"
        required: true
        default: "both"
        type: choice
        options: [both, pypi, npm]
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  publish-pypi:
    # #2467 — PRERELEASE GUARD. `github.event_name == 'push'` alone is true for
    # EVERY `v*` tag, so before this guard `git push origin v1.0.0-rc.1` published
    # the STABLE slot: the SDK versions are hardcoded in the manifests
    # (`sdk/python/ai_memory/_version.py`, `sdk/typescript/package.json`), not
    # derived from the tag. Registry version slots are not reusable -- the 0.9.0
    # slot was burned exactly this way (`987f24fb`), forcing 0.9.0.post1 / 0.9.1.
    #
    # SemVer prereleases carry a hyphen (`v1.0.0-rc.1`, `v1.0.0-alpha.2`); the
    # test mirrors `release.yml`'s preflight (`if [[ "$TAG" == *-* ]]`, :76-82).
    # `release.yml` guards SIX publishing jobs this way but is `workflow_dispatch`-
    # only -- the automatic publisher was the unguarded one.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.target == 'both' || github.event.inputs.target == 'pypi' }}
    name: publish ai-memory to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi-publish
      url: https://pypi.org/project/ai-memory-mcp/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # #2455 — the suite runs BEFORE the build so a red test aborts the job
      # with nothing built and nothing uploaded. Mirrors publish-sdk-shims.yml.
      - name: test (gate the publish)
        working-directory: sdk/python
        env:
          AI_MEMORY_NO_CONFIG: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: build wheel + sdist
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish via PyPI Trusted Publisher (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist
          print-hash: true
          # Re-runs (or a tag re-push) must not fail when the version is
          # already on PyPI — the upload is idempotent, not an error.
          skip-existing: true

  publish-npm:
    # #2467 — PRERELEASE GUARD; see the rationale on `publish-pypi` above.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.target == 'both' || github.event.inputs.target == 'npm' }}
    name: publish @alphaone/ai-memory to npm
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@alphaone/ai-memory
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"
      # #2455 — `npm test` (jest + ts-jest) runs BEFORE `npm run build`, so a
      # red suite aborts the job with no `dist/` and nothing published.
      # Mirrors the `install + test + build` shape in publish-sdk-shims.yml.
      - name: install + test + build
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm run build
      # Auth via the npm automation token (env-scoped secret on the
      # npm-publish environment). id-token:write still enables --provenance.
      - name: publish to npm (token auth + provenance)
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

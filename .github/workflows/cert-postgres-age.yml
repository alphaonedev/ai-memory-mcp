# Certified Postgres + Apache AGE + pgvector tier — IN-PR cert evidence (#2548).
#
# v1.0.0 SELF-HOSTED REWRITE (chore/ci-self-hosted-2x2). This job now runs on
# `[self-hosted, linux-fed]` and points AI_MEMORY_TEST_POSTGRES_URL /
# AI_MEMORY_TEST_AGE_URL at the node's ALWAYS-UP native cert tier (pg18.6 +
# AGE 1.8.0 + pgvector 0.8.6, TLS verify-full, port 5445), read from
# $HOME/.ai-memory-ci-fed-url. The former per-PR `docker build`/pull of
# deploy/docker-1461/Dockerfile.pg-age-vector + `docker run` is REMOVED (the
# tier it constructed now exists continuously). The cert EVIDENCE is
# preserved: "Resolve certified stack pins from deploy SSOT" still reads the
# expected versions from deploy/docker-1461/provision/lib.sh, and "Assert
# certified stack versions" still HARD-FAILS on ANY drift from the pinned
# 18.6 / 1.8.0 / 0.8.6 — now measured on the live native tier. The historical
# image-build narrative below is retained for provenance; the mechanics it
# describes were the GitHub-hosted construction path, not what runs today.
#
# WHY THIS WORKFLOW EXISTS. Before #2548 the certified pg+AGE tier was NEVER
# exercised in-PR. The `#[ignore]`-gated postgres/AGE cells ran ONLY in
# `postgres-parity-nightly.yml` (a `schedule:` workflow that fires from the
# DEFAULT branch, not from a PR into `release/**`), and the AGE-backed cells
# self-skip unless `AI_MEMORY_TEST_AGE_URL` is set — so on the certification
# branch nothing proved the certified tier actually works. The 2026-08-01
# cutline ruling §5.4(3) requires EXECUTED evidence on real Postgres + AGE +
# pgvector, at the CERTIFIED versions, on the cert branch. "You cannot certify
# a tier CI does not run", and the ruling forbids "CI-on-16-while-certifying-18".
# This job is what makes §5.4(3) executable: it runs the ignored pg cells AND
# the AGE-backed cells (with the AGE url set, so they stop self-skipping)
# against a LIVE stack pinned to the ONE TRUE certified triple.
#
# ONE DECLARATION SOURCE (#B1 cert-review fix, 2026-08-11). Earlier revisions
# of this job started the STOCK `apache/age:release_PG18_1.7.0` service image
# unmodified (which ships PostgreSQL 18.1, not 18.4) and installed pgvector
# UNPINNED (resolves to whatever the pgdg snapshot currently carries, e.g.
# 0.8.6) — so the docs claiming "the exact triple 18.4/1.7.0/0.8.5 is
# CI-asserted in-PR" OVERCLAIMED what this job actually proved. The fix is to
# make CI run the ACTUAL certified minors rather than weaken the docs: this
# job now BUILDS the real deploy artifact —
# `deploy/docker-1461/Dockerfile.pg-age-vector`, the SAME recipe the
# docker-1461 mesh ships — with build-args resolved from the ONE SSOT,
# `deploy/docker-1461/provision/lib.sh` (`PG_APT_VERSION`, `AGE_APT_VERSION`,
# `PGVECTOR_APT_VERSION`, `AGE_BASE_IMAGE`, `EXPECTED_PG_VERSION`,
# `EXPECTED_AGE_VERSION`), and RUNS that built image as the postgres under
# test — not a `services:` block pointed at the unmodified base image. No
# operative version literal is re-typed in this file: every pin is read from the
# deploy SSOT by the "Resolve certified stack pins" step below and threaded
# through `$GITHUB_ENV` to the build + assert steps. This is the maximal
# "extend prior art, do not fork it" path (CLAUDE.md): the CI evidence and
# the shipped deploy image are now the SAME artifact, so a future SSOT pin
# bump moves both in lockstep with zero drift by construction.
#
# THE ONE TRUE CERTIFIED TRIPLE (SSOT: deploy/docker-1461/provision/lib.sh —
# see also docs/postgres-age-guide.md §"Certified versions"):
#
#   * PostgreSQL   18.6   (EXPECTED_PG_VERSION=18.6; PG_APT_VERSION=18.6-1.pgdg13+2)
#   * Apache AGE   1.8.0  (EXPECTED_AGE_VERSION=1.8.0; AGE_APT_VERSION=1.8.0~rc0-2.pgdg13+1,
#                          installed via pgdg apt over base image apache/age:release_PG18_1.7.0)
#   * pgvector     0.8.6  (PGVECTOR_APT_VERSION=0.8.6-1.pgdg13+1)
#
# `deploy/docker-1461/Dockerfile.pg-age-vector` bumps the apache/age base
# image's server to the exact pinned minor via a pgdg `apt --only-upgrade`
# (ABI-safe within PG major 18), upgrades Apache AGE to the exact pinned
# `postgresql-18-age` .deb (pgdg publishes AGE 1.8.0 even though the apache/age
# Docker Hub image is still at release_PG18_1.7.0 — the base image's AGE files
# are overlaid cleanly, no source build), and layers in the exact pinned
# pgvector .deb (the upstream apache/age image does not ship pgvector). The
# `Assert certified stack versions` step below hard-fails on ANY drift from
# the exact pinned minors — so this job is EVIDENCE, not a claim: a base-image
# or apt-snapshot drift that silently moved a version off the SSOT pin reds
# here, and the printed `PostgreSQL=… Apache AGE=… pgvector=…` notice in the
# executed run is the proof.
#
# The heavy sal-postgres build runs on the provisioned self-hosted node with
# ample RAM/disk (no mold/swap/disk-trim hacks needed). coverage.yml keeps
# running the DOCUMENTED ALTERNATE matrix (PG16 + AGE 1.6.0); this job is the
# CANONICAL certified-triple evidence. Both are honest and both are in the SSOT.
name: "Certified Postgres + AGE + pgvector tier (#2548)"

on:
  pull_request:
    branches: ["release/**"]
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  # v1.0.0 self-hosted rewrite: the per-PR GHCR image pull / local docker
  # build of the pg tier is GONE — the certified tier is the node's always-up
  # native tier — so the former `packages: read` grant is dropped.
  contents: read

concurrency:
  # Event-distinct key (includes github.event_name) so a same-sha push +
  # pull_request pair never collide into one cancel-in-progress group — the
  # rule-(d) CANCELLED-DUPLICATE class scripts/check-required-contexts.sh
  # guards against. Fork-PR-safe: isolates fork PRs by number.
  group: cert-pg-age-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # #3128 — EXPLICIT, not inherited. `Swatinem/rust-cache` is what used to export
  # CARGO_INCREMENTAL=0, and it is now skipped on the self-hosted fleet (see the
  # rust-cache guards below), so the value must be declared here. Incremental
  # state is the most fragile thing in a `target/` tree, and the fleet's
  # `target/` is PERSISTENT and reused across branches — leaving incremental on
  # there would be a worse version of the very inconsistency the guard closes.
  # Declaring it at workflow level also means no job depends on the runner
  # `.env` supplying it.
  CARGO_INCREMENTAL: "0"
  # No dev debug info to keep the heavy sal-postgres test-compile lean. No
  # `-fuse-ld=mold` RUSTFLAGS: mold was a GitHub-hosted-runner headroom hack;
  # the self-hosted node uses its provisioned system linker.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # AI_MEMORY_TEST_POSTGRES_URL / AI_MEMORY_TEST_AGE_URL are NO LONGER hardcoded
  # here — they are read at runtime from the node's $HOME/.ai-memory-ci-fed-url
  # (the always-up native cert tier: pg18.6 + AGE 1.8.0 + pgvector 0.8.6, TLS
  # verify-full, port 5445) by the "Point at the native enterprise-fed tier"
  # step below, which threads them through $GITHUB_ENV to every later step.

jobs:
  cert-postgres-age:
    name: "Certified pg+AGE cells (live PG 18.6 + AGE 1.8.0 + pgvector 0.8.6)"
    # v1.0.0 self-hosted rewrite. Re-homed onto the enterprise-fed Linux node,
    # whose ALWAYS-UP native tier IS the certified triple. The former per-PR
    # `docker build`/pull of deploy/docker-1461/Dockerfile.pg-age-vector +
    # `docker run` container is GONE (the tier the job used to construct now
    # exists continuously); the cert EVIDENCE is unchanged — the "Assert
    # certified stack versions" step still hard-fails on ANY drift from the
    # SSOT-pinned 18.6 / 1.8.0 / 0.8.6, now read off the live native tier.
    runs-on: [self-hosted, linux-fed]
    # 2026-08-26 rigid-security-controls: never schedule a fork PR onto the
    # self-hosted enterprise-fed node (defence-in-depth behind the Actions
    # "require approval for all external contributors" policy). Job-level
    # `if:` is legitimate here: this job is not a required context and not a
    # matrix (rule (b1) of scripts/check-required-contexts.sh does not apply).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # FAIL CLOSED if rustup is missing on a self-hosted node — see the
      # `lint` job in ci.yml for the full rationale (#3128).
      - name: Assert rustup is provisioned (self-hosted; fail-closed #3128)
        if: runner.environment != 'github-hosted'
        shell: bash
        run: |
          test -x "$HOME/.cargo/bin/rustup" || {
            echo "::error::rustup is not provisioned at \$HOME/.cargo/bin/rustup on $RUNNER_NAME — repair the node."
            exit 1
          }
      - name: Install Rust 1.96.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: clippy

      # v1.0.0 per-job ephemeral database (concurrent-runner safety). With
      # multiple self-hosted runner instances on one node, this cert job can
      # run concurrently with the ci.yml enterprise-fed legs against the SAME
      # native tier. Pointing them all at the shared `ai_memory_test` base db
      # would collide (concurrent CREATE/DROP schema + shared tables -> flaky).
      # This job CREATEs its OWN uniquely-named db on the tier, points both the
      # pg and AGE test URLs at it, and DROPs it in the always() cleanup step
      # below. The base `ai_memory_test` is used ONLY as a maintenance
      # connection to issue CREATE/DROP DATABASE. Fail-closed: a missing URL
      # file or a failed CREATE reds the job.
      - name: Point at the native enterprise-fed tier (per-job ephemeral db)
        run: |
          set -euo pipefail
          # psql for the native tier lives under a versioned prefix. Prepend it
          # to GITHUB_PATH (for LATER steps + the always() cleanup) AND to THIS
          # step's own PATH (GITHUB_PATH does not affect the current step) so
          # the CREATE DATABASE below can find psql.
          for d in /usr/lib/postgresql/18/bin /opt/homebrew/opt/postgresql@18/bin; do
            if [ -d "$d" ]; then
              echo "$d" >> "$GITHUB_PATH"
              PATH="$d:$PATH"
            fi
          done
          export PATH
          url_file="$HOME/.ai-memory-ci-fed-url"
          if [ ! -f "$url_file" ]; then
            echo "::error::$RUNNER_NAME is missing $url_file — the native cert tier URL is not provisioned on this node"
            exit 1
          fi
          base_url="$(cat "$url_file")"
          # Unique db name: valid pg identifier (lowercase, [a-z0-9_], <=63
          # chars). run_id+attempt make it unique across concurrent runs; the
          # fixed `cert` suffix keeps it distinct from the ci.yml enterprise-fed
          # legs' ephemeral dbs on the same tier.
          CI_FED_DB="$(printf '%s' "ai_memory_test_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_cert" | cut -c1-63)"
          # Compute-once, pass to the cleanup step via $GITHUB_ENV so create and
          # drop use the byte-identical name.
          echo "CI_FED_DB=$CI_FED_DB" >> "$GITHUB_ENV"
          # Create the ephemeral db on the base tier (connected to ai_memory_test).
          if ! psql "$base_url" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$CI_FED_DB\";"; then
            echo "::error::$RUNNER_NAME failed to CREATE DATABASE $CI_FED_DB on the native cert tier"
            exit 1
          fi
          # Rewrite the base URL's db-name path segment (the last path segment,
          # before any '?') to the ephemeral db, preserving every query param
          # (sslmode/sslrootcert). The db name is [a-z0-9_] so needs no encoding.
          case "$base_url" in
            *\?*) q="?${base_url#*\?}"; head="${base_url%%\?*}" ;;
            *)    q=""; head="$base_url" ;;
          esac
          new_url="${head%/*}/${CI_FED_DB}${q}"
          # Provision the ephemeral db's extensions (the tier role is SUPERUSER).
          if ! psql "$new_url" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS age; CREATE EXTENSION IF NOT EXISTS vector;"; then
            echo "::error::$RUNNER_NAME failed to create age/vector extensions in $CI_FED_DB"
            exit 1
          fi
          # Both the pg and AGE test URLs are the same ephemeral db on the
          # native tier (a single PG 18.6 + AGE 1.8.0 + pgvector 0.8.6
          # instance). Setting AI_MEMORY_TEST_AGE_URL is what stops the
          # AGE-backed cells from self-skipping — the whole point of the in-PR
          # cert evidence (#2548).
          {
            echo "AI_MEMORY_TEST_POSTGRES_URL=$new_url"
            echo "AI_MEMORY_TEST_AGE_URL=$new_url"
          } >> "$GITHUB_ENV"
          echo "::notice::cert cells pointed at ephemeral db $CI_FED_DB on the native enterprise-fed tier ($RUNNER_NAME)"

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'

      - name: Resolve certified stack pins from deploy SSOT
        run: |
          set -euo pipefail
          # ONE declaration source (#B1): every version literal this job
          # exercises comes from deploy/docker-1461/provision/lib.sh — the
          # SAME file the docker-1461 mesh + its validate harness consume.
          # Nothing below is re-typed as a bare literal; a future SSOT pin
          # bump (e.g. a PG 18.5 point release) moves this job automatically.
          source deploy/docker-1461/provision/lib.sh
          {
            echo "CERT_EXPECTED_PG_VERSION=${EXPECTED_PG_VERSION}"
            echo "CERT_EXPECTED_AGE_VERSION=${EXPECTED_AGE_VERSION}"
            # pg_extension.extversion for pgvector reports the bare semver
            # (e.g. "0.8.6"), never the pgdg package suffix — strip it here
            # once so the assert step below has no literal of its own.
            echo "CERT_EXPECTED_PGVECTOR_VERSION=${PGVECTOR_APT_VERSION%%-*}"
          } >> "$GITHUB_ENV"
          echo "::notice::certified pins resolved from deploy/docker-1461/provision/lib.sh — PG server ${EXPECTED_PG_VERSION}, AGE server ${EXPECTED_AGE_VERSION}, pgvector ${PGVECTOR_APT_VERSION%%-*}"

      # The certified pg+AGE+pgvector tier is the node's ALWAYS-UP native tier
      # (no per-PR docker build/pull/run). Wait for it to answer, then assert
      # its versions against the SSOT below.
      - name: Wait for native tier readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if psql "$AI_MEMORY_TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -tAc 'SELECT 1' >/dev/null 2>&1; then
              echo "::notice::native cert tier is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::native enterprise-fed tier did not answer within 60s on $RUNNER_NAME"
          exit 1

      - name: Ensure AGE + vector extensions present (best-effort — tier is pre-provisioned)
        run: |
          set -euo pipefail
          # The native cert tier is provisioned with the pinned extensions +
          # the memory_graph AGE graph already. These statements are
          # BEST-EFFORT self-heal only: the test user on a verify-full tier may
          # lack CREATE EXTENSION privilege, and that is fine — the "Assert
          # certified stack versions" step below is the load-bearing check and
          # HARD-FAILS if any extension is actually absent or off-version.
          PSQL="psql $AI_MEMORY_TEST_POSTGRES_URL -v ON_ERROR_STOP=0"
          $PSQL -c "CREATE EXTENSION IF NOT EXISTS vector;" || echo "vector: pre-provisioned or no CREATE priv (asserted below)"
          $PSQL -c "CREATE EXTENSION IF NOT EXISTS age;" || echo "age: pre-provisioned or no CREATE priv (asserted below)"
          $PSQL -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT ag_catalog.create_graph('memory_graph');" || echo "memory_graph already exists / no priv / AGE init handled by ladder"

      - name: Assert certified stack versions (cert evidence, hard-fail on drift)
        run: |
          set -euo pipefail
          PSQL="psql $AI_MEMORY_TEST_POSTGRES_URL -tAX"
          # split_part(...,' ',1) strips the "(Debian 18.4-1.pgdg13+1)" build
          # metadata SHOW server_version / current_setting append after the
          # bare version — without this, tr -d '[:space:]' collapses that
          # into "18.4(Debian18.4-1.pgdg13+1)", which never equals the exact
          # SSOT string and false-reds the assert below even when the
          # server IS the certified 18.4.
          pg_ver=$($PSQL -c "SELECT split_part(current_setting('server_version'), ' ', 1);" | tr -d '[:space:]')
          age_ver=$($PSQL -c "SELECT extversion FROM pg_extension WHERE extname='age';" | tr -d '[:space:]')
          vec_ver=$($PSQL -c "SELECT extversion FROM pg_extension WHERE extname='vector';" | tr -d '[:space:]')
          echo "::notice::certified stack — PostgreSQL=$pg_ver  Apache AGE=$age_ver  pgvector=$vec_ver"
          {
            echo "### Certified Postgres + AGE + pgvector tier"
            echo ""
            echo "| component | running | certified (SSOT) |"
            echo "| --- | --- | --- |"
            echo "| PostgreSQL | $pg_ver | ${CERT_EXPECTED_PG_VERSION} |"
            echo "| Apache AGE | $age_ver | ${CERT_EXPECTED_AGE_VERSION} |"
            echo "| pgvector | $vec_ver | ${CERT_EXPECTED_PGVECTOR_VERSION} |"
          } >> "$GITHUB_STEP_SUMMARY"
          # EXACT-minor assertion (#B1) — the SSOT-pinned minor, not merely
          # the major. A base-image drift off the exact pinned minor (an apt
          # snapshot moving, a base-image digest update) must RED, never
          # silently certify a different version than the one the docs cite.
          case "$pg_ver" in
            "$CERT_EXPECTED_PG_VERSION") echo "PostgreSQL $pg_ver == certified $CERT_EXPECTED_PG_VERSION OK" ;;
            *) echo "::error::expected PostgreSQL exactly $CERT_EXPECTED_PG_VERSION (certified, deploy/docker-1461/provision/lib.sh EXPECTED_PG_VERSION), got '$pg_ver' — CI must not certify a version it does not run (§5.4(3))"; exit 1 ;;
          esac
          # Certified AGE is exactly 1.7.0. Reject 1.6.x and anything else —
          # the whole point of #2512 is that CI must run the certified 1.7.0,
          # not merely a 1.7.* rendering of a different point release.
          case "$age_ver" in
            "$CERT_EXPECTED_AGE_VERSION") echo "Apache AGE $age_ver == certified $CERT_EXPECTED_AGE_VERSION OK" ;;
            *) echo "::error::expected Apache AGE exactly $CERT_EXPECTED_AGE_VERSION (certified, deploy/docker-1461/provision/lib.sh EXPECTED_AGE_VERSION), got '$age_ver' — CI must not certify a version it does not run (§5.4(3))"; exit 1 ;;
          esac
          # pgvector must match the SSOT-pinned semver exactly (allowing only
          # for a trailing suffix the extversion column itself might carry).
          case "$vec_ver" in
            "") echo "::error::pgvector extension not present"; exit 1 ;;
            ${CERT_EXPECTED_PGVECTOR_VERSION}*) echo "pgvector $vec_ver == certified ${CERT_EXPECTED_PGVECTOR_VERSION} OK" ;;
            *) echo "::error::expected pgvector exactly ${CERT_EXPECTED_PGVECTOR_VERSION} (certified, deploy/docker-1461/provision/lib.sh PGVECTOR_APT_VERSION), got '$vec_ver' — CI must not certify a version it does not run (§5.4(3))"; exit 1 ;;
          esac

      - name: Run #[ignore]-gated pg + AGE cells against the certified stack
        run: |
          set -euo pipefail
          # The pg-parity binaries are the cross-backend parity cells (they do
          # not touch AGE). The AGE-backed binaries self-skip unless
          # AI_MEMORY_TEST_AGE_URL is set (it is, in env: above), so they run
          # here — this is the in-PR cert evidence that was missing (#2548).
          # `--include-ignored` also runs the explicitly #[ignore]-gated cells
          # (e.g. age_cypher_param_binding_2511). --test-threads=1 because the
          # sal-postgres suite shares one database with no per-test isolation.
          cargo test --features sal-postgres \
            --test secret_screen_postgres_parity_g29 \
            --test postgres_l2_rehydration_1693 \
            --test erasure_fanout_postgres_g30 \
            --test recall_purity_p01_postgres \
            --test qual_pg_write_funnel_parity_2393_2397 \
            --test store_parity_gaps \
            --test age_cypher_param_binding_2511 \
            --test kg_query_relation_parity_2792 \
            --test g2_postgres_find_paths_age_param_binding \
            --test g4_postgres_link_projects_into_age_graph \
            --test g5_find_paths_cte_served_on_age \
            --test kg_age_fallback \
            --test age_cte_equivalence \
            --test issue_1482_age_cypher_persistent \
            --test pillar4_4c_deferred_age_cold_path_1735 \
            --test pillar4_4d_age_unprojection_on_delete_1783 \
            --test age_deferred_projection_cluster_2375_2376_2377 \
            --test bootstrap_node_cert_gate_3016 \
            -- --include-ignored --test-threads=1

      - name: Cluster-A cert-posture armability gate (#3061 #3016 #3067)
        run: |
          set -euo pipefail
          # Load-bearing end-to-end proof (sibling to
          # scripts/check-cert-removal-proof.sh): LEG A proves #3061 makes
          # posture control #15 ARMABLE on a postgres store (doctor --posture
          # exit 0 in the certified pg config, with negative controls for the
          # attestation + verify-full halves — env-only, no live pg needed);
          # LEG B proves the #3016/#3067 born-dirty -> bootstrap-node -> clean
          # gate on a fresh sqlite node. Reuse the sal-postgres build cache for
          # the `ai-memory` binary so no second toolchain build is needed.
          cargo build --features sal-postgres --bin ai-memory
          AI_MEMORY_BIN="$(pwd)/target/debug/ai-memory" \
            bash scripts/check-bootstrap-cert-gate.sh

      # Drop the per-job ephemeral db (created by "Point at the native
      # enterprise-fed tier" above). always() so a failed/cancelled run still
      # reclaims it. Guarded on CI_FED_DB so it no-ops if the configure step
      # failed before creating the db.
      - name: Cleanup enterprise-fed ephemeral db
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${CI_FED_DB:-}" ]; then
            echo "::notice::no ephemeral db to drop (CI_FED_DB unset — configure never ran)"
            exit 0
          fi
          # Re-derive psql on PATH defensively (GITHUB_PATH from the configure
          # step normally carries it, but this step must not depend on that).
          for d in /usr/lib/postgresql/18/bin /opt/homebrew/opt/postgresql@18/bin; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          export PATH
          url_file="$HOME/.ai-memory-ci-fed-url"
          if [ ! -f "$url_file" ]; then
            echo "::warning::cannot drop $CI_FED_DB — $url_file missing on $RUNNER_NAME (leaked ephemeral db)"
            exit 0
          fi
          base_url="$(cat "$url_file")"
          # Connect to the base ai_memory_test to drop the ephemeral db. FORCE
          # terminates any lingering backend so the drop cannot wedge on a
          # still-connected test process.
          if psql "$base_url" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$CI_FED_DB\" WITH (FORCE);"; then
            echo "::notice::dropped ephemeral db $CI_FED_DB on $RUNNER_NAME"
          else
            echo "::warning::failed to drop ephemeral db $CI_FED_DB on $RUNNER_NAME (leaked)"
          fi

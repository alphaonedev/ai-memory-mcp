# v0.7.0 L0.7-7 — per-module coverage threshold gate (discipline keystone).
#
# Per L0.7 playbook §8: this workflow enforces per-module CURRENT-floor
# coverage thresholds defined in coverage/thresholds.toml. Thresholds
# rise across releases; NEVER fall. If a module drops below its
# threshold, this job fails and the PR cannot merge until coverage is
# restored.
#
# This workflow OWNS code coverage end-to-end (#1993). It enforces both:
#   - the GLOBAL line floor (`coverage/thresholds.toml [global]
#     .min_line_coverage`) — the catastrophic-regression backstop that the
#     former `Code Coverage` job in `ci.yml` used to guard; AND
#   - the per-module floors, so no single module can quietly slide while
#     the workspace average stays high.
# It also posts the sticky coverage PR comment (see the `Post coverage to
# PR` step below). The redundant `ci.yml` `Code Coverage` job (a second
# full instrumented `cargo llvm-cov` sweep per PR) was removed in #1993
# because it timed out mid-generation and duplicated this gate's work.
#
# v0.7.0 ship-hardening (2026-05-20) — instrument with live PG+AGE+pgvector
# service container so postgres-store tests connect at runtime instead of
# skipping. Without this, `store/postgres.rs` (5852 executable lines) is
# effectively uncovered and the workspace total drops ~4.10pp — masking
# regressions on the postgres backend. The apache/age:release_PG16_1.6.0
# base image has AGE+postgres; pgvector is installed at service-start via
# the runtime `postgresql-16-pgvector` apt package. Mirror of the
# `infra/lan-parity-test/` Docker stack the Tier 4 cov audit used.
#
# STACK PROVENANCE (#2512). This job runs the DOCUMENTED ALTERNATE matrix —
# PostgreSQL 16 + Apache AGE 1.6.0 + pgvector — which docs/postgres-age-guide.md
# §"Certified versions" retains as a "tested alternate matrix
# (`infra/lan-parity-test/`)". It is NOT the certified triple and does not
# certify one: coverage is a Rust line-coverage measurement, not cert evidence.
# The ONE TRUE CERTIFIED triple — PostgreSQL 18.4 + Apache AGE 1.7.0 +
# pgvector 0.8.6 — is exercised in-PR by `.github/workflows/cert-postgres-age.yml`
# (#2548), so CI runs BOTH stacks the SSOT documents and neither is drift:
# canonical here would risk this required coverage gate on a PG-major flip it
# does not measure, while the cert job proves the canonical tier separately.

name: Per-Module Coverage Thresholds

on:
  pull_request:
    branches: [main, develop, "release/**", "feat/v0.7.0-grand-slam"]
  push:
    branches: [main, develop, "feat/v0.7.0-grand-slam", "release/**"]

# v0.7.x (#1148) — cancel stale runs on a PR when a new push lands.
# Fork-PR-safe concurrency key: coalesces push + same-branch internal
# PR events; isolates fork PRs by PR number. See ci.yml for full
# rationale + the prior unsafe-key incident that motivated this shape.
concurrency:
  group: cov-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AI_MEMORY_NO_CONFIG: "1"
  # Pin the postgres-store test URL so postgres-backed integration
  # tests (`live_*` / `serve_postgres_*` / `g[1-9]_postgres_*` /
  # `federation_dlq_replay`) connect to the service container below
  # instead of skipping their `let Some(url) = postgres_url() else { return };`
  # guard.
  AI_MEMORY_TEST_POSTGRES_URL: "postgres://ai_memory:ai_memory_test@127.0.0.1:5432/ai_memory_test"
  AI_MEMORY_TEST_AGE_URL: "postgres://ai_memory:ai_memory_test@127.0.0.1:5432/ai_memory_test"

jobs:
  # Issue #1343 — docs-only PRs should skip the heavy llvm-cov sweep.
  # Mirrors the same classify pattern used by `.github/workflows/ci.yml`
  # (see the classify job there for the canonical implementation).
  # When `docs_only == 'true'`, the `per-module-thresholds` job below
  # is skipped, which GitHub reports as `status: skipping` on the PR
  # check page — branch-protection treats a skipped required check as
  # passing (same handling that ci.yml's downstream jobs already rely
  # on for docs-only PRs).
  classify:
    name: Coverage classify (docs-only short-circuit)
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.cls.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: cls
        shell: bash
        run: |
          # LOAD-BEARING (#2496): on `pull_request` this base is the PR
          # BASE, spanning the WHOLE PR — NOT `github.event.before` (the
          # previous PR head). Do NOT "harmonise" it to ci.yml's former
          # shape: that incremental base is exactly what let a PR whose
          # last push was docs-only classify docs-only for its entire
          # head. On PR #2497's head 6d73ff0b this classifier correctly
          # said docs_only=false (12-file backend change) while ci.yml's
          # incremental one said true (CLAUDE.md-only last commit) — the
          # in-repo A/B that proved the defect. ci.yml now matches this.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git rev-parse "$base" >/dev/null 2>&1; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cannot resolve base commit ($base) — running full pipeline"
            exit 0
          fi
          # Per issue #1193 / PR #1203 — fetch-depth=2 is too shallow
          # when the PR base SHA is more than one commit behind the
          # merge ref. Fetch on demand if the base tree isn't local.
          if ! git cat-file -e "$base^{tree}" 2>/dev/null; then
            git fetch --depth=50 origin "$base" 2>/dev/null || \
              git fetch --depth=200 origin "$base" 2>/dev/null || \
              git fetch --unshallow origin 2>/dev/null || true
          fi
          if ! git cat-file -e "$base^{tree}" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::cannot fetch base tree ($base) after retry — running full pipeline"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          if [ -z "$changed" ]; then
            # FAIL CLOSED (#2494 §3 / #2496). "No net changes" is NOT
            # "docs only": an amend-force-push yields a fresh SHA with an
            # identical tree, and `Per-Module Coverage Thresholds` is a
            # REQUIRED context whose job carries a job-level `if:`, so a
            # `docs_only=true` here made it report `skipped` — counted as
            # SATISFIED — on a PR that is not docs-only at all.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no net diff vs base — failing CLOSED (full coverage sweep), NOT docs-only"
            exit 0
          fi
          # docs-only iff every changed file matches docs/** OR *.md anywhere
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "::notice::changed files include non-docs paths — running full pipeline"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::all changed files are docs-only — skipping heavy llvm-cov sweep"
          fi

  per-module-thresholds:
    name: Per-Module Coverage Thresholds
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    # #1487 — bound the job so a wedged test (e.g. a stalled HF-Hub model
    # download on the semantic-tier CLI recall path) fails fast instead of
    # pinning a runner for hours. Root cause fixed in
    # embeddings::Embedder::download_within; this is the backstop.
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write
    services:
      # Live PG + Apache AGE 1.6.0 (graph extension on PostgreSQL 16) — the
      # DOCUMENTED ALTERNATE matrix (#2512; see the header note above). The
      # certified triple (PG 18.4 + AGE 1.7.0 + pgvector 0.8.6) is exercised
      # by `.github/workflows/cert-postgres-age.yml`, not here.
      # The pgvector extension is layered in via the
      # `Install pgvector + provision AGE/vector extensions` step below
      # because the upstream `apache/age` image doesn't ship pgvector
      # by default. Mirrors `infra/lan-parity-test/docker-compose.yml`
      # exactly so the live-PG coverage measurement on this CI matches
      # what the Tier 4 audit measured locally (92.58% workspace).
      pg-age:
        image: apache/age:release_PG16_1.6.0
        env:
          POSTGRES_USER: ai_memory
          POSTGRES_PASSWORD: ai_memory_test
          POSTGRES_DB: ai_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_memory -d ai_memory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # v0.7.x (#1148) — route every Rust link step through `mold`
      # instead of the default `ld.bfd`. mold uses 2-4× less RSS than
      # ld.bfd, eliminating the `collect2: signal 7 [Bus error]`
      # linker-OOM that previously failed this gate on the 7 GB
      # ubuntu-latest runner under the heavy `--features
      # sal,sal-postgres` instrumented build.
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      # Trim DWARF + LTO via env-var overrides on the dev profile
      # (NOT `--profile coverage`) so cargo-llvm-cov's report step
      # finds the artifact dir at its default `debug/` path.
      #
      # 2026-06-12 (GA coverage campaign) — debuginfo dropped 1 → 0.
      # The uniform-90 campaign added ~25 new tests/cov_*.rs integration
      # binaries; under `-C instrument-coverage` + debuginfo the
      # `target/llvm-cov-target/` dir overflowed the runner root
      # partition ("No space left on device" killed step 11 on run
      # 27426987513). llvm-cov line/region coverage is sourced from the
      # embedded `__llvm_covmap` instrumentation, NOT DWARF, so debug=0
      # shrinks every instrumented binary (~half) with zero loss of the
      # per-file line% the threshold checker reads. mold already cut
      # link RSS; this cuts on-disk size.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_LTO: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk + add swap (#1148 belt-and-suspenders, aggressive)
        run: |
          # Aggressive cleanup — the sal+sal-postgres instrumented
          # coverage build's target/llvm-cov-target/ can exceed 20 GB
          # under heavy integration-test instrumentation. Free
          # everything we don't need before building.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/google /usr/lib/jvm /opt/microsoft \
                      /usr/share/swift /usr/share/miniconda || true
          # #2960 — also free the whole tool cache ($AGENT_TOOLSDIRECTORY =
          # /opt/hostedtoolcache, ~10 GiB). The HF pre-stage step below uses
          # the SYSTEM /usr/bin/python3 (there is no setup-python step), and
          # everything else comes via rustup / apt / taiki-e install-action,
          # so nothing reads the tool cache after this — pure extra headroom
          # for the llvm-cov instrumented build that ran out of disk on
          # run 31911087758.
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af --volumes || true
          sudo apt-get autoremove --purge -y || true
          sudo apt-get clean
          # Swap on /mnt (the ephemeral data disk, ~70 GB) so the 8 GB
          # doesn't eat into the root partition.
          sudo fallocate -l 8G /mnt/swapfile-1148
          sudo chmod 600 /mnt/swapfile-1148
          sudo mkswap /mnt/swapfile-1148
          sudo swapon /mnt/swapfile-1148
          echo "::group::memory + disk after"
          free -h
          df -h /
          df -h /mnt
          echo "::endgroup::"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install mold linker (#1148, pinned+bounded #3090)
        timeout-minutes: 6
        env:
          MOLD_VERSION: "2.4.1"
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # #3090 — the old body was a bare `apt-get update && apt-get install
          # -y mold` with NO step timeout, NO retry, NO pin. When the Azure apt
          # mirror stalled, the step blocked until the JOB `timeout-minutes`
          # fired (75 here) — a ~1h15m flake per PR. This step is now
          # idempotent, PINNED, time-bounded (step `timeout-minutes` above +
          # per-command GNU `timeout`), retried once, and FAILS LOUD (exit 1)
          # rather than hanging if mold cannot be fetched. Primary path pulls a
          # pinned first-party mold release tarball from github.com (the infra
          # the runner already trusts) into /usr/local/bin, removing the flaky
          # apt mirror from the happy path; apt is the bounded fallback only. No
          # external Action is added (repo no-external-code-injection rule).
          # ------------------------------------------------------------------
          if command -v mold >/dev/null 2>&1 && mold --version | grep -q "${MOLD_VERSION}"; then
            echo "mold ${MOLD_VERSION} already present: $(mold --version)"; exit 0
          fi
          install_from_tarball() {
            local arch tgz url dir ok attempt
            arch="$(uname -m)"
            tgz="mold-${MOLD_VERSION}-${arch}-linux.tar.gz"
            url="https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/${tgz}"
            dir="$(mktemp -d)"; ok=0
            for attempt in 1 2; do
              if timeout 120 curl -fsSL --retry 2 --retry-delay 3 -o "${dir}/${tgz}" "${url}"; then
                ok=1; break
              fi
              echo "mold tarball fetch attempt ${attempt} failed; retrying" >&2; sleep 3
            done
            [ "${ok}" = 1 ] || return 1
            tar -xzf "${dir}/${tgz}" -C "${dir}"
            sudo install -m0755 "${dir}/mold-${MOLD_VERSION}-${arch}-linux/bin/mold" /usr/local/bin/mold
            sudo ln -sf /usr/local/bin/mold /usr/local/bin/ld.mold
          }
          install_from_apt() {
            local ok attempt; ok=0
            for attempt in 1 2; do
              if timeout 180 sudo apt-get update && timeout 180 sudo apt-get install -y mold; then
                ok=1; break
              fi
              echo "apt mold install attempt ${attempt} failed; retrying" >&2; sleep 5
            done
            [ "${ok}" = 1 ]
          }
          if ! install_from_tarball; then
            echo "::warning::pinned mold tarball unavailable — falling back to apt"
            install_from_apt || { echo "::error::mold install failed (tarball + apt both failed)"; exit 1; }
          fi
          command -v mold >/dev/null 2>&1 || { echo "::error::mold not on PATH after install"; exit 1; }
          mold --version

      - uses: Swatinem/rust-cache@v2

      # #2019 — the reranker (cross-encoder/ms-marco-MiniLM-L-6-v2) + embedder
      # (sentence-transformers/all-MiniLM-L6-v2) tests download their weights via
      # hf-hub. A flaky HF download made those modules' per-module coverage
      # NON-DETERMINISTIC: on a failed fetch the tests take the offline/keyword
      # path, the model-execution lines go uncovered, and reranker.rs /
      # embeddings.rs / daemon_runtime.rs deterministically drop below floor
      # (81.71% / 86.01% / 85.97%) — red on main AND every PR until the fetch
      # succeeds. Cache the HF dir + retry-prefetch so the model tests ALWAYS run.
      # huggingface_hub writes the same standard hub cache the Rust hf-hub Api reads.
      - name: Cache HuggingFace models (#2019)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump the version suffix (…-v2) whenever the pinned model set or
          # the staged cache layout changes. `restore-keys` lets a stale-but-
          # compatible cache seed the dir so the pre-stage step only has to
          # top up deltas instead of a full cold re-download on every key bump.
          key: hf-models-minilm-l6-v2-marco-l6-v2-v2
          restore-keys: |
            hf-models-minilm-l6-v2-marco-l6-v2-

      - name: Pre-stage HF models with retry (#2019)
        env:
          # #2019b — bypass the HF Xet CAS backend (cas-server.xethub.hf.co),
          # which intermittently returns 401 on the reconstruction endpoint and
          # failed the pre-stage on 2026-07-14. The Rust hf-hub the tests use is
          # classic (non-Xet), so the staged classic cache is what they read.
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check "huggingface_hub>=0.20" \
            || pip3 install --quiet "huggingface_hub>=0.20"
          for m in sentence-transformers/all-MiniLM-L6-v2 cross-encoder/ms-marco-MiniLM-L-6-v2; do
            ok=0
            for attempt in 1 2 3 4 5; do
              if python3 -c "from huggingface_hub import snapshot_download; snapshot_download('$m')"; then
                echo "::notice::staged $m (attempt $attempt)"; ok=1; break
              fi
              echo "::warning::hf fetch $m attempt $attempt failed; retry in $((attempt*10))s"
              sleep $((attempt*10))
            done
            [ "$ok" = 1 ] || { echo "::error::could not stage $m after 5 attempts"; exit 1; }
          done

      # #2019 — VERIFY the Python-staged cache is resolvable by the RUST
      # `hf-hub` 0.5 loader the tests actually use. `ApiRepo::get()` is
      # cache-first: it reads `refs/main` → resolves `snapshots/<commit>/
      # <file>` and returns it WITHOUT any network call, falling through to
      # a live download ONLY on a cache MISS. So the reranker
      # (`Api::new().get(...)`) + embedder (`download_via_hf_hub` → `.get()`)
      # never touch the network as long as the staged layout matches what
      # `hf-hub::Cache::get` expects. `huggingface_hub` (the pre-stage tool)
      # and `hf-hub` (the test loader) are DIFFERENT tools, so this step
      # asserts the layout the Rust side resolves rather than trusting the
      # Python writer — a mismatch fails LOUD here (deterministic staging
      # error) instead of silently degrading to the keyword path and
      # dropping reranker.rs / embeddings.rs / daemon_runtime.rs below floor.
      - name: Verify staged HF cache is hf-hub-resolvable (#2019)
        run: |
          set -euo pipefail
          hub="$HOME/.cache/huggingface/hub"
          # repo dir name = models--<org>--<name>; artifact files mirror the
          # crate consts HF_{CONFIG,TOKENIZER,WEIGHTS}_FILE in src/embeddings.rs.
          for repo in \
            models--sentence-transformers--all-MiniLM-L6-v2 \
            models--cross-encoder--ms-marco-MiniLM-L-6-v2; do
            base="$hub/$repo"
            ref="$base/refs/main"
            [ -f "$ref" ] || { echo "::error::missing ref $ref — cache not hf-hub-resolvable"; exit 1; }
            commit="$(tr -d '[:space:]' < "$ref")"
            snap="$base/snapshots/$commit"
            [ -d "$snap" ] || { echo "::error::missing snapshot dir $snap for $repo"; exit 1; }
            for f in config.json tokenizer.json model.safetensors; do
              # -e follows symlinks (hf cache snapshots are symlinks into blobs/).
              [ -e "$snap/$f" ] || { echo "::error::missing $f in $snap ($repo)"; exit 1; }
            done
            echo "::notice::$repo resolvable at $snap (all 3 artifacts present)"
          done

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install jq + postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y jq postgresql-client

      - name: Install pgvector + provision AGE/vector extensions
        env:
          PGPASSWORD: ai_memory_test
        run: |
          set -euo pipefail
          # Locate the pg-age service container so we can apt-get
          # install pgvector against the same Debian-based image
          # (apache/age inherits debian-bookworm via postgres:16).
          PG_CONTAINER=$(docker ps --filter "ancestor=apache/age:release_PG16_1.6.0" --format '{{.ID}}' | head -1)
          echo "pg container: $PG_CONTAINER"
          docker exec "$PG_CONTAINER" apt-get update
          docker exec "$PG_CONTAINER" apt-get install -y postgresql-16-pgvector
          # Provision extensions + the memory_graph AGE graph the SAL
          # postgres adapter expects. Mirrors infra/lan-parity-test/init-age.sql.
          psql -h 127.0.0.1 -p 5432 -U ai_memory -d ai_memory_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h 127.0.0.1 -p 5432 -U ai_memory -d ai_memory_test -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT ag_catalog.create_graph('memory_graph');" || echo "memory_graph already exists or AGE init handled by ladder"
          # Sanity check: extensions present.
          psql -h 127.0.0.1 -p 5432 -U ai_memory -d ai_memory_test -c "SELECT extname FROM pg_extension ORDER BY extname;"

      - name: Generate coverage JSON
        # v0.7.x (#1148) — dev profile (default) WITH env-var
        # overrides from the job-level `env:` block above
        # (debuginfo=1, lto=false). Keeps artifacts under the default
        # `target/llvm-cov-target/debug/` path so downstream report
        # tooling (and the threshold checker) finds them, while still
        # trimming the instrumented binary enough that mold can link
        # it under the 7 GB runner ceiling.
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --features sal,sal-postgres \
            --lib --tests \
            --json \
            --output-path coverage/current.json \
            --workspace \
            -- --test-threads=1
        # v0.8.0 #1709 SHIP-HARDEN — `--test-threads=1` (was `=2`).
        # The postgres-backed tests share ONE `ai_memory_test` database with
        # no per-test isolation, so running two concurrently let an
        # `archive_by_ids` (INSERT archived_memories + DELETE memories)
        # deadlock on the shared table/index locks (postgres `40P01`),
        # surfacing as an intermittent `cov_postgres_*` archive flake (the
        # rows are uuid-unique, so it is index/table-level contention, not a
        # row-order issue a per-call sort could fix). This mirrors the
        # `ci.yml` Postgres feature gate, which already runs the
        # sal-postgres suite at `--test-threads=1` for the same per-DDL
        # serialisation + llvm-cov-memory reasons. Coverage line/region
        # counts are thread-count-independent, so the per-module thresholds
        # are unaffected; the 75-minute job timeout absorbs the serial run.

      - name: Enforce per-module thresholds
        id: thresholds
        run: |
          bash coverage/check-thresholds.sh \
            coverage/thresholds.toml \
            coverage/current.json

      # #1993 — the sticky coverage PR comment moved here from the removed
      # `ci.yml` `Code Coverage` job so `coverage.yml` owns coverage
      # end-to-end. Rendered from the authoritative `coverage/current.json`
      # (the same sal,sal-postgres sweep the gate enforces). Runs on
      # `always()` so the numbers post even when the threshold gate FAILS
      # (the failed `Enforce per-module thresholds` step still blocks — this
      # comment is informational, not a bypass).
      - name: Render coverage comment body (#1993)
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          global_floor=$(grep -E '^min_line_coverage[[:space:]]*=' coverage/thresholds.toml \
            | head -1 | awk -F= '{print $2}' | awk '{print $1}' | tr -d ' ')
          if [ -f coverage/current.json ] && command -v jq >/dev/null 2>&1; then
            global_pct=$(jq -r '.data[0].totals.lines.percent // empty' coverage/current.json 2>/dev/null || echo "")
          else
            global_pct=""
          fi
          gate="${{ steps.thresholds.outcome }}"
          case "$gate" in
            success) gate_line="PASS — all per-module floors + global floor hold" ;;
            failure) gate_line="FAIL — a module (or the global total) dropped below its floor; see the \`Enforce per-module thresholds\` step log" ;;
            *)       gate_line="$gate (coverage JSON may be unavailable — see the sweep step log)" ;;
          esac
          {
            echo "### Per-Module Coverage Gate"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| measured (global lines) | **${global_pct:-n/a}%** |"
            echo "| global floor | ${global_floor:-n/a}% |"
            echo "| gate result | ${gate_line} |"
            echo ""
            echo "Feature set: \`--features sal,sal-postgres --lib --tests --workspace\` (live PG + AGE + pgvector)."
            echo "Per-module floors live in \`coverage/thresholds.toml\`; the gate is \`coverage/check-thresholds.sh\`."
          } > coverage/comment.md

      - name: Post coverage to PR (sticky) (#1993)
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-gate
          path: coverage/comment.md

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-json
          path: coverage/current.json

#
# PR base retarget re-run (#7072, #8332).
#
# WHY THIS FILE EXISTS. ci.yml and coverage.yml classify docs_only against the PR
# base, so retargeting a PR (an `edited` event that carries `changes.base`) must
# produce a fresh run against the new base (#7072). They used to list `edited` in
# their pull_request types, which also fired for every title or body edit and, with
# cancel-in-progress, cancelled the running required checks and restarted them from
# zero (#8332). `edited` is now listed here only, and this job runs ONLY when the
# base changed.
#
# WHAT IT DOES. It dispatches ci.yml and coverage.yml on the head branch. A
# workflow_dispatch run is not a pull_request event, so classification fails closed
# to docs_only=false and the FULL matrix runs; every required context is then
# reported by a real run on that head. Nothing here is a required context, so the
# job-level `if` skips nothing a ruleset reads. No checkout and no head code: the
# head ref reaches the shell through env, never through interpolation.
#
# LIMIT. A fork PR cannot be dispatched with this token; the job fails visibly so a
# fork retarget is never silently trusted (push to the fork branch to re-run).
name: PR base retarget re-run

on:
  pull_request_target:
    branches: [main, develop, "release/**", "rehearsal/**", "chain/**"]
    types: [edited]

permissions:
  contents: read

jobs:
  retarget:
    name: Re-run CI and coverage on a base retarget
    if: github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch ci.yml and coverage.yml on the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo "::error::base retarget on a fork head: no fresh run can be dispatched; push to the fork branch to re-run CI against the new base"
            exit 1
          fi
          for wf in ci.yml coverage.yml; do
            gh workflow run "$wf" --repo "$GH_REPO" --ref "$HEAD_REF"
          done

# Nightly cross-backend (sqlite <-> postgres) parity tests.
#
# v0.8.1 audit follow-up (#1855, epic #1853). The parity binaries
# `secret_screen_postgres_parity_g29`, `postgres_l2_rehydration_1693`, and
# `erasure_fanout_postgres_g30` are `#![cfg(feature = "sal-postgres")]` AND
# `#[ignore]`-gated, so the PR-time `postgres-feature` job in `ci.yml` — which
# runs `cargo test --features sal-postgres` WITHOUT `--ignored` — never actually
# executes them. The CHANGELOG implied these parity assertions were exercised in
# CI; this job exercises them for real against a live PostgreSQL + pgvector
# instance, on a nightly schedule (kept off the PR critical path) plus on-demand.
#
# The `postgres-parity` job's service image mirrors `ci.yml`'s `postgres-feature`
# job exactly (`pgvector/pgvector:pg16`, same creds/port); those binaries do not
# depend on the AGE extension.
#
# REMOVED 2026-07-31 (operator directive): the `postgres-age` job (#2012) built
# the SSOT-pinned certified stack NATIVELY on the runner every night —
# apt-installing PostgreSQL 18.4 + Apache AGE 1.7.0 + pgvector 0.8.6 and
# asserting the pins — purely to reproduce a stack that already exists
# continuously as the `ai-memory-pg:18.4-age1.7.0-vec0.8.6` container on the
# validation host. That is a from-source rebuild per night for no evidence the
# validation host does not already provide, so it is gone rather than repaired.
#
# Apache AGE / Cypher / KG work is validated against that LOCAL certified stack
# (`AI_MEMORY_TEST_AGE_URL` -> the live PG 18.4 + AGE 1.7.0 + pgvector instance),
# which is where the #2511 AGE-read seam, and the postgres arms of #2478 / #2479 /
# #2503 / #2537, were actually proven. Whether any IN-PR AGE coverage is wanted is
# an open question tracked on #2548 — to be justified on its own merits, and with a
# container image rather than a native build if it ever is.
name: Postgres parity (nightly)

on:
  schedule:
    - cron: '27 4 * * *'   # 04:27 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-parity-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  postgres-parity:
    name: Postgres parity (#[ignore]-gated, live PG)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Match `postgres-feature`: mold linker + no dev debug info to keep the
      # heavy sal-postgres build under the runner's RSS/disk ceilings (#1148/#1744).
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      CARGO_PROFILE_DEV_DEBUG: "0"
      AI_MEMORY_TEST_POSTGRES_URL: postgres://ai_memory:ai_memory_ci@localhost:5432/ai_memory_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ai_memory
          POSTGRES_PASSWORD: ai_memory_ci
          POSTGRES_DB: ai_memory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_memory -d ai_memory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk (#2960, first-party, no external action)
        if: runner.os == 'Linux'
        run: |
          # #2960 — this heavy pg+AGE parity job builds sal-postgres and runs
          # #[ignore]-gated live-PG tests on a stock ubuntu-latest runner
          # (~14 GiB free). Prune the large preinstalled toolchains this build
          # never touches BEFORE the compile, guarded so a shifting runner
          # image can never fail the job. Pure first-party shell — no external
          # 'free-disk-space' action (repo no-external-code-injection rule).
          # NOTE: `docker image prune` (not `system prune --volumes`) so the
          # running `services:` postgres container + its volume are untouched.
          echo "::group::disk before reclaim"; df -h /; echo "::endgroup::"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/share/swift /usr/lib/jvm || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          echo "::group::disk after reclaim"; df -h /; echo "::endgroup::"

      - name: Install Rust 1.96.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Install mold linker (#1148, pinned+bounded #3090)
        timeout-minutes: 6
        env:
          MOLD_VERSION: "2.4.1"
        run: |
          set -euo pipefail
          # ------------------------------------------------------------------
          # #3090 — bounded, pinned, fail-loud mold install (see ci.yml for the
          # full rationale). The old bare `apt-get install -y mold` could hang
          # on a stalled apt mirror until the job timeout fired. Primary path is
          # a pinned first-party mold release tarball; apt is the bounded
          # fallback. No external Action added.
          # ------------------------------------------------------------------
          if command -v mold >/dev/null 2>&1 && mold --version | grep -q "${MOLD_VERSION}"; then
            echo "mold ${MOLD_VERSION} already present: $(mold --version)"; exit 0
          fi
          install_from_tarball() {
            local arch tgz url dir ok attempt
            arch="$(uname -m)"
            tgz="mold-${MOLD_VERSION}-${arch}-linux.tar.gz"
            url="https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/${tgz}"
            dir="$(mktemp -d)"; ok=0
            for attempt in 1 2; do
              if timeout 120 curl -fsSL --retry 2 --retry-delay 3 -o "${dir}/${tgz}" "${url}"; then
                ok=1; break
              fi
              echo "mold tarball fetch attempt ${attempt} failed; retrying" >&2; sleep 3
            done
            [ "${ok}" = 1 ] || return 1
            tar -xzf "${dir}/${tgz}" -C "${dir}"
            sudo install -m0755 "${dir}/mold-${MOLD_VERSION}-${arch}-linux/bin/mold" /usr/local/bin/mold
            sudo ln -sf /usr/local/bin/mold /usr/local/bin/ld.mold
          }
          install_from_apt() {
            local ok attempt; ok=0
            for attempt in 1 2; do
              if timeout 180 sudo apt-get update && timeout 180 sudo apt-get install -y mold; then
                ok=1; break
              fi
              echo "apt mold install attempt ${attempt} failed; retrying" >&2; sleep 5
            done
            [ "${ok}" = 1 ]
          }
          if ! install_from_tarball; then
            echo "::warning::pinned mold tarball unavailable — falling back to apt"
            install_from_apt || { echo "::error::mold install failed (tarball + apt both failed)"; exit 1; }
          fi
          command -v mold >/dev/null 2>&1 || { echo "::error::mold not on PATH after install"; exit 1; }
          mold --version

      - uses: Swatinem/rust-cache@v2

      - name: Wait for postgres readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U ai_memory -d ai_memory_ci >/dev/null 2>&1; then
              echo "::notice::postgres is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres did not become ready within 60s"
          exit 1

      - name: Run #[ignore]-gated cross-backend parity tests (live PG)
        run: |
          cargo test --features sal-postgres \
            --test secret_screen_postgres_parity_g29 \
            --test postgres_l2_rehydration_1693 \
            --test erasure_fanout_postgres_g30 \
            --test recall_purity_p01_postgres \
            -- --include-ignored --test-threads=1

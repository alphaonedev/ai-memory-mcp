# CodeQL — advanced setup for EVERY language in this repository (rust,
# javascript-typescript, python, actions). GitHub's default setup cannot take
# `rust`, and it REFUSES advanced-configuration SARIF uploads for any language
# while it is enabled (first campaign run on 2026-09-11: "CodeQL analyses from
# advanced configurations cannot be processed when the default setup is
# enabled"), so default setup is OFF and this workflow carries all four.
# Advisory only: NOT a required status check until its first full runs have been
# reviewed (operator approval 2026-09-10). `build-mode: none` uses the CodeQL
# extractors without a build; the Rust toolchain pin matches rust-toolchain.toml
# so `cargo metadata` resolves the same graph CI builds.
name: CodeQL

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Initialize CodeQL (build-mode none)
        uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874 # v3
        with:
          category: "/language:${{ matrix.language }}"

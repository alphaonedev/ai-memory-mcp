# C8 orchestrator safeguard CI gate (issue #953, CLAUDE.md §"Enforceable
# Orchestrator Safeguards") + #1174 PR10 vendor-monoculture lint-gate.
#
# Two HARD-BLOCK jobs:
#
#   1. c8-precheck — `CallerContext::for_agent("<literal>")` /
#      `for_admin("<literal>")` allowlist enforcement (issue #953).
#      These literals bypass the request-scoped caller identity that
#      the SAL #910 visibility filter depends on; an un-reviewed
#      addition would silently re-introduce cross-tenant leak surfaces
#      of the kind QC sweep #947/#955/#959 remediated.
#
#   2. vendor-literal-gate — vendor-identifier + SECS_PER_* magic-number
#      regression detection (issue #1174 PR10, pm-v3.1 lint-gate). Without
#      this gate, the Wave 1+2 refactor's vendor-monoculture cleanup
#      (PRs 1-9) decays as new code lands with hardcoded `"claude"` /
#      `"openai"` / `"anthropic"` strings outside the 6-file substrate
#      allowlist, AND the SECS_PER_* named-constant discipline (PR3)
#      regresses as new `Duration::from_secs(3600)` etc. land. Both
#      gates are load-bearing per the pm-v3.2 NO FAIL MISSION closure
#      audit (ai-memory global/policies memory
#      2cb15d34-2399-4611-a020-df6ef91683fe).
#
# Mirrors the local-developer flow: both `scripts/qc-codegraph-precheck.sh`
# and `scripts/check-vendor-literals.sh` are the same scripts CI uses.
# Run `scripts/qc-codegraph-precheck.sh --update` locally to regenerate
# the C8 allowlist when you deliberately add a new exception; run
# `scripts/check-vendor-literals.sh --self-test` locally to confirm the
# vendor gate still catches a contrived violation.

name: c8-precheck

on:
  push:
    branches: [main, develop, "release/**", "local/**"]
  pull_request:
    branches: [main, develop, "release/**"]

# Fork-PR-safe concurrency key: coalesces push + same-branch internal
# PR events; isolates fork PRs by PR number. See ci.yml for full
# rationale.
concurrency:
  group: c8-precheck-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  c8-precheck:
    name: C8 caller-context allowlist check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run C8 precheck
        run: bash scripts/qc-codegraph-precheck.sh

  vendor-literal-gate:
    name: Vendor-monoculture + SECS_PER_* lint-gate (#1174 PR10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run vendor-literal gate
        run: bash scripts/check-vendor-literals.sh
      - name: Self-test the gate (regression evidence)
        # Pm-v3.2 NO FAIL MISSION closure-audit discipline: the gate
        # itself must be load-bearing. The --self-test mode injects a
        # contrived `"anthropic"` literal at a production site outside
        # the allowlist, runs the gate, verifies the gate exits non-zero
        # + emits the expected violation message, then cleans up. Any
        # regression in the gate's detection logic (e.g. an over-broad
        # allowlist, a broken test-boundary heuristic) trips here.
        run: bash scripts/check-vendor-literals.sh --self-test

  l3-boundary-gate:
    name: L3-boundary perma-ban gate (§25.3 S5 / RQ-10 #1853)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # v0.9.0 §25.3 S5 — the epoch-closure lane ships under strictly ruled
    # public identifiers; certain internal design-doc identifiers are
    # PERMANENTLY BANNED from src/ (any string literal or comment). This
    # gate HARD-BLOCKS `rqgm|epoch_manifest|red.?queen` in src/. The
    # ruled public identifiers (SignableEpochManifest, epoch.manifest_applied,
    # EpochAdvance, EPOCH_APPLIED) are gate-clean by construction.
    steps:
      - uses: actions/checkout@v4
      - name: Run L3-boundary perma-ban gate
        run: bash scripts/check-l3-boundary.sh
      - name: Self-test the gate (regression evidence)
        # Proves the gate is load-bearing: passes a clean tree, fails on
        # a planted `epoch_manifest` violation in a tmpdir, cleans up.
        run: bash scripts/check-l3-boundary.sh --self-test

  hardcoded-literal-gate:
    name: Hardcoded-literal duplication ratchet (pm-v3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Operator directive (~6mo, escalated 2026-06-09): no hardcoded literal
    # values; no literals embedded in variable/constant names. Instructions
    # alone did not stop the regression — this gate makes it mechanical.
    # HARD-BLOCKS any string literal (>= 10 chars) duplicated across >= 3
    # production sites whose count rose above the frozen baseline (a ratchet:
    # existing rot is grandfathered, new duplication fails, baseline only
    # shrinks). See ai-memory `no-hardcoded-literals-enforcement`.
    steps:
      - uses: actions/checkout@v4
      - name: Run hardcoded-literal gate
        run: bash scripts/check-hardcoded-literals.sh
      - name: Self-test the gate (regression evidence)
        # Injects a brand-new triplicated magic string at a production site,
        # confirms the gate exits non-zero + names the offender, cleans up.
        run: bash scripts/check-hardcoded-literals.sh --self-test

  docs-vs-ssot-drift:
    # v0.7.0 (operator directive 2026-05-31: "can we use variables in
    # documentation for versions instead of literals?") — Markdown has
    # no native variables; this gate is the minimal-infra answer.
    # Parses the canonical Rust SSOTs (CURRENT_SCHEMA_VERSION,
    # EXPECTED_*, Profile::full().expected_tool_count(), etc.) + walks
    # the operator-facing .md files for known narrative-count patterns
    # + fails CI if any cited value drifts from the canonical. New
    # schema bumps / SSOT-const changes now fail loudly here when
    # narrative isn't updated in lockstep.
    name: Docs vs SSOT drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run docs-vs-SSOT drift gate
        run: bash scripts/check-docs-vs-ssot.sh
      - name: Self-test the gate (regression evidence)
        # Mirrors the vendor-literal self-test discipline. The
        # --self-test mode stages a contrived stale-claim CLAUDE.md
        # in a tmpdir + invokes the gate against AI_MEMORY_DOCS_GATE_ROOT
        # = tmpdir; the gate must catch the drift.
        run: bash scripts/check-docs-vs-ssot.sh --self-test

  cloud-init-ascii-gate:
    # v0.9.0 (issue #1880): a stray non-ASCII byte (U+2014 em-dash) in a
    # DO cloud-init template made cloud-init reject the config
    # ("unacceptable character #x0080") and boot a BARE droplet with none
    # of the postgres/AGE/pgvector substrate — a SILENT provisioning
    # failure only visible on SSH triage. This gate keeps the cloud-init
    # templates pure ASCII so `terraform apply` renders a cloud-config
    # cloud-init will parse.
    name: Cloud-init ASCII gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run cloud-init ASCII gate
        run: bash scripts/check-cloud-init-ascii.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a template carrying the exact #1880 em-dash
        # byte in a tmpdir + a clean control; the gate must reject the
        # former and pass the latter.
        run: bash scripts/check-cloud-init-ascii.sh --self-test

  test-stdin-gate:
    # Issue #1989 — full-suite-wedge regression guard. HARD-BLOCKS any
    # test-reachable acquisition of the process-global `io::stdin()`
    # handle outside the sanctioned `with_stdin_lines` helper in
    # src/cli/shell.rs. The #1989 wedge (root cause commit c10e55b4) was
    # a test that blocking-read the REAL inherited stdin, which never
    # EOFs under CI runners / agent harnesses, parking forever while
    # holding the global Stdin lock and wedging the whole parallel lib
    # suite until the 1500s watchdog killed it. This gate keeps a new
    # test from silently re-introducing that class.
    name: Test-reachable stdin-read gate (#1989)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run test-stdin gate
        run: bash scripts/check-test-stdin-reads.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a tests/ file that blocking-reads the real
        # process stdin in a #[test]; the gate must reject it.
        run: bash scripts/check-test-stdin-reads.sh --self-test

  migration-ladder-gate:
    # v1.0.0 guardrail-D (2x5-vote decision memory b682c76a) — fail-closed
    # migration-ladder-uniqueness gate. Structurally prevents the silent
    # migration-ladder-collision class: a PR built on an OLD base adding
    # `migrations/postgres/0041_v82_*.sql` while release already carries
    # `0041_v84_*.sql` (the #2036-vs-#2192 shape) produces ZERO git conflict,
    # git silently keeps BOTH files, and a corrupted/ambiguous ladder ships
    # fleet-wide. HARD-BLOCKS a duplicate numeric prefix / duplicate schema
    # version / ladder gap / cross-adapter tip disagreement / orphan file.
    name: Migration-ladder-uniqueness gate (guardrail-D)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run migration-ladder gate
        run: bash scripts/check-migration-ladder.sh
      - name: Self-test the gate (regression evidence)
        # --self-test plants the EXACT #2036/#2192 same-prefix-different-name
        # collision AND a same-version-two-arms case in a throwaway copy UNDER
        # the repo and confirms the gate rejects BOTH, plus a clean control —
        # proving the gate is load-bearing (pm-v3.2 NO FAIL MISSION discipline).
        run: bash scripts/check-migration-ladder.sh --self-test

  test-env-lock-gate:
    # Issue #2146 — the grep-gate half of issue #2127's Fix section,
    # not delivered by PR #2142 (Fable pre-merge audit of #2142).
    # HARD-BLOCKS any src/**/*.rs or tests/**/*.rs file that mutates
    # the process-global $HOME environment variable
    # (`std::env::set_var("HOME"` / `std::env::remove_var("HOME"`)
    # without also referencing the crate-canonical
    # `crate::config::test_env_lock()` serialization guard somewhere in
    # the same file. `std::env::set_var` is unsound under concurrent
    # access; this defect class recurred THREE times (#1998 -> #2115
    # -> #2127) because a new module kept hand-rolling its own
    # module-local lock instead of reusing the shared one. This gate
    # keeps a new module from silently re-introducing that class.
    name: Test-env $HOME-lock gate (#2146)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run test-env-lock gate
        run: bash scripts/check-test-env-lock.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a $HOME-mutating fixture with no
        # test_env_lock reference (the plain-omission shape) and a
        # second fixture that hand-rolls its own local lock instead of
        # the shared one (the #1998/#2115/#2127 recurrent shape); the
        # gate must reject both and spare a compliant control fixture.
        run: bash scripts/check-test-env-lock.sh --self-test

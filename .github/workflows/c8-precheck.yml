# C8 orchestrator safeguard CI gate (issue #953, CLAUDE.md §"Enforceable
# Orchestrator Safeguards") + #1174 PR10 vendor-monoculture lint-gate.
#
# Two HARD-BLOCK jobs:
#
#   1. c8-precheck — `CallerContext::for_agent("<literal>")` /
#      `for_admin("<literal>")` allowlist enforcement (issue #953).
#      These literals bypass the request-scoped caller identity that
#      the SAL #910 visibility filter depends on; an un-reviewed
#      addition would silently re-introduce cross-tenant leak surfaces
#      of the kind QC sweep #947/#955/#959 remediated.
#
#   2. vendor-literal-gate — vendor-identifier + SECS_PER_* magic-number
#      regression detection (issue #1174 PR10, pm-v3.1 lint-gate). Without
#      this gate, the Wave 1+2 refactor's vendor-monoculture cleanup
#      (PRs 1-9) decays as new code lands with hardcoded `"claude"` /
#      `"openai"` / `"anthropic"` strings outside the 6-file substrate
#      allowlist, AND the SECS_PER_* named-constant discipline (PR3)
#      regresses as new `Duration::from_secs(3600)` etc. land. Both
#      gates are load-bearing per the pm-v3.2 NO FAIL MISSION closure
#      audit (ai-memory global/policies memory
#      2cb15d34-2399-4611-a020-df6ef91683fe).
#
# Mirrors the local-developer flow: both `scripts/qc-codegraph-precheck.sh`
# and `scripts/check-vendor-literals.sh` are the same scripts CI uses.
# Run `scripts/qc-codegraph-precheck.sh --update` locally to regenerate
# the C8 allowlist when you deliberately add a new exception; run
# `scripts/check-vendor-literals.sh --self-test` locally to confirm the
# vendor gate still catches a contrived violation.

name: c8-precheck

on:
  # push.branches is deliberately restricted to branches that are NEVER a PR
  # HEAD (#2523, the #2508 class). It used to include `local/**`, which DOES
  # overlap PR head-branch names in this repo — `local/install-815-816` was
  # opened as a PR into `release/v0.7.0`. Every push to such a head branch
  # fired BOTH a push-event run and a pull_request-event run, and the
  # concurrency key below resolves to the SAME value for both (the push event
  # has no `pull_request` context, so the ternary falls through to
  # `github.ref_name` = the head branch; the same-repo pull_request event
  # resolves to `head.ref` = the identical string). With
  # `cancel-in-progress: true` that collision is guaranteed, not occasional,
  # so one of the two runs was ALWAYS cancelled and the cancelled check-run row
  # is permanent — a disposition that reads as pass in `gh pr checks` while
  # branch protection does not count it as satisfied. This workflow carries
  # EIGHT gate contexts, several of them required, so the latent wedge was
  # eight contexts wide.
  #
  # Narrowing costs no coverage: the pull_request run already gates every PR
  # (its `branches:` list is a BASE-branch filter, so a PR from any head branch
  # into main/develop/release/** is still gated), and the PR run is where these
  # gates' verdicts are consumed. The only runs lost are push-event runs on a
  # `local/**` branch with no PR open. Same fix #2509 applied to
  # tool-count-drift.yml; same shape ci.yml and coverage.yml already use.
  # Statically enforced from here on by rule (d) of
  # scripts/check-required-contexts.sh, which runs in this very workflow.
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

# Fork-PR-safe concurrency key: coalesces push + same-branch internal
# PR events; isolates fork PRs by PR number. See ci.yml for full
# rationale.
concurrency:
  group: c8-precheck-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  c8-precheck:
    name: C8 caller-context allowlist check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run C8 precheck
        run: bash scripts/qc-codegraph-precheck.sh

  vendor-literal-gate:
    name: Vendor-monoculture + SECS_PER_* lint-gate (#1174 PR10)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run vendor-literal gate
        run: bash scripts/check-vendor-literals.sh
      - name: Self-test the gate (regression evidence)
        # Pm-v3.2 NO FAIL MISSION closure-audit discipline: the gate
        # itself must be load-bearing. The --self-test mode injects a
        # contrived `"anthropic"` literal at a production site outside
        # the allowlist, runs the gate, verifies the gate exits non-zero
        # + emits the expected violation message, then cleans up. Any
        # regression in the gate's detection logic (e.g. an over-broad
        # allowlist, a broken test-boundary heuristic) trips here.
        run: bash scripts/check-vendor-literals.sh --self-test

  l3-boundary-gate:
    # QUOTED DELIBERATELY (#2473). Unquoted, the ` #1853)` opened a YAML
    # comment and the job name parsed as 44 chars — GitHub reported the
    # check-run as `L3-boundary perma-ban gate (§25.3 S5 / RQ-10` and THAT
    # truncation was what branch protection required. Quoting is now
    # MECHANICALLY REQUIRED for any job name containing ` #`: rule (e) of
    # scripts/check-required-contexts.sh hard-fails the unquoted form
    # repo-wide, so this cannot silently re-land.
    name: "L3-boundary perma-ban gate (§25.3 S5 / RQ-10 #1853)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # v0.9.0 §25.3 S5 — the epoch-closure lane ships under strictly ruled
    # public identifiers; certain internal design-doc identifiers are
    # PERMANENTLY BANNED from src/ (any string literal or comment). This
    # gate HARD-BLOCKS `rqgm|epoch_manifest|red.?queen` in src/. The
    # ruled public identifiers (SignableEpochManifest, epoch.manifest_applied,
    # EpochAdvance, EPOCH_APPLIED) are gate-clean by construction.
    steps:
      - uses: actions/checkout@v4
      - name: Run L3-boundary perma-ban gate
        run: bash scripts/check-l3-boundary.sh
      - name: Self-test the gate (regression evidence)
        # Proves the gate is load-bearing: passes a clean tree, fails on
        # a planted `epoch_manifest` violation in a tmpdir, cleans up.
        run: bash scripts/check-l3-boundary.sh --self-test

  hardcoded-literal-gate:
    name: Hardcoded-literal duplication ratchet (pm-v3.1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Operator directive (~6mo, escalated 2026-06-09): no hardcoded literal
    # values; no literals embedded in variable/constant names. Instructions
    # alone did not stop the regression — this gate makes it mechanical.
    # HARD-BLOCKS any string literal (>= 10 chars) duplicated across >= 3
    # production sites whose count rose above the frozen baseline (a ratchet:
    # existing rot is grandfathered, new duplication fails, baseline only
    # shrinks). See ai-memory `no-hardcoded-literals-enforcement`.
    steps:
      - uses: actions/checkout@v4
      - name: Run hardcoded-literal gate
        run: bash scripts/check-hardcoded-literals.sh
      - name: Self-test the gate (regression evidence)
        # Injects a brand-new triplicated magic string at a production site,
        # confirms the gate exits non-zero + names the offender, cleans up.
        run: bash scripts/check-hardcoded-literals.sh --self-test

  docs-vs-ssot-drift:
    # v0.7.0 (operator directive 2026-05-31: "can we use variables in
    # documentation for versions instead of literals?") — Markdown has
    # no native variables; this gate is the minimal-infra answer.
    # Parses the canonical Rust SSOTs (CURRENT_SCHEMA_VERSION,
    # EXPECTED_*, Profile::full().expected_tool_count(), etc.) + walks
    # the operator-facing .md files for known narrative-count patterns
    # + fails CI if any cited value drifts from the canonical. New
    # schema bumps / SSOT-const changes now fail loudly here when
    # narrative isn't updated in lockstep.
    name: Docs vs SSOT drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run docs-vs-SSOT drift gate
        run: bash scripts/check-docs-vs-ssot.sh
      - name: Self-test the gate (regression evidence)
        # Mirrors the vendor-literal self-test discipline. The
        # --self-test mode stages a contrived stale-claim CLAUDE.md
        # in a tmpdir + invokes the gate against AI_MEMORY_DOCS_GATE_ROOT
        # = tmpdir; the gate must catch the drift.
        run: bash scripts/check-docs-vs-ssot.sh --self-test

  doc-symbol-anchor-gate:
    # Issue #2629 / 3x7 claims register. `check-docs-vs-ssot.sh` pins
    # VALUES and nothing pinned SYMBOLS, so `file:line` anchors,
    # `path.rs::symbol` qualifications and `[`sym`](../src/path.rs)`
    # links rotted silently on every rename and module split. The audit
    # sampled SIX anchors and found 6/6 MISS at HEAD — including
    # `decorate_memory`, which has been `decorate_memory_many` since the
    # recall decorator was batched. The register's ruling: "Anchors that
    # miss 6/6 are worse than no anchors — they cost the reviewer trust
    # they cannot get back." Dependency-free (grep/python3 over src/)
    # because CI has no codegraph; the migration-ladder tip is REUSED
    # from scripts/check-migration-ladder.sh rather than re-derived.
    # Burn-down allowlist, where a STALE entry ALSO FAILS (#2494 style).
    name: Doc symbol/path anchor gate (#2629)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run doc symbol-anchor gate
        run: bash scripts/check-doc-symbol-anchors.sh
      - name: Self-test the gate (regression evidence)
        # Plants the audit's OWN finding (the decorate_memory rename), a
        # pre-modularisation path, a past-EOF file:line anchor, a stale
        # `migrate_vNN` tip claim, and a dead markdown symbol link in a
        # throwaway copy under .local-runs/ — with near-miss controls
        # (the correct symbol, a `Type::method` brace list, an in-range
        # anchor, a module link, and CLAUDE.md's deliberate `test ! -f
        # src/handlers.rs` absent-path assertion) that must each PASS,
        # so the rule is proven to fire on the defect and not on its
        # neighbourhood. Both allowlist directions are exercised, and an
        # empty src/ tree must fail CLOSED rather than green a no-op.
        run: bash scripts/check-doc-symbol-anchors.sh --self-test

  sdk-route-path-gate:
    # 3x7 claims register 3.3.2 — C-19 and C-20. NOTHING pinned the SDK
    # READMEs or SDK client sources against `src/handlers/routes.rs`, so
    # `grant()` / `revoke()` / `cluster()` shipped in BOTH SDKs against
    # three paths with ZERO hits in routes.rs (they 404 at runtime), and
    # TS `unsubscribe(id)` targeted `DELETE /api/v1/subscriptions/:id`
    # when `src/lib.rs` registers delete on the COLLECTION path only and
    # the id rides the query string. The gate normalises path PARAMETERS
    # on both sides, which is what makes it catch C-20: a raw-string
    # membership test passes it (the collection path IS registered) and
    # a parameter-blind test passes it too.
    name: SDK-path vs routes.rs membership gate (#2629)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run SDK-route-path gate
        run: bash scripts/check-sdk-route-paths.sh
      - name: Self-test the gate (regression evidence)
        # Plants C-19 in the TS client, the python client and BOTH
        # READMEs, and C-20 in the TS client and its README, against a
        # fixture routes.rs carrying the same collection-vs-member
        # asymmetry as the real one. Near-miss controls that must PASS:
        # a correctly-templated member path in each SDK dialect, a
        # collection call with a QUERY STRING (the shape C-20's fix must
        # adopt), and the bare `/api/v1/` base-URL prefix. An empty sdk
        # scan set fails CLOSED so the gate cannot no-op to green.
        run: bash scripts/check-sdk-route-paths.sh --self-test

  ci-job-claims-gate:
    # 3x7 claims register 3.3.3 — C-21 / C-23 / C-24 / C-31, all one
    # shape: "a control was removed and the prose was not". `ci.yml`'s
    # "Code Coverage" job was removed in #1993 and is still cited as the
    # live coverage gate in README + ROADMAP; the `postgres-age` nightly
    # was deleted in da3fb9cc and the release notes still say the stack
    # is "gated nightly" by it; PERFORMANCE.md cites an AGE job in
    # bench.yml that has zero `age` hits; and bench.yml — which says of
    # ITSELF "Bench is advisory (not in required-status-checks)" — is
    # described as gating every PR.
    #
    # EXISTENCE alone would green that last one, which is why the gate
    # also carries ENFORCEMENT-TRUTHFULNESS: a doc that says a named job
    # gates / blocks merge / fails the PR must resolve to a context
    # actually declared in required-contexts-release.txt. That is the
    # rule that counters the bias the register identified — "the drift
    # direction is consistently toward MORE CLAIMED ENFORCEMENT THAN
    # EXISTS." Shipped as a ratchet with a pending-fix ledger because
    # five document-correction lanes are in flight concurrently.
    name: Named-CI-job existence + enforcement-truthfulness gate (#2629)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run CI-job-claims gate
        run: bash scripts/check-ci-job-claims.sh
      - name: Self-test the gate (regression evidence)
        # Plants all four historical claims. The C-31 leg is the
        # load-bearing one: the workflow EXISTS and its job EXISTS, so
        # it asserts the rejection comes from the ENFORCEMENT rule
        # specifically, not merely that the exit code was non-zero. Its
        # paired near-miss — the same workflow described WITHOUT an
        # enforcement verb — must PASS, so the rule does not ban
        # mentioning an advisory workflow at all. An empty workflow set
        # fails CLOSED.
        run: bash scripts/check-ci-job-claims.sh --self-test

  doc-surface-completeness-gate:
    # Issue #2839 / 3x7 lane-2 register §E. Gates 4 (docs-vs-SSOT) and 9
    # (doc-symbol-anchors) both pin whether a CITED value/symbol is RIGHT
    # — an ACCURACY axis. NEITHER answers "is anything MISSING?" — a
    # COMPLETENESS axis. #2831 found, by three trivial diffs, that a
    # reference doc can be a full release behind while every accuracy gate
    # is GREEN: Command variants absent from CLI_REFERENCE.md (which
    # asserts it "is kept in sync"), routes.rs consts absent from
    # API_REFERENCE.md, and the DESTRUCTIVE #2024 memory_skill_* pair
    # absent from agent-skills.md. Same #2492 overclaim bias, one axis
    # over. Three set-differences against consts the repo already exports
    # (no new SSOT): every Command variant is documented (kebab-cased),
    # every routes.rs path is documented (param-normalised), every
    # registry tool is named in a live non-frozen doc. Burn-down
    # allowlist where a STALE entry ALSO FAILS; an EMPTY scan set fails
    # CLOSED. Dependency-free (grep/python3 over src/), matching the
    # toolchain-free posture of the other c8-precheck gates.
    name: Doc surface completeness gate (#2839)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run doc-surface-completeness gate
        run: bash scripts/check-doc-surface-completeness.sh
      - name: Self-test the gate (regression evidence)
        # Plants one real omission per rule (an undocumented subcommand,
        # an undocumented route, an undocumented tool) in a throwaway copy
        # under .local-runs/, with near-miss controls that must PASS (a
        # subcommand documented ONLY inside a code fence; a route
        # documented with `:id` not `{id}`; a #[command(hide)] variant that
        # is exempt) and the frozen-exclusion control (a tool named ONLY in
        # a frozen docs/v0.*/ file, which must NOT count as coverage). Both
        # allowlist directions are exercised, an injected engine fault must
        # fail CLOSED, and an empty scan set must fail CLOSED rather than
        # green a no-op.
        run: bash scripts/check-doc-surface-completeness.sh --self-test

  capacity-claim-gate:
    # CERT GATE (TRUTHFULNESS; #2869, following CERT-GATE-2 #2629/#2492). The
    # 3x7 claims register finding C-12 caught `docs/zero-touch-trust.html` still
    # shipping the retired "1 to ~1,000,000 AI agents" figure (#2438) in BOTH
    # its <meta description> and its tagline — while every other claims gate was
    # GREEN, because NONE policed agent-count / scale-CAPACITY claims. Gate 4
    # pins VALUES; gates 9/10/11 pin symbols / SDK paths / CI-job claims; this
    # pins that no doc publishes a single-fleet agent number above the ratified
    # 500-1000-agent envelope. Structural exemptions (row/corpus counts never
    # associate with an `agents` noun; retirement notes; frozen doc trees) keep
    # it aimed at the defect, and a burn-down allowlist (STALE entry hard-fails)
    # carries the vetted, explicitly-aspirational vision-tier statements.
    name: Capacity-claim ceiling gate (#2869)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run capacity-claim gate
        run: bash scripts/check-capacity-claims.sh
      - name: Self-test the gate (regression evidence)
        # Plants the exact #2438 1,000,000-agent overclaim (MUST be flagged) +
        # near-miss controls that MUST pass (the honest 500-1000 envelope, a
        # corpus-row "1M+ on Postgres", the MAX_ROWS cap, a retirement note, a
        # bare year, and an "Ed25519 agent" identifier whose interior digit-run
        # must not read as an agent count), then exercises allowlist coverage,
        # the stale-entry hard-fail, and the empty-scan fail-closed.
        run: bash scripts/check-capacity-claims.sh --self-test

  benchmark-claim-gate:
    # CERT GATE (TRUTHFULNESS; #2879, following #2869 + CERT-GATE-2
    # #2629/#2492). The final cert vote caught `ROADMAP.md` §9.5 still
    # publishing the RETIRED Python-shadow-harness keyword figures (R@5
    # 97.0% / 485-of-500 and 232 q/s) while `README.md` §Benchmark had
    # already corrected them to the BINARY-FAITHFUL 96.4% (482/500) / 1.2
    # q/s. Gate 4 pins Rust consts; gates 9/10/11 pin symbols / SDK paths /
    # CI-job claims; #2869 pins agent-count capacity claims — but NOTHING
    # policed a published BENCHMARK NUMBER, so a retired-shadow keyword
    # cell shipped with every claims gate GREEN (the #2444 shape). This
    # gate parses the canonical binary-faithful keyword-baseline row from
    # `benchmarks/longmemeval/results.md` (the SSOT README cites) and fails
    # when a top-level README.md / ROADMAP.md keyword table CELL (recall or
    # q/s) contradicts it. Retirement/historical notes that quote the
    # retired figure are exempt; non-keyword (LLM-expanded / semantic /
    # autonomous) rows use a different canon and are not compared.
    name: Benchmark-claim canon gate (#2879)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run benchmark-claim gate
        run: bash scripts/check-benchmark-claims.sh
      - name: Self-test the gate (regression evidence)
        # --self-test plants the exact C-01 contradiction (retired keyword
        # 97.0% R@5 + 98.2% R@10 + 232 q/s as LIVE cells → gate MUST fail)
        # against the REAL canon results.md, plus near-miss controls that
        # MUST pass (the corrected binary-faithful cells, the higher
        # LLM-expanded anchor row, a retirement note quoting the retired
        # figures, the semantic row, and a header-based keyword table row
        # with no R@ token), then exercises the empty-scan fail-closed.
        run: bash scripts/check-benchmark-claims.sh --self-test

  cloud-init-ascii-gate:
    # v0.9.0 (issue #1880): a stray non-ASCII byte (U+2014 em-dash) in a
    # DO cloud-init template made cloud-init reject the config
    # ("unacceptable character #x0080") and boot a BARE droplet with none
    # of the postgres/AGE/pgvector substrate — a SILENT provisioning
    # failure only visible on SSH triage. This gate keeps the cloud-init
    # templates pure ASCII so `terraform apply` renders a cloud-config
    # cloud-init will parse.
    name: Cloud-init ASCII gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run cloud-init ASCII gate
        run: bash scripts/check-cloud-init-ascii.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a template carrying the exact #1880 em-dash
        # byte in a tmpdir + a clean control; the gate must reject the
        # former and pass the latter.
        run: bash scripts/check-cloud-init-ascii.sh --self-test

  test-stdin-gate:
    # Issue #1989 — full-suite-wedge regression guard. HARD-BLOCKS any
    # test-reachable acquisition of the process-global `io::stdin()`
    # handle outside the sanctioned `with_stdin_lines` helper in
    # src/cli/shell.rs. The #1989 wedge (root cause commit c10e55b4) was
    # a test that blocking-read the REAL inherited stdin, which never
    # EOFs under CI runners / agent harnesses, parking forever while
    # holding the global Stdin lock and wedging the whole parallel lib
    # suite until the 1500s watchdog killed it. This gate keeps a new
    # test from silently re-introducing that class.
    name: Test-reachable stdin-read gate (#1989)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run test-stdin gate
        run: bash scripts/check-test-stdin-reads.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a tests/ file that blocking-reads the real
        # process stdin in a #[test]; the gate must reject it.
        run: bash scripts/check-test-stdin-reads.sh --self-test

  migration-ladder-gate:
    # v1.0.0 guardrail-D (2x5-vote decision memory b682c76a) — fail-closed
    # migration-ladder-uniqueness gate. Structurally prevents the silent
    # migration-ladder-collision class: a PR built on an OLD base adding
    # `migrations/postgres/0041_v82_*.sql` while release already carries
    # `0041_v84_*.sql` (the #2036-vs-#2192 shape) produces ZERO git conflict,
    # git silently keeps BOTH files, and a corrupted/ambiguous ladder ships
    # fleet-wide. HARD-BLOCKS a duplicate numeric prefix / duplicate schema
    # version / ladder gap / cross-adapter tip disagreement / orphan file.
    name: Migration-ladder-uniqueness gate (guardrail-D)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run migration-ladder gate
        run: bash scripts/check-migration-ladder.sh
      - name: Self-test the gate (regression evidence)
        # --self-test plants the EXACT #2036/#2192 same-prefix-different-name
        # collision AND a same-version-two-arms case in a throwaway copy UNDER
        # the repo and confirms the gate rejects BOTH, plus a clean control —
        # proving the gate is load-bearing (pm-v3.2 NO FAIL MISSION discipline).
        run: bash scripts/check-migration-ladder.sh --self-test

  install-checksum-gate:
    # Issue #2449 — supply-chain. `install.sh` wrapped its checksum
    # verification in a fail-OPEN branch (warn and install anyway), and
    # `release.yml` published no `.sha256` asset for the tarballs the
    # installer downloads — so the fetch 404'd on every ordinary install,
    # the fail-open branch fired every time, and the verification step
    # passed by DOING NOTHING. `install.ps1` verified nothing at all.
    # HARD-BLOCKS a reintroduced fail-open branch in either installer and
    # any release artifact published without a sibling `.sha256`.
    name: Installer checksum fail-closed gate (#2449)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run installer checksum gate
        run: bash scripts/check-install-checksum.sh
      - name: Self-test the gate (regression evidence)
        # Two halves, both load-bearing. BEHAVIOURAL: plants a MISSING and
        # a MISMATCHED checksum and proves the REAL, unmodified install.sh
        # rejects both (asserting on its abort token, not merely a
        # non-zero exit, so a broken harness cannot masquerade as a
        # correct refusal), plus a valid-checksum accept, a
        # no-SHA-256-tool abort, and the openssl rung in isolation.
        # STATIC: plants six regressions — a deleted gate region in each
        # installer, a restored fail-open phrase, a removed abort branch,
        # a deleted release.yml checksum sweep, and a dropped sibling
        # `.sha256` — into a throwaway copy under the repo and confirms
        # the gate rejects each, with an unmutated control first.
        run: bash scripts/check-install-checksum.sh --self-test

  conformance-readers-gate:
    # Issue #2452 — the mandated >=2-non-Rust-reader conformance proof could
    # silently never run. `tests/conformance_readers.rs` SKIPped-and-PASSed
    # when python3/node were absent (libtest scores an early `return` as
    # `ok`, and it CAPTURES the "loud" SKIP note, so the pass was silent),
    # and `grep -rln conformance .github/workflows/` returned NOTHING — no
    # environment anywhere was KNOWN to carry both interpreters. A Gate-1
    # freeze-critical item marked DISCHARGED rested on a test that could
    # no-op to green. This job is the environment where the guarantee is
    # actually claimed, so here an absent interpreter is a FAILURE.
    name: Non-Rust conformance-reader proof gate (#2452)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The interpreters are PROVISIONED, not assumed. The gate fails closed
      # when they are missing, so relying on whatever the runner image
      # happens to ship would make a controlled proof depend on an accident.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Needed only by the gate's R-203 / before-after evidence, which
      # compiles tests/conformance_readers.rs standalone with `rustc --test`
      # (the harness is deliberately crate-dependency-free — no cargo build).
      - name: Install Rust 1.96.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Run conformance-reader gate
        run: bash scripts/check-conformance-readers.sh
      - name: Self-test the gate (regression evidence)
        # Plants failures and proves the gate rejects each FOR THE STATED
        # REASON, not merely with a non-zero exit: a corrupted record, the
        # MUST-REJECT tampered vector re-labelled VALID (which only a reader
        # that really checks Ed25519 can catch — the plant that separates
        # "two interpreters ran" from "a reader verified"), a no-op stub
        # reader, a reader that prints a plausible N/N summary and nothing
        # else, a shrunken corpus, an interpreter-free PATH against the REAL
        # gate, a gutted fail-closed region, a restored SKIP note, a
        # workflow set that never invokes the gate, and the escape hatch
        # exported from CI. An unmutated control runs first. Corpus plants
        # mutate a COPY under .local-runs/ — conformance/ is never written.
        run: bash scripts/check-conformance-readers.sh --self-test

  test-env-lock-gate:
    # Issue #2146 — the grep-gate half of issue #2127's Fix section,
    # not delivered by PR #2142 (Fable pre-merge audit of #2142).
    # HARD-BLOCKS any src/**/*.rs or tests/**/*.rs file that mutates
    # the process-global $HOME environment variable
    # (`std::env::set_var("HOME"` / `std::env::remove_var("HOME"`)
    # without also referencing the crate-canonical
    # `crate::config::test_env_lock()` serialization guard somewhere in
    # the same file. `std::env::set_var` is unsound under concurrent
    # access; this defect class recurred THREE times (#1998 -> #2115
    # -> #2127) because a new module kept hand-rolling its own
    # module-local lock instead of reusing the shared one. This gate
    # keeps a new module from silently re-introducing that class.
    name: Test-env $HOME-lock gate (#2146)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run test-env-lock gate
        run: bash scripts/check-test-env-lock.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages a $HOME-mutating fixture with no
        # test_env_lock reference (the plain-omission shape) and a
        # second fixture that hand-rolls its own local lock instead of
        # the shared one (the #1998/#2115/#2127 recurrent shape); the
        # gate must reject both and spare a compliant control fixture.
        run: bash scripts/check-test-env-lock.sh --self-test

  required-contexts-gate:
    # Issues #2494 / #2496 — required-status-check SOUNDNESS. The required set
    # on `release/v1.0.0` read as 22 gates and functioned as far fewer, in
    # three independent ways, all confirmed on live check-run data:
    #   * THE WEDGE. `ci.yml`'s `mobile-cross-compile` was BOTH a matrix job
    #     AND carried a job-level `if:`. GitHub evaluates a job-level `if:`
    #     BEFORE matrix expansion, so on docs-only commit 45ba8741 it emitted
    #     ONE check-run named `Cross-compile (${{ matrix.target }})` and the
    #     two REQUIRED expanded names were never created — pending forever,
    #     and `enforce_admins: true` means no admin merge clears it.
    #   * THE FAIL-OPEN. Eight required contexts carry a job-level `if:` and
    #     report `skipped`, which branch protection COUNTS AS SATISFIED.
    #   * THE UNREPORTABLE CONTEXT. A `paths:` filter on the carrying
    #     workflow's `pull_request` trigger wedges the branch identically,
    #     with no `if:` anywhere in sight.
    # HARD-BLOCKS all three statically, against a HAND-AUTHORED mirror of the
    # required set (never generated from live API state — see the mirror's
    # header for why that distinction is load-bearing). Unconditional: NO
    # `needs: classify`, no job-level `if:`, no `paths:` filter — a gate that
    # polices the docs-only short-circuit must not be subject to it.
    #
    # Issue #2508 added rule (d), the CANCELLED DUPLICATE: a workflow on BOTH
    # `push` and `pull_request` whose `push.branches` can match a PR HEAD
    # branch, under a concurrency group that resolves to the same key for both
    # events with `cancel-in-progress: true`. Two runs per sha, one always
    # cancelled, and the cancelled row is permanent — a disposition that reads
    # as pass in `gh pr checks` while branch protection does not count it as
    # satisfied. Rule (d) sweeps EVERY workflow here, not only today's
    # required-context carriers, because that artefact pollutes any PR's
    # rollup and becomes a wedge the moment the context is required. This
    # workflow's own `push.branches` lost `local/**` for exactly that reason
    # (#2523); `tool-count-drift.yml` was fixed in #2509.
    name: Required-context + classify-base soundness gate (#2494/#2496/#2508)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run required-contexts gate
        run: bash scripts/check-required-contexts.sh
      - name: Self-test the gate (regression evidence)
        # --self-test plants each historical shape in a throwaway copy UNDER
        # the repo (never system /tmp): the (b1) matrix+`if:` wedge, an (a)
        # mirror context matching no job, a (c) `paths:`-filtered carrier, a
        # (b3) unguarded step in a `needs: classify` job, a (b4) DECIDER
        # carrying a job-level `if:` — rejected EVEN WHEN allowlisted, which
        # is the property that separates (b4) from (b2), because a skipped
        # decider skips its whole dependent subtree and every skipped member
        # then counts as satisfied (#2494 residual) — and both directions
        # of the (b2) burn-down ratchet. The clean control additionally
        # asserts the parser reproduces BOTH YAML scalar outcomes — ` #`
        # truncates (the live `§25.3 S5 / RQ-10` context), `(#` does not —
        # so a laundered mirror cannot make the gate a tautology.
        # The (d) leg (#2508) plants the VERBATIM pre-#2509
        # `tool-count-drift.yml` trigger + concurrency block (R-203) and
        # requires a rejection, alongside FOUR near-miss shapes that must each
        # PASS — the #2509-narrowed triggers, `cancel-in-progress: false`, a
        # push-only workflow, and an `event_name`-keyed group — so the rule is
        # proven to fire on the defect and not on its neighbourhood, plus the
        # three pending-fix-ledger directions (correct entry passes, an entry
        # for a DIFFERENT pattern does not absolve, an issue-less entry fails).
        run: bash scripts/check-required-contexts.sh --self-test
      - name: Classify-base split behavioural proof (R-203)
        # The other half of the atomic fix. EXTRACTS the classifier shell block
        # verbatim from ci.yml and runs it against throwaway git fixtures, then
        # runs the SAME fixtures against the frozen pre-fix block at
        # scripts/test/fixtures/ci-classify-prefix-2496.sh. A PR with code
        # earlier and a docs-only last push must classify docs_only=FALSE
        # against the live workflow and TRUE against the frozen block — so a
        # silently-broken extraction cannot make the assertions vacuous.
        # SECTION C (#2494 residual) additionally pins the four live premises
        # that make requiring the two DECIDER contexts safe — declared in the
        # mirror, no job-level `if:`/matrix, `pull_request` covering
        # `release/**` unfiltered, and a `push:` branch list that cannot match
        # a PR HEAD branch (the #2508 one-run-per-SHA precondition) — with its
        # own frozen-pre-fix-mirror regression leg at
        # scripts/test/fixtures/required-contexts-prefix-2494.txt.
        run: bash scripts/test/test-ci-workflow-invariants.sh

  git-dependency-source-gate:
    # Issues #2050 / #2512 — SUPPLY-CHAIN reproducibility. `Cargo.toml` pinned
    # `paste = { git = "https://github.com/alphaonedev/paste", rev = "6a30252" }`
    # as the RUSTSEC-2024-0436 workaround. On 2026-07-15 the fork REPOSITORY was
    # deleted out-of-band (`git ls-remote` → "Repository not found"; the API
    # returns 404), and every cold cargo resolve in this repo began failing
    # permanently on a rev that can never come back. Nothing in this repo had
    # changed. `rev` pinning buys immutability of CONTENT, never of EXISTENCE.
    #
    # It read as flake before it read as breakage: warm `~/.cargo/git` caches
    # kept passing, so #2050 was first filed against two unrelated PRs. Then it
    # SURVIVED ITS OWN FIX for 15 days — #2051 vendored `paste` into
    # `vendor/paste/` on `release/v1.0.0`, but `main` (the DEFAULT branch, and
    # therefore the only branch GitHub runs `schedule:` workflows from) never
    # received it, so `postgres-parity-nightly` stayed hard-red on the identical
    # error every night and was rediscovered from scratch as #2512.
    #
    # This gate makes the #2051 posture STRUCTURAL rather than a convention in a
    # manifest comment: third-party source we depend on comes from crates.io or
    # lives in-tree under `vendor/`, where it is reviewable, diffable, and
    # resolvable with no network at all. Static and offline by design — probing
    # remotes at PR time would make this repo's CI depend on third-party
    # availability and teach reviewers to ignore a red gate.
    name: Git-dependency-source supply-chain gate (#2050/#2512)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run git-dependency-source gate
        run: bash scripts/check-git-dependency-sources.sh
      - name: Self-test the gate (regression evidence)
        # --self-test stages three violation shapes in a tmpdir — the exact
        # #2050 inline `git`+`rev` pin, the `[dependencies.x]` section form, and
        # the resolved `source = "git+…"` that outlives a reverted manifest edit
        # (a Cargo.toml fix with a stale Cargo.lock still breaks `--locked`) —
        # plus a clean control carrying `repository`/`homepage` URLs and the
        # post-#2051 `path = "vendor/paste"` shape, which must NOT trip.
        run: bash scripts/check-git-dependency-sources.sh --self-test

  create-extension-allowlist-gate:
    # Issue #2648 — SUPPLY-CHAIN. A PostgreSQL extension installs AS
    # SUPERUSER inside the process that owns the substrate — below the SAL,
    # below governance, below the signed audit chain — and persists into
    # `pg_dump`. It is not a dependency in the ordinary sense; it is code
    # executing beneath every control this release has spent its audit
    # verifying. This gate HARD-BLOCKS any `CREATE EXTENSION <name>` in the
    # repo whose <name> is not on the closed `{vector, age}` allowlist —
    # the same closed-allowlist + self-test + no-`if:` shape the sibling
    # `vendor-literal-gate` / `git-dependency-source-gate` established, and
    # it keeps a currently-clean property (zero unallowlisted extension
    # references at HEAD) clean at tag-cut, which is the cheapest moment.
    name: "CREATE EXTENSION allowlist gate (#2648)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run CREATE EXTENSION allowlist gate
        run: bash scripts/check-create-extension-allowlist.sh
      - name: Self-test the gate (regression evidence)
        # Per #2635 a supply-chain gate without a self-test has never been
        # shown to be load-bearing, and per #2641 a gate can print a block
        # and still exit 0. --self-test plants an off-allowlist extension
        # named `foo`, asserts the gate exits non-zero + names the `foo`
        # offender, then plants an allowlisted extension named `vector` and
        # asserts it PASSES (R-203 near-miss: proves the gate blocks the
        # off-allowlist NAME, not the mere presence of a create-extension
        # DDL statement).
        run: bash scripts/check-create-extension-allowlist.sh --self-test

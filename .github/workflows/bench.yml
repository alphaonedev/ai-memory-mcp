# Pillar 3 / Stream F — performance budget CI guard.
#
# Runs `ai-memory bench` on every pull request and trunk push so the
# p95 budgets published in `PERFORMANCE.md` stay enforced. The bench
# binary exits non-zero when any operation's measured p95 exceeds its
# target by more than the published 10% tolerance, which fails the
# workflow.
#
# Reference hardware per `PERFORMANCE.md` is GitHub-hosted Linux
# x86_64 (`ubuntu-latest`). The macOS correctness checks
# already live in `ci.yml`; this workflow is single-runner on purpose.

name: Bench

on:
  pull_request:
    branches: [main, develop, "release/**"]
    # Bench is advisory (not in required-status-checks). Trigger-level
    # paths-ignore is safe here and saves a full release build (~6-8 min)
    # on every docs-only PR.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main, develop, "release/**"]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Fork-PR-safe concurrency key. Coalesces push + same-branch internal
  # PR events; isolates fork PRs by PR number so they cannot collide
  # with protected-branch keys. See ci.yml for full rationale.
  group: bench-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    # RUNNER PLACEMENT — GitHub-hosted, AND THE NAME IS A CLAIM
    # (the rule is stated at the head of ci.yml).
    #
    # `ubuntu-latest` is not a convenience here, it is the REFERENCE HARDWARE
    # the published budgets are defined against: `PERFORMANCE.md`
    # §"Hardware Baseline" pins CI to "GitHub-hosted Linux x86_64 runners
    # (`ubuntu-latest`)" and its platform multiplier (`MACOS_BUDGET_MULT`)
    # gives that class the 1.0 multiplier every p95 target in the budget
    # table is expressed in. `performance/baseline.json` documents the
    # runner class it must be CAPTURED on (`ubuntu-latest`, via the
    # `regenerate-baseline` median-of-3 job) — the committed file is still a
    # dev bootstrap placeholder (`runner_class: local-dev-bootstrap`,
    # `bootstrap: true`), which is exactly why the compare step skips.
    # #3109 moved the job to `[self-hosted, linux-fed]` WITHOUT moving the
    # budgets, so a p95 measured on the f2 node was being compared against an
    # `ubuntu-latest`-calibrated target while the job name,
    # PERFORMANCE.md §"Hardware Baseline" and the baseline file all still
    # said `ubuntu-latest` — a measurement read off the wrong machine and a
    # doc-vs-reality drift in the same move.
    #
    # Moving it back both makes the job name TRUE again (no rename, so no
    # required-context churn — this job is advisory, see the `paths-ignore`
    # note above) and returns an advisory 6-8 min release build to the hosted
    # pool instead of a scarce self-hosted slot.
    name: ai-memory bench (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin ai-memory

      - name: Run bench (gate)
        run: |
          set +e
          target/release/ai-memory bench | tee bench-table.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## ai-memory bench'
            echo ''
            echo '`ai-memory bench` runs the canonical workload from '
            echo '[`src/bench.rs`](../blob/${{ github.sha }}/src/bench.rs) '
            echo 'against the budgets published in '
            echo '[`PERFORMANCE.md`](../blob/${{ github.sha }}/PERFORMANCE.md). '
            echo 'Fails the build when any p95 exceeds its target by >10%.'
            echo ''
            echo '```'
            cat bench-table.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # #1579 B8 — corpus-scale gate. The default workload (~500 rows)
      # cannot see corpus-scale blowouts (the P1 audit measured recall
      # p95 361 ms vs the 50 ms budget at 100k rows while the default
      # bench stayed green). This step seeds a 10k-row scratch corpus
      # and gates against the per-scale budgets in PERFORMANCE.md
      # §"Corpus-scale budgets" (store ≤120 ms, search ≤60 ms,
      # recall ≤80 ms p95; KG rows keep their canonical budgets).
      # Measured wall-clock on ubuntu-latest-class hardware: well
      # under a minute including seeding.
      - name: Run bench at 10k scale (gate)
        run: |
          set +e
          target/release/ai-memory bench --scale 10000 | tee bench-table-10k.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## ai-memory bench --scale 10000'
            echo ''
            echo 'Corpus-scale gate (#1579 B8): same 8 operations over a '
            echo '10k-row seeded corpus, gated against the `[scale]` '
            echo 'budget table in PERFORMANCE.md §"Corpus-scale budgets".'
            echo ''
            echo '```'
            cat bench-table-10k.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # #1987 — baseline regression guard, ADVISORY (never blocks). Compares
      # this run against the committed performance/baseline.json via the shipped
      # `bench --baseline` CLI. It self-skips while the committed baseline is a
      # dev-machine BOOTSTRAP (a dev-vs-ubuntu-latest compare is pure hardware
      # noise); run the `regenerate-baseline` workflow_dispatch job to capture a
      # real median-of-3 ubuntu-latest baseline, commit it with bootstrap:false,
      # and this step activates. Promote to a BLOCKING gate only after a soak
      # proves <1% false-positive across >=20 runs (ruling d6a366ea wave-2).
      - name: Baseline regression (advisory, #1987)
        if: always()
        run: |
          set +e
          if [ ! -f performance/baseline.json ]; then
            echo "no performance/baseline.json committed — skipping advisory compare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BOOTSTRAP=$(python3 -c "import json;print(json.load(open('performance/baseline.json')).get('bootstrap', False))")
          if [ "$BOOTSTRAP" != "False" ]; then
            {
              echo '## Baseline regression (advisory, #1987)'
              echo 'SKIPPED — the committed `performance/baseline.json` is a dev-machine'
              echo 'BOOTSTRAP. Run the **regenerate-baseline** workflow_dispatch job on'
              echo 'ubuntu-latest, commit the result with `bootstrap: false`, and this'
              echo 'advisory compare activates.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          target/release/ai-memory bench --baseline performance/baseline.json \
            --regression-threshold 50 | tee baseline-compare.txt
          {
            echo '## Baseline regression (advisory, #1987)'
            echo ''
            echo 'ADVISORY — never fails the build. Median-of-3 baseline vs this run,'
            echo 'threshold +50%. Promote to blocking only after a soak proves a'
            echo '<1% false-positive rate across >=20 runs.'
            echo ''
            echo '```'
            cat baseline-compare.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ADVISORY: swallow `bench --baseline`'s non-zero regression exit so
          # this step is never a build failure.
          exit 0

      - name: Run bench (JSON for artifact)
        if: always()
        run: target/release/ai-memory bench --json > bench-results.json || true

      - name: Run bench at 10k scale (JSON for artifact)
        if: always()
        run: target/release/ai-memory bench --scale 10000 --json > bench-results-10k.json || true

      - name: Upload bench artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-results
          path: |
            bench-results.json
            bench-results-10k.json
            bench-table.txt
            bench-table-10k.txt
          if-no-files-found: warn

  # #1987 — the baseline GENERATION recipe. Operator-triggered
  # (workflow_dispatch) so a real median-of-3 baseline is captured ON the CI
  # runner class it will gate (never a dev machine). Uploads the result as an
  # artifact for the operator to commit as performance/baseline.json with
  # bootstrap:false — the workflow has contents:read and never auto-commits.
  regenerate-baseline:
    # RUNNER PLACEMENT — GitHub-hosted, same reference-hardware argument as
    # `bench` above (the rule is stated at the head of ci.yml). This job MINTS the
    # committed baseline, so it must run on the runner class the baseline
    # claims: its own name says `ubuntu-latest`, and so does the `_note` field
    # it writes into `performance/baseline.json`.
    name: Regenerate bench baseline (ubuntu-latest, median-of-3)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --bin ai-memory

      - name: Capture median-of-3 baseline
        env:
          RUNNER_BASELINE_CLASS: ubuntu-latest
        run: |
          for i in 1 2 3; do
            target/release/ai-memory bench --json > "run-$i.json"
          done
          python3 .github/scripts/median_baseline.py "$(git rev-parse --short HEAD)" \
            run-1.json run-2.json run-3.json > performance/baseline.json
          {
            echo '## Regenerated bench baseline (median-of-3, ubuntu-latest)'
            echo ''
            echo 'Download the `bench-baseline` artifact and commit it as'
            echo '`performance/baseline.json` (it already carries `bootstrap: false`)'
            echo 'to activate the advisory regression compare in the Bench workflow.'
            echo 'Refresh every minor release.'
            echo ''
            echo '```json'
            cat performance/baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regenerated baseline
        uses: actions/upload-artifact@v5
        with:
          name: bench-baseline
          path: performance/baseline.json
          if-no-files-found: error

name: Session-boot lifetime suite

# Issue #487 PR-3 — proves `ai-memory boot` loads on session start across
# every supported AI / AI-agent recipe, on every supported platform, on a
# recurring schedule. If a recipe in `docs/integrations/<agent>.md`
# regresses, this workflow fails on the next nightly run.

on:
  schedule:
    # 4am UTC daily — runs after the v0.6.x.y dogfood / tag-cut routine
    # so a regression caught here lands in the next morning's review.
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [release/v0.6.3.1, main]
    paths:
      - 'docs/integrations/**'
      - 'src/cli/boot.rs'
      - 'tests/boot_primitive_contract.rs'
      - 'tests/recipe_contract.rs'
      - 'tests/boot_lifecycle.rs'
      - 'scripts/run-session-boot-lifetime-tests.sh'
      - '.github/workflows/session-boot-lifetime.yml'

# #3591 — explicit GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Checkout + cargo/scripts only; no PR comments, SARIF, or checks writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # #3128 — EXPLICIT, not inherited. `Swatinem/rust-cache` is what used to export
  # CARGO_INCREMENTAL=0, and it is now skipped on the self-hosted fleet (see the
  # rust-cache guards below), so the value must be declared here. Incremental
  # state is the most fragile thing in a `target/` tree, and the fleet's
  # `target/` is PERSISTENT and reused across branches — leaving incremental on
  # there would be a worse version of the very inconsistency the guard closes.
  # Declaring it at workflow level also means no job depends on the runner
  # `.env` supplying it.
  CARGO_INCREMENTAL: "0"

jobs:
  lifetime-tests:
    name: Lifetime suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs GitHub-hosted (operator directive 2026-08-22: Linux CI is
        # self-hosted ONLY for the native pg tier, which this suite does not
        # use). macOS stays on the f1 node — the directive is Linux-only, and
        # there is no GitHub-hosted arm64 macOS class this suite is calibrated
        # for. `runner` is a JSON array of runner LABELS so one matrix can carry
        # both shapes; see the `check` job in ci.yml for the same pattern.
        include:
          - os: ubuntu-latest
            runner: '["ubuntu-latest"]'
          - os: macos-fed
            runner: '["self-hosted","macos-fed"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      # #6118 — debuginfo budget, same pair and level as the ci.yml `check`
      # job (#3453/#3461): line tables keep file:line in backtraces at about a
      # third of the size. TEST is stated with DEV because the `test` profile
      # only inherits `dev` while nothing overrides it.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'

      - name: Run lifetime suite
        env:
          AI_MEMORY_NO_CONFIG: '1'
        run: |
          cargo test --test boot_primitive_contract --test recipe_contract --test boot_lifecycle

      # #6118 — the self-hosted workspace `target/` is PERSISTENT (it is the
      # warm cache, #3128), so the ~1000 test executables one debug
      # `cargo test` build links into `target/debug/deps` (~164 GB per runner)
      # used to stay there for good and filled the shared root filesystem.
      # Delete ONLY those executables (extension-less, executable files in
      # `target/debug/deps`); every `.rlib`/`.rmeta`/`.d`, `build/`,
      # `incremental/` and `.fingerprint/` stays, so the cache stays warm and
      # cargo rebuilds just the test crates next run. always() so a failed or
      # cancelled run still reclaims the disk; hosted runners are discarded
      # anyway. LAST step, after every cargo invocation in this job.
      - name: Prune test executables from target/debug/deps (self-hosted, issue 6118)
        if: always() && runner.environment != 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/prune_test_binaries.py ]; then
            echo "::notice::no checkout in this workspace; nothing to prune"
            exit 0
          fi
          python3 -I scripts/ci/prune_test_binaries.py --target-dir target

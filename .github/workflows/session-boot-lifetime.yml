name: Session-boot lifetime suite

# Issue #487 PR-3 — proves `ai-memory boot` loads on session start across
# every supported AI / AI-agent recipe, on every supported platform, on a
# recurring schedule. If a recipe in `docs/integrations/<agent>.md`
# regresses, this workflow fails on the next nightly run.

on:
  schedule:
    # 4am UTC daily — runs after the v0.6.x.y dogfood / tag-cut routine
    # so a regression caught here lands in the next morning's review.
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    branches: [release/v0.6.3.1, main]
    paths:
      - 'docs/integrations/**'
      - 'src/cli/boot.rs'
      - 'tests/boot_primitive_contract.rs'
      - 'tests/recipe_contract.rs'
      - 'tests/boot_lifecycle.rs'
      - 'scripts/run-session-boot-lifetime-tests.sh'
      - '.github/workflows/session-boot-lifetime.yml'

# #3591 — explicit GITHUB_TOKEN scope (CodeQL actions/missing-workflow-permissions).
# Checkout + cargo/scripts only; no PR comments, SARIF, or checks writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # #3128 — EXPLICIT, not inherited. `Swatinem/rust-cache` is what used to export
  # CARGO_INCREMENTAL=0, and it is now skipped on the self-hosted fleet (see the
  # rust-cache guards below), so the value must be declared here. Incremental
  # state is the most fragile thing in a `target/` tree, and the fleet's
  # `target/` is PERSISTENT and reused across branches — leaving incremental on
  # there would be a worse version of the very inconsistency the guard closes.
  # Declaring it at workflow level also means no job depends on the runner
  # `.env` supplying it.
  CARGO_INCREMENTAL: "0"

jobs:
  lifetime-tests:
    name: Lifetime suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux runs GitHub-hosted (operator directive 2026-08-22: Linux CI is
        # self-hosted ONLY for the native pg tier, which this suite does not
        # use). macOS stays on the f1 node — the directive is Linux-only, and
        # there is no GitHub-hosted arm64 macOS class this suite is calibrated
        # for. `runner` is a JSON array of runner LABELS so one matrix can carry
        # both shapes; see the `check` job in ci.yml for the same pattern.
        include:
          - os: ubuntu-latest
            runner: '["ubuntu-latest"]'
          - os: macos-fed
            runner: '["self-hosted","macos-fed"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      # #5657 — a killed/interrupted job leaves an append-only (UF_APPEND) audit.log
      # under .local-runs/.tmp*; actions/checkout's workspace clean then dies with
      # EPERM on every later job on this runner. Clear the flag on the dead scratch
      # tree BEFORE checkout. This is a byte-identical inline copy of
      # scripts/clear-append-only-scratch.py (checkout has not run yet, so the repo
      # script may not be on disk); scripts/test/test_clear_append_only_scratch_5657.py
      # pins the two equal. The live-log flag in src/audit.rs is untouched.
      - name: Clear stale append-only scratch (#5657)
        if: contains(matrix.runner, 'self-hosted')
        shell: python3 {0}
        run: |
          #!/usr/bin/env python3
          # Copyright 2026 AlphaOne LLC
          # SPDX-License-Identifier: Apache-2.0
          """Clear the append-only flag on a DEAD CI scratch tree so it can be deleted (#5657).

          ai-memory marks its audit log append-only (`UF_APPEND` on macOS/BSD,
          `FS_APPEND_FL` on Linux; see `mark_append_only` in `src/audit.rs`). That flag is
          a forensic control on a LIVE log and is never weakened by this script. A test
          process that is killed, or one that never clears the flag, leaves a flagged
          `audit.log` inside the self-hosted runner workspace (`.local-runs/.tmp*/audit/`).
          A flagged file cannot be unlinked even by its owner, so the NEXT job's
          `actions/checkout` workspace clean dies with EPERM and the runner is poisoned.

          This script walks `<root>/.local-runs` (a scratch tree that is already dead when
          the next job starts) and clears ONLY the append-only bit, in place, without
          following symlinks. It makes the cleanup idempotent: a clean tree is a no-op.

          The workflow runs this BEFORE `actions/checkout`, when the repository may not be
          on disk yet, so the workflow step carries a byte-identical inline copy of this
          file; `scripts/test/test_clear_append_only_scratch_5657.py` pins the two equal.

          Exit codes: 0 = nothing flagged or every flag cleared; 1 = a flag remains that
          could not be cleared (named on stderr, as a workflow `::error::`); 2 = bad usage.
          Python 3.9+, standard library only.
          """
          import argparse
          import os
          import stat
          import struct
          import sys

          SCRATCH_DIR = ".local-runs"
          # Linux ext*/xfs/btrfs inode flag; `chflags uappnd` is the macOS/BSD equivalent.
          FS_APPEND_FL = 0x0000_0020


          def _linux_ioctl_numbers():
              """FS_IOC_GETFLAGS / FS_IOC_SETFLAGS = _IOR/_IOW('f', 1|2, long)."""
              size = struct.calcsize("l")

              def ioc(direction, nr):
                  return (direction << 30) | (size << 16) | (ord("f") << 8) | nr

              return ioc(2, 1), ioc(1, 2)  # _IOC_READ=2, _IOC_WRITE=1


          def _clear_bsd(path, st):
              """macOS/BSD: drop UF_APPEND with lchflags (never follows a symlink)."""
              flag = getattr(stat, "UF_APPEND", 0)
              if not flag or not st.st_flags & flag:
                  return False
              os.lchflags(path, st.st_flags & ~flag)
              return True


          def _clear_linux(path, st):
              """Linux: FS_IOC_GETFLAGS then FS_IOC_SETFLAGS without FS_APPEND_FL."""
              import fcntl

              if not (stat.S_ISREG(st.st_mode) or stat.S_ISDIR(st.st_mode)):
                  return False
              get_req, set_req = _linux_ioctl_numbers()
              fd = os.open(path, os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW)
              try:
                  buf = bytearray(struct.pack("l", 0))
                  fcntl.ioctl(fd, get_req, buf, True)
                  (flags,) = struct.unpack("l", bytes(buf))
                  if not flags & FS_APPEND_FL:
                      return False
                  fcntl.ioctl(fd, set_req, struct.pack("l", flags & ~FS_APPEND_FL))
                  return True
              finally:
                  os.close(fd)


          def clear_tree(top):
              """Clear append-only under `top`. Returns (cleared, failures)."""
              cleared = []
              failures = []
              clear = _clear_bsd if hasattr(os, "lchflags") else _clear_linux
              candidates = [top]
              for dirpath, dirnames, filenames in os.walk(top, followlinks=False):
                  candidates.extend(os.path.join(dirpath, name) for name in dirnames + filenames)
              for path in candidates:
                  try:
                      st = os.lstat(path)
                      if clear(path, st):
                          cleared.append(path)
                  except FileNotFoundError:
                      continue
                  except OSError as err:  # EPERM without CAP_LINUX_IMMUTABLE, ENOTTY, ...
                      if getattr(err, "errno", None) in (25, 95):  # ENOTTY / EOPNOTSUPP: fs has no flag
                          continue
                      failures.append((path, str(err)))
              return cleared, failures


          def main(argv=None):
              parser = argparse.ArgumentParser(description=__doc__.split("\n", 1)[0])
              parser.add_argument("--root", default=os.environ.get("GITHUB_WORKSPACE", os.getcwd()))
              args = parser.parse_args(argv)
              top = os.path.join(args.root, SCRATCH_DIR)
              if not os.path.isdir(top) or os.path.islink(top):
                  print("clear-append-only-scratch: no %s under %s; nothing to do" % (SCRATCH_DIR, args.root))
                  return 0
              cleared, failures = clear_tree(top)
              for path in cleared:
                  print("clear-append-only-scratch: cleared append-only on %s" % path)
              for path, why in failures:
                  print("::error::clear-append-only-scratch: could not clear %s: %s" % (path, why), file=sys.stderr)
              print("clear-append-only-scratch: %d cleared, %d failed" % (len(cleared), len(failures)))
              return 1 if failures else 0


          if __name__ == "__main__":
              sys.exit(main())
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # HOSTED ONLY (#3128). On the self-hosted fleet the workspace `target/` is
      # PERSISTENT and already IS the warm cache, so this action has nothing to
      # add and two ways to do harm: its restore extracts an archive saved by a
      # DIFFERENT runner instance OVER the live tree, and its post-step prunes
      # that tree. Mixed-provenance artifacts are how PR #3116's self-hosted
      # build died in 18s with `could not parse/generate dep info at:
      # …/target/debug/deps/getrandom-*.d — No such file or directory` (disk was
      # fine). `~/.cargo/{registry,git}` persist natively in $HOME on the fleet,
      # so nothing is lost. CARGO_INCREMENTAL=0 — which this action used to
      # export — is now declared in the workflow `env:` block above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.environment == 'github-hosted'

      - name: Run lifetime suite
        env:
          AI_MEMORY_NO_CONFIG: '1'
        run: |
          cargo test --test boot_primitive_contract --test recipe_contract --test boot_lifecycle

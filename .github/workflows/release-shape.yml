# #4480 - release-shaped proof: build the binary EXACTLY the way release.yml
# does (`--features "$(scripts/release-features.sh)"`) and prove the shipped
# PostgreSQL tier is real, before a tag cut finds out it is not.
#
# WHY. release.yml built `--features sal` only, so the advertised PostgreSQL +
# AGE + pgvector tier was absent from every shipped artifact and nothing
# noticed (the #2676 / #2728 / #3996 class). The release feature set now lives
# in ONE file (scripts/release-features.sh); this job builds from it, asserts
# the self-report, checks no OpenSSL/libpq is pulled in, and drives the binary
# against a TLS PostgreSQL service it starts itself (a pgvector image, a
# throwaway CA, hostssl-only pg_hba, sslmode=verify-full on 127.0.0.1). The
# image has pgvector but NO Apache AGE, so the proof covers the pgvector / CTE
# path, not the AGE graph projection.
#
# NEVER VACUOUS. A missing docker, a server that does not come up, a URL that
# does not verify, or a round trip that loses the memory FAILS the job; there
# is no skip path. What only the release matrix itself proves: the macOS and
# aarch64-linux cross builds (this job builds the host target, x86_64 linux).
#
# NOT ADVISORY (#4720). The workflow landed `continue-on-error: true` by GOD's
# ruling on #4480 (untried, so a failure must not block until it had run green
# once). It has since run green on every pull_request event it fired for
# (87 runs by 2026-10-09; the latest 25 all `success`, e.g. run 37944916557 on
# chain/promo6-ssh), so the key is gone: a failing proof fails the run, and
# scripts/check_release_features.py (SHAPE_ADVISORY = False) refuses the key.
# The workflow is in COVERED_WORKFLOWS of scripts/check-required-contexts.sh;
# its job is declared in the dated not-required ledger
# (scripts/qc-allowlists/required-contexts-not-required.txt) until the #3554
# lockstep promotes the context "Release-shaped build + PG TLS proof" into
# live branch protection. NOTE for that promotion: rule (c) of the
# required-contexts gate refuses a path-filtered carrier, so the `paths:`
# filter below must go in the same change that requires the context. The
# feature declaration itself is enforced separately and BLOCKING by
# scripts/check_release_features.py (c8-precheck), and gates release.yml and
# the Dockerfile.

name: Release-shaped build + PostgreSQL TLS proof (#4480)

on:
  pull_request:
    branches: ["release/**", "rehearsal/**", "chain/**", "main"]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-shape.yml"
      - "scripts/release-features.sh"
      - "scripts/check_release_features.py"
      - "scripts/release-shape-pg-proof.sh"
      - "scripts/assert-compiled-features.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "migrations/**"
  push:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-shape-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release-shape:
    name: "Release-shaped build + PG TLS proof"
    runs-on: ubuntu-latest
    # No `continue-on-error`: a failing proof fails the run (#4720).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.0 (matches rust-toolchain.toml pin)
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Release feature declaration guard
        run: python3 scripts/check_release_features.py

      - name: Build release binary (exactly as release.yml)
        shell: bash
        run: |
          set -euo pipefail
          FEATURES="$(bash scripts/release-features.sh)"
          test -n "$FEATURES"
          cargo build --locked --release --features "$FEATURES"

      - name: No OpenSSL / libpq / native-tls in the shipped dependency graph
        shell: bash
        run: |
          set -euo pipefail
          FEATURES="$(bash scripts/release-features.sh)"
          test -n "$FEATURES"
          tree="$(cargo tree --locked -e normal --target all --features "$FEATURES")"
          if printf '%s\n' "$tree" | grep -E '(^|[^a-z-])(openssl-sys|native-tls|openssl |libpq)'; then
            echo "::error::the release feature set pulls a native TLS / libpq dependency (#4480 requires pure-Rust rustls)"
            exit 1
          fi
          echo "no openssl-sys / native-tls / libpq in the release dependency graph"

      - name: Start a TLS PostgreSQL service (throwaway CA, hostssl-only)
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/pgtls"
          mkdir -p "$d"
          cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=release-shape-ca" -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=127.0.0.1" -keyout server.key -out server.csr
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\n' > san.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 1 -extfile san.ext -out server.crt
          # hostssl ONLY on TCP: a plaintext login cannot succeed, so a green
          # round trip proves the session was TLS.
          printf 'local all all trust\nhostssl all all all scram-sha-256\n' > pg_hba.conf
          sudo chown 999:999 server.key server.crt pg_hba.conf
          sudo chmod 600 server.key
          pw="$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "PGTLS_DIR=$d" >> "$GITHUB_ENV"
          echo "PGTLS_PW=$pw" >> "$GITHUB_ENV"
          # Image: pgvector/pgvector 0.8.6-pg18 (canonical PostgreSQL 18.6 + pgvector 0.8.6
          # stack of the repo SSOT), pinned by digest; no Apache AGE in this image.
          docker run -d --name release-shape-pg -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD="$pw" -e POSTGRES_DB=proof -v "$d:/certs:ro" pgvector/pgvector@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key -c hba_file=/certs/pg_hba.conf
          for _ in $(seq 1 60); do
            if docker exec release-shape-pg pg_isready -U postgres -d proof >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "${ready:-0}" != 1 ]; then
            docker logs release-shape-pg || true
            echo "::error::the TLS PostgreSQL service did not become ready (the proof must not pass vacuously)"
            exit 1
          fi
          docker exec release-shape-pg psql -U postgres -d proof -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Prove the shipped binary reports sal-postgres and uses the tier over verify-full
        shell: bash
        run: |
          set -euo pipefail
          url="postgres://postgres:${PGTLS_PW}@127.0.0.1:55432/proof?sslmode=verify-full&sslrootcert=${PGTLS_DIR}/ca.crt"
          bash scripts/release-shape-pg-proof.sh target/release/ai-memory "$url"

      - name: Stop the PostgreSQL service
        if: always()
        shell: bash
        run: docker rm -f release-shape-pg >/dev/null 2>&1 || true

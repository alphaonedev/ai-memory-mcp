name: Docs-only short-circuit (#9683)
description: >-
  Decides once per job whether the whole pull request (base sha to the
  checked-out merge ref) changes only documentation no test reads, with the
  allowlist coverage uses (rules.json cargo_skip docs_globs minus every
  never-skip and test-read glob; scripts/ci/impact/docs_only_gate.py). On
  pull_request one step copies the BASE commit's gate files (decider, rules
  and helpers) into RUNNER_TEMP with fixed git show commands at the event's
  base sha, then runs that base copy with python3 -I, so the Python that
  judges the diff and writes docs_only=true comes from the base commit. This
  action file and the workflow YAML that calls it still come from the PR
  head; a PR that edits either is a CI-tree change by the base rules, which
  is a full run. Output docs_only is "true" only on the base decider's
  docs-only exit; a push, merge_group or other event, a missing or malformed
  base sha or one that is not the event's, a failed fetch, a base commit
  without a gate file, RUNNER_TEMP unset, an empty, unreadable or over-bound
  diff, any other exit code and any error leave it "false" or empty, which
  runs the job in full. A doubt before the base copy runs prints a notice
  and leaves the output empty; a failure of the base copy itself fails the
  job.
  The caller guards every later step with steps.<id>.outputs.docs_only !=
  'true', so the job and its required context still report.
inputs:
  base-sha:
    description: github.event.pull_request.base.sha (empty outside a pull request).
    required: false
    default: ""
  event-name:
    description: github.event_name.
    required: true
  base-ref:
    description: github.base_ref (main, develop and release/* bases run in full).
    required: false
    default: ""
outputs:
  docs_only:
    description: '"true" when the whole-PR diff is docs only; anything else runs the job in full.'
    value: ${{ steps.gate.outputs.docs_only }}
runs:
  using: composite
  steps:
    - name: Decide docs-only from the whole-PR diff (the base commit's gate)
      id: gate
      if: inputs.event-name == 'pull_request'
      shell: bash
      env:
        DOCS_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        DOCS_GATE_INPUT_BASE_SHA: ${{ inputs.base-sha }}
        DOCS_GATE_EVENT_NAME: ${{ inputs.event-name }}
        DOCS_GATE_BASE_REF: ${{ inputs.base-ref }}
      run: |
        [[ "$DOCS_GATE_BASE_SHA" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ && "$DOCS_GATE_INPUT_BASE_SHA" == "$DOCS_GATE_BASE_SHA" ]] || { echo "::notice::docs-only gate (#9683): the base sha is missing, malformed or not the event's; docs_only stays empty and the job runs in full"; exit 0; }
        [[ -d "$RUNNER_TEMP" ]] || { echo "::notice::docs-only gate (#9683): RUNNER_TEMP is unset or not a directory; docs_only stays empty and the job runs in full"; exit 0; }
        git cat-file -e "${DOCS_GATE_BASE_SHA}^{commit}" || git fetch --no-tags --no-recurse-submodules --depth=1 origin "$DOCS_GATE_BASE_SHA" || { echo "::notice::docs-only gate (#9683): the base commit could not be fetched; docs_only stays empty and the job runs in full"; exit 0; }
        rm -rf "$RUNNER_TEMP/docs-gate-base" && mkdir -p "$RUNNER_TEMP/docs-gate-base/impact" || { echo "::notice::docs-only gate (#9683): the base copy directory could not be made; docs_only stays empty and the job runs in full"; exit 0; }
        git show "${DOCS_GATE_BASE_SHA:?}:scripts/ci/impact/__init__.py" > "$RUNNER_TEMP/docs-gate-base/impact/__init__.py" || { echo "::notice::docs-only gate (#9683): the base commit has no gate files; docs_only stays empty and the job runs in full"; exit 0; }
        git show "${DOCS_GATE_BASE_SHA:?}:scripts/ci/impact/common.py" > "$RUNNER_TEMP/docs-gate-base/impact/common.py" || { echo "::notice::docs-only gate (#9683): the base commit has no gate files; docs_only stays empty and the job runs in full"; exit 0; }
        git show "${DOCS_GATE_BASE_SHA:?}:scripts/ci/impact/cargo_skip.py" > "$RUNNER_TEMP/docs-gate-base/impact/cargo_skip.py" || { echo "::notice::docs-only gate (#9683): the base commit has no gate files; docs_only stays empty and the job runs in full"; exit 0; }
        git show "${DOCS_GATE_BASE_SHA:?}:scripts/ci/impact/docs_only_gate.py" > "$RUNNER_TEMP/docs-gate-base/impact/docs_only_gate.py" || { echo "::notice::docs-only gate (#9683): the base commit has no gate files; docs_only stays empty and the job runs in full"; exit 0; }
        git show "${DOCS_GATE_BASE_SHA:?}:scripts/ci/impact/rules.json" > "$RUNNER_TEMP/docs-gate-base/impact/rules.json" || { echo "::notice::docs-only gate (#9683): the base commit has no gate files; docs_only stays empty and the job runs in full"; exit 0; }
        python3 -I "$RUNNER_TEMP/docs-gate-base/impact/docs_only_gate.py" step

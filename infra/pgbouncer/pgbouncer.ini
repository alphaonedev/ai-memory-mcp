# ─────────────────────────────────────────────────────────────────────────
# ai-memory — PgBouncer per-module pooler template (v0.8.0 Pillar-4 4.B, #1736)
#
# Materializes the config-only guidance in docs/enterprise-deployment.md §5.6
# into a copy-deployable pgbouncer.ini. PgBouncer is a config-only external
# daemon — there is NO ai-memory application code in this path. It is a
# connection-multiplexing middleman that removes the backend connection-count
# ceiling for transient/bursty session fan-in; it does NOT add AGE write
# concurrency (that is bounded by the postgres+AGE backbone, see 4.D).
#
# Wiring: point ai-memory's Postgres URL at this pooler's port (6432) instead
# of the postgres port (5432):
#   ai-memory serve --store-url postgres://ai_memory@pgbouncer:6432/ai_memory
#
# Validate with ./smoke-test.sh (needs docker). See README.md.
# ─────────────────────────────────────────────────────────────────────────

[databases]
# One entry per module-backbone database. host/port point at the REAL
# postgres+AGE server; clients connect to PgBouncer's listen_port (6432).
ai_memory = host=postgres port=5432 dbname=ai_memory

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# ── HARD REQUIREMENT: transaction pooling. ───────────────────────────────
# `session` mode forfeits the fan-in benefit; `statement` mode is FORBIDDEN.
# The AGE cypher path issues `LOAD 'age'` + `SET LOCAL search_path` + the
# `cypher()` call as multiple statements that MUST run on the SAME backend
# within one transaction. statement-mode pooling can route each statement to
# a different backend — the cypher() call then lands on a backend where
# search_path/LOAD never ran, breaking graph paths and risking
# partially-applied multi-statement graph writes. transaction mode pins the
# whole transaction to one backend, which is exactly what AGE needs.
pool_mode = transaction

# ── Prepared-statement compatibility (Fix #4). ───────────────────────────
# Requires PgBouncer >= 1.21. Keeps sqlx's named prepared statements (the
# Fix #4 plan-caching hot path) working under transaction-mode multiplexing.
# Omitting this (or PgBouncer < 1.21) REGRESSES Fix #4 — every query
# re-plans. Size >= the largest per-connection prepared-statement working set.
max_prepared_statements = 256

# ── Sizing. ──────────────────────────────────────────────────────────────
# `default_pool_size` is the server-side backend pool per (db,user) — keep it
# aligned with the daemon-side sqlx ceiling AI_MEMORY_PG_POOL_MAX
# (DEFAULT_MAX_CONNECTIONS = 16) so the two pools (§5.6.5) compose without one
# starving the other. `max_client_conn` is the fan-in ceiling PgBouncer adds
# in front of that backend pool — raise it for the bursty session count a
# module fronts; it is bounded by host RAM + the SQLite hot-tier footprint per
# agent (§5.6 / 4.D), NOT an unmeasured concurrent-agent number.
default_pool_size = 16
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 3
max_client_conn = 1000

# Recycle idle server connections so a module that quiesces returns backends.
server_idle_timeout = 600

# Operability.
ignore_startup_parameters = extra_float_digits
admin_users = ai_memory
log_connections = 1
log_disconnections = 1

# ─────────────────────────────────────────────────────────────────────────
# ai-memory — PgBouncer per-module pooler template (v0.8.0 Pillar-4 4.B, #1736)
#
# Materializes the config-only guidance in docs/enterprise-deployment.md §5.6
# into a copy-deployable pgbouncer.ini. PgBouncer is a config-only external
# daemon — there is NO ai-memory application code in this path. In the
# supported `session` pool mode it is a connection pass-through (one server
# connection per client connection) that adds client admission queueing and
# keeps the daemon off the Postgres port; it does NOT multiplex many clients
# onto few server connections, and it does NOT add AGE write concurrency
# (that is bounded by the postgres+AGE backbone, see 4.D).
#
# Wiring: point ai-memory's Postgres URL at this pooler's port (6432) instead
# of the postgres port (5432):
#   ai-memory serve --store-url postgres://ai_memory@pgbouncer:6432/ai_memory
#
# Validate with ./smoke-test.sh (needs docker). See README.md.
# ─────────────────────────────────────────────────────────────────────────

[databases]
# One entry per module-backbone database. host/port point at the REAL
# postgres+AGE server; clients connect to PgBouncer's listen_port (6432).
ai_memory = host=postgres port=5432 dbname=ai_memory

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# ── TLS on the pooler-to-Postgres hop (#4729, guide 5.6.3) — REQUIRED in ──
# production. PgBouncer's default for this hop is server_tls_sslmode = prefer:
# opportunistic, unverified, and silently plaintext when the server offers no
# TLS. The ai-memory adapter refuses a store URL below sslmode=verify-full
# (#3705), so leaving the default here would end that guarantee at the pooler.
# Uncomment and point server_tls_ca_file at the CA that signed the Postgres
# server certificate. The smoke stack (docker-compose.yml) ships no
# certificates, which is the only reason these lines are commented out.
# server_tls_sslmode = verify-full
# server_tls_ca_file = /etc/pgbouncer/tls/ca.crt

# ── TLS on the daemon-to-pooler hop (#4730, guide 5.6.3) — REQUIRED in ──────
# production. client_tls_sslmode = verify-full makes the pooler require and
# verify a client certificate from every daemon (mTLS, guide section 14); the
# daemon presents it via sslcert= / sslkey= in its store URL. `require` is
# acceptable only where client certificates cannot be issued, and then the
# role password is the only authentication on this hop. Commented out for the
# same reason as the server block above: the smoke stack ships no certificates.
# client_tls_sslmode = verify-full
# client_tls_ca_file = /etc/pgbouncer/tls/ca.crt
# client_tls_key_file = /etc/pgbouncer/tls/server.key
# client_tls_cert_file = /etc/pgbouncer/tls/server.crt

# ── pool_mode = session (#4667). Do NOT set `transaction` or `statement`. ──
# The Postgres adapter keeps state on the server session: the migration
# advisory lock (pg_try_advisory_lock on MIGRATION_ADVISORY_LOCK_KEY,
# src/store/postgres.rs), the connect-time search_path
# (set_config('search_path', .., false) in the after_connect hook) and the
# connect-time statement_timeout / lock_timeout (plain SET in the same hook).
# Under `transaction` mode a second client can share the backend and see all
# three (the probe recorded on PR #4710 exits 1: the second client was granted
# the migration lock and saw the first client's search_path and timeout);
# under `session` mode the probe exits 0. `statement` mode is not supported
# either: it refuses the multi-statement transactions the AGE cypher path
# issues (`LOAD 'age'` + `SET LOCAL search_path` + `cypher()` in one
# transaction). Transaction mode returns only when the adapter work in #4679
# lands and the probe is green on a transaction-mode pooler. Keep PgBouncer's
# default `server_reset_query = DISCARD ALL`: in `session` mode a server
# connection is reused by the next client only after that reset runs.
# docs/enterprise-deployment.md §5.6 carries the evidence and the sizing rule.
pool_mode = session

# ── Prepared statements. ─────────────────────────────────────────────────
# Requires PgBouncer >= 1.21 (the proof in #4667 ran PgBouncer 1.23.1 with this
# line present). It is kept as shipped; in `session` mode every client owns its
# server connection, so the daemon's named prepared statements stay on one
# backend. Size >= the largest per-connection prepared-statement working set.
max_prepared_statements = 256

# ── Sizing. ──────────────────────────────────────────────────────────────
# `default_pool_size` is the server-side backend pool per (db,user). In
# `session` mode each client connection holds one server connection for its
# whole life, so it must cover the sum of AI_MEMORY_PG_POOL_MAX of every daemon
# behind this pooler: one daemon at the compiled default
# (DEFAULT_MAX_CONNECTIONS = 16, src/store/mod.rs) needs 16; with N daemons set
# N x 16 (or lower AI_MEMORY_PG_POOL_MAX). The Postgres-side bound counts the
# reserve, because PgBouncer opens up to `reserve_pool_size` server connections
# above `default_pool_size` once clients queue past `reserve_pool_timeout`
# (#4749):
#   sum over pools of (default_pool_size + reserve_pool_size)
#       <= max_connections - superuser_reserved_connections
# (docs/enterprise-deployment.md §5.6.5). Budget the reserve in that sum, or set
# reserve_pool_size = 0 where default_pool_size already equals the clients'
# sum. `max_client_conn` is client admission only; it must be >= the same sum
# of AI_MEMORY_PG_POOL_MAX, and it is bounded by host RAM + the SQLite hot-tier
# footprint per agent (§5.6 / 4.D), NOT an unmeasured concurrent-agent number.
default_pool_size = 16
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 3
max_client_conn = 1000

# Recycle idle server connections so a module that quiesces returns backends.
server_idle_timeout = 600

# Operability.
ignore_startup_parameters = extra_float_digits
admin_users = ai_memory
log_connections = 1
log_disconnections = 1

# ─────────────────────────────────────────────────────────────────────────
# ai-memory — PgBouncer per-module pooler template (v0.8.0 Pillar-4 4.B, #1736)
#
# Materializes the config-only guidance in docs/enterprise-deployment.md §5.6
# into a copy-deployable pgbouncer.ini. PgBouncer is a config-only external
# daemon — there is NO ai-memory application code in this path. In the
# supported `session` pool mode it is a connection pass-through (one server
# connection per client connection) that adds client admission queueing and
# keeps the daemon off the Postgres port; it does NOT multiplex many clients
# onto few server connections, and it does NOT add AGE write concurrency
# (that is bounded by the postgres+AGE backbone, see 4.D).
#
# Wiring: point ai-memory's Postgres URL at this pooler's port (6432) instead
# of the postgres port (5432):
#   ai-memory serve --store-url postgres://ai_memory@pgbouncer:6432/ai_memory
#
# Validate with ./smoke-test.sh (needs docker). See README.md.
# ─────────────────────────────────────────────────────────────────────────

[databases]
# One entry per module-backbone database. host/port point at the REAL
# postgres+AGE server; clients connect to PgBouncer's listen_port (6432).
ai_memory = host=postgres port=5432 dbname=ai_memory

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# ── pool_mode = session (#4667). Do NOT set `transaction` or `statement`. ──
# The Postgres adapter keeps state on the server session: the migration
# advisory lock (pg_try_advisory_lock, src/store/postgres.rs:2154), the
# connect-time search_path (set_config(.., false), :2765) and the connect-time
# statement_timeout / lock_timeout (:2776). Under `transaction` mode a second
# client can share the backend and see all three
# (scripts/probe-pgbouncer-pool-mode.py exits 1: the second client was granted
# the migration lock and saw the first client's search_path and timeout);
# under `session` mode the probe exits 0. `statement` mode is not supported
# either: it cannot hold the multi-statement transactions the adapter issues.
# Transaction mode returns only when the adapter work in #4679 lands and the
# probe is green on a transaction-mode pooler; scripts/check-pgbouncer-pool-mode-claims.py
# pins the documented mode to this line.
pool_mode = session

# ── Prepared statements. ─────────────────────────────────────────────────
# Requires PgBouncer >= 1.21 (the proof in #4667 ran PgBouncer 1.23.1 with this
# line present). It is kept as shipped; in `session` mode every client owns its
# server connection, so the daemon's prepared statements stay on one backend.
max_prepared_statements = 256

# ── Sizing. ──────────────────────────────────────────────────────────────
# In `session` mode each client connection holds one server connection for its
# whole life, so `default_pool_size` must cover the Σ of AI_MEMORY_PG_POOL_MAX
# of every daemon behind this pooler. One daemon at the compiled default
# (DEFAULT_MAX_CONNECTIONS = 16, src/store/mod.rs:111) needs 16; with N daemons
# set N x 16 (or lower AI_MEMORY_PG_POOL_MAX). A client over the pool size waits
# in PgBouncer's queue. The Postgres-side rule is
#   Σ(AI_MEMORY_PG_POOL_MAX) <= max_connections - superuser_reserved_connections
# (docs/enterprise-deployment.md §5.6.5). `max_client_conn` is client admission
# only; it must be >= the same Σ.
default_pool_size = 16
min_pool_size = 2
reserve_pool_size = 4
reserve_pool_timeout = 3
max_client_conn = 1000

# Recycle idle server connections so a module that quiesces returns backends.
server_idle_timeout = 600

# Operability.
ignore_startup_parameters = extra_float_digits
admin_users = ai_memory
log_connections = 1
log_disconnections = 1

name: ai-memory-plan-c
# Issue #878 — canonical Plan-C fleet recipe.
#
# Long-term fix for the peer-mesh URL collision bug: each container
# resolves its peers via the user-defined `ic-mesh` bridge network's
# embedded DNS, so peer URLs look like `http://ic-bob:19077` rather
# than `http://host.docker.internal:<port>`. The bridge isolates the
# fleet's traffic from host-port collisions (SSH forwards, stray
# python servers, stale docker proxies after `colima delete`, etc.)
# that previously silent-shadowed peer reach.
#
# The entrypoint's #878 peer-reach preflight (entrypoint.plan-c.sh)
# stays on as a safety net — when bridge DNS resolves to a peer that
# is still booting, the preflight aborts with EX_CONFIG (78) and
# `restart: on-failure` brings the container back when the peer is
# up. `depends_on` orders the initial boot.
#
# Operator quick-start (assumes you have a Postgres reachable at
# AI_MEMORY_STORE_URL and Ollama at OLLAMA_BASE_URL — both required):
#
#   # #3705 — the DSN MUST pin sslmode=verify-full&sslrootcert=<ca> (a
#   # plaintext DSN is refused at the connect funnel; the CA path is as
#   # seen INSIDE the container — mount it or bake it into the image)
#   export AI_MEMORY_STORE_URL='postgres://...?sslmode=verify-full&sslrootcert=/etc/ai-memory/pg-ca.crt'
#   export OLLAMA_BASE_URL=http://host.docker.internal:11434
#   docker compose -f infra/plan-c/docker-compose.yml up -d --build
#
# #3705 — every hop is TLS: the one-shot `ic-tls-provisioner` service mints
# a fleet CA + per-daemon listener/client pairs into the `ic-tls` volume
# (infra/lan-parity-test/provision-tls.sh, shared with the LAN-parity
# stack); peers are https://; the former AI_MEMORY_FED_ALLOW_PLAINTEXT_PEERS
# acknowledgement is a REMOVED downgrade path (a truthy value refuses boot).
#
# Operator recreate (after binary rebuild or schema migration):
#
#   docker compose -f infra/plan-c/docker-compose.yml down -v
#   docker compose -f infra/plan-c/docker-compose.yml up -d --build
#
# Healthcheck: each container probes its own `/api/v1/capabilities`
# every 10s; once all three are healthy the mesh is ready for write
# traffic.

services:
  ic-alice:
    build:
      context: ../..
      dockerfile: Dockerfile.plan-c
      args:
        CARGO_FEATURES: sal-postgres
    image: ai-memory-plan-c:bridge-net
    container_name: ic-alice
    hostname: ic-alice
    restart: on-failure
    depends_on:
      ic-tls-provisioner:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_MEMORY_AGENT_ID: "ai:ic-alice@plan-c"
      AI_MEMORY_TIER: autonomous
      AI_MEMORY_LISTEN_HOST: "0.0.0.0"
      AI_MEMORY_LISTEN_PORT: "19077"
      AI_MEMORY_TLS_DIR: "/tls/ic-alice"
      AI_MEMORY_STORE_URL: "${AI_MEMORY_STORE_URL}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      AI_MEMORY_LLM_MODEL: "gemma4:e4b"
      AI_MEMORY_EMBED_MODEL: "nomic-embed-text"
      # Container-DNS peer URLs — resolved on the ic-mesh bridge
      # without touching the host network. This is the load-bearing
      # change for #878.
      AI_MEMORY_PEER_URLS: "https://ic-bob:19077,https://ic-carol:19077"
      # #3705 — https:// peers; the listener pair + quorum client pair +
      # fleet CA under AI_MEMORY_TLS_DIR are turned into --tls-cert/--tls-key
      # and --quorum-client-cert/-key/--quorum-ca-cert by entrypoint.plan-c.sh.
      AI_MEMORY_API_KEY: "${AI_MEMORY_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-ai_memory=info}"
    volumes:
      - ic-alice-keys:/root/.config/ai-memory/keys
      - ic-alice-audit:/var/log/ai-memory/audit
      - ic-tls:/tls:ro
    ports:
      - "19077:19077"
    networks:
      - ic-mesh
    healthcheck:
      # #3705 — TLS-only listener; probe by certificate hostname against the CA.
      test: ["CMD-SHELL", "curl -f -sS --max-time 3 --cacert /tls/ca.pem https://$$(hostname):19077/api/v1/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ic-bob:
    image: ai-memory-plan-c:bridge-net
    container_name: ic-bob
    hostname: ic-bob
    restart: on-failure
    depends_on:
      ic-tls-provisioner:
        condition: service_completed_successfully
      ic-alice:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_MEMORY_AGENT_ID: "ai:ic-bob@plan-c"
      AI_MEMORY_TIER: autonomous
      AI_MEMORY_LISTEN_HOST: "0.0.0.0"
      AI_MEMORY_LISTEN_PORT: "19077"
      AI_MEMORY_TLS_DIR: "/tls/ic-bob"
      AI_MEMORY_STORE_URL: "${AI_MEMORY_STORE_URL}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      AI_MEMORY_LLM_MODEL: "gemma4:e4b"
      AI_MEMORY_EMBED_MODEL: "nomic-embed-text"
      AI_MEMORY_PEER_URLS: "https://ic-alice:19077,https://ic-carol:19077"
      # #3705 — https:// peers; the listener pair + quorum client pair +
      # fleet CA under AI_MEMORY_TLS_DIR are turned into --tls-cert/--tls-key
      # and --quorum-client-cert/-key/--quorum-ca-cert by entrypoint.plan-c.sh.
      AI_MEMORY_API_KEY: "${AI_MEMORY_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-ai_memory=info}"
    volumes:
      - ic-bob-keys:/root/.config/ai-memory/keys
      - ic-bob-audit:/var/log/ai-memory/audit
      - ic-tls:/tls:ro
    ports:
      - "19078:19077"
    networks:
      - ic-mesh
    healthcheck:
      # #3705 — TLS-only listener; probe by certificate hostname against the CA.
      test: ["CMD-SHELL", "curl -f -sS --max-time 3 --cacert /tls/ca.pem https://$$(hostname):19077/api/v1/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ic-carol:
    image: ai-memory-plan-c:bridge-net
    container_name: ic-carol
    hostname: ic-carol
    restart: on-failure
    depends_on:
      ic-tls-provisioner:
        condition: service_completed_successfully
      ic-alice:
        condition: service_started
      ic-bob:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_MEMORY_AGENT_ID: "ai:ic-carol@plan-c"
      AI_MEMORY_TIER: autonomous
      AI_MEMORY_LISTEN_HOST: "0.0.0.0"
      AI_MEMORY_LISTEN_PORT: "19077"
      AI_MEMORY_TLS_DIR: "/tls/ic-carol"
      AI_MEMORY_STORE_URL: "${AI_MEMORY_STORE_URL}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      AI_MEMORY_LLM_MODEL: "gemma4:e4b"
      AI_MEMORY_EMBED_MODEL: "nomic-embed-text"
      AI_MEMORY_PEER_URLS: "https://ic-alice:19077,https://ic-bob:19077"
      # #3705 — https:// peers; the listener pair + quorum client pair +
      # fleet CA under AI_MEMORY_TLS_DIR are turned into --tls-cert/--tls-key
      # and --quorum-client-cert/-key/--quorum-ca-cert by entrypoint.plan-c.sh.
      AI_MEMORY_API_KEY: "${AI_MEMORY_API_KEY:-}"
      RUST_LOG: "${RUST_LOG:-ai_memory=info}"
    volumes:
      - ic-carol-keys:/root/.config/ai-memory/keys
      - ic-carol-audit:/var/log/ai-memory/audit
      - ic-tls:/tls:ro
    ports:
      - "19079:19077"
    networks:
      - ic-mesh
    healthcheck:
      # #3705 — TLS-only listener; probe by certificate hostname against the CA.
      test: ["CMD-SHELL", "curl -f -sS --max-time 3 --cacert /tls/ca.pem https://$$(hostname):19077/api/v1/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ic-tls-provisioner:
    # #3705 — one-shot fleet-CA + certificate provisioner shared with the
    # LAN-parity stack (see infra/lan-parity-test/provision-tls.sh for the
    # layout). Runs in the pg-age image (carries `openssl`) before any
    # daemon boots; each daemon mounts the `ic-tls` volume read-only at
    # /tls and points AI_MEMORY_TLS_DIR at its own subdirectory.
    build:
      context: ../lan-parity-test
      dockerfile: Dockerfile.pg-age-vector
    image: ai-memory-pg-age-vector:latest
    container_name: ai-memory-plan-c-tls-provisioner
    entrypoint: ["/bin/sh", "/usr/local/lib/ai-memory/provision-tls.sh"]
    user: "0:0"
    environment:
      TLS_OUT_DIR: "/tls"
      TLS_DAEMONS: "ic-alice ic-bob ic-carol"
    volumes:
      - ../lan-parity-test/provision-tls.sh:/usr/local/lib/ai-memory/provision-tls.sh:ro
      - ic-tls:/tls
    networks:
      - ic-mesh
    restart: "no"

networks:
  # Issue #878 — user-defined bridge with explicit subnet so docker's
  # embedded DNS can resolve `ic-alice` / `ic-bob` / `ic-carol` to the
  # container's eth0 address on the bridge. The subnet is private and
  # local to docker; it does NOT collide with host networks even when
  # the host has its own 172.x.x.x routes (docker assigns the next
  # free /24 from its pool by default; pinning it here makes
  # `iptables` / `ip route` diagnostics deterministic across restarts).
  ic-mesh:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.78.0/24

volumes:
  # #3705 — fleet CA + per-daemon certificates (provision-tls.sh).
  ic-tls:
  ic-alice-keys:
  ic-alice-audit:
  ic-bob-keys:
  ic-bob-audit:
  ic-carol-keys:
  ic-carol-audit:

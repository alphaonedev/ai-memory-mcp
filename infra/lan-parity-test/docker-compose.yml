#
# Scoped LAN-parity test stack: 2 IronClaw daemons + 1 PG+AGE
# container on a single shared Docker bridge, all on this node
# (192.168.50.100 / Colima).
#
# Why this exists (operator-set 2026-05-19):
#
# - macOS Sequoia gates plain connect(2) to RFC1918 destinations for
#   processes spawned under Claude Code (no NSLocalNetworkUsageDescription
#   entitlement in the cask binary). That blocks libpq/psql/cargo SAL
#   tests from reaching 192.168.50.1:5432 (the production pop-os PG).
# - All traffic inside this compose is either Docker-bridge (172.31.79.x)
#   or host-loopback (127.0.0.1:15432) — both exempt from the gate.
# - The 2 IronClaw daemons exercise the federation / A2A peer-reach
#   path; the PG+AGE container backs them via the in-bridge hostname
#   `pg-age:5432`. The cargo SAL-postgres tests, run from the host,
#   hit the same PG via 127.0.0.1:15432.
# - Co-exists with infra/plan-c/docker-compose.yml: different subnet
#   (172.31.79.0/24 vs 172.31.78.0/24), different container names
#   (ic-parity-* vs ic-*), different host ports (19180/19181 vs
#   19077/19078/19079, 15432 vs 5432).
#
# Quick-start:
#
#   cd /Users/fate/v07/v07-fixes
#   docker compose -f infra/lan-parity-test/docker-compose.yml up -d --build
#   # wait ~30s for pg-age healthcheck + IronClaw boot, then a few more
#   # seconds for the one-shot ic-parity-peer-key-provisioner to cross-
#   # enroll alice<->bob (#1803 — no manual peer-key step needed; see
#   # provision-peer-keys.sh for what it does and why)
#   docker compose -f infra/lan-parity-test/docker-compose.yml ps
#   # #3705 — every hop is TLS. The host-side cargo run must trust the fleet
#   # CA the one-shot `ic-parity-tls` provisioner minted into the
#   # `ic-parity-tls` volume (compose names it <project>_ic-parity-tls):
#   docker run --rm -v ai-memory-lan-parity_ic-parity-tls:/t:ro \
#     ai-memory-pg-age-vector:latest cat /t/ca.pem > .local-runs/lan-parity-ca.pem
#   AI_MEMORY_TEST_POSTGRES_URL="postgres://ai_memory:ai_memory_test@127.0.0.1:15432/ai_memory_test?sslmode=verify-full&sslrootcert=$PWD/.local-runs/lan-parity-ca.pem" \
#   AI_MEMORY_NO_CONFIG=1 \
#   cargo test --features sal,sal-postgres --release 2>&1 | tee .local-runs/lan-parity-2026-05-19.log
#   # (a DSN without sslmode=verify-full is REFUSED at the connect funnel —
#   # the pg server certificate carries SAN IP:127.0.0.1 + DNS:localhost so
#   # verify-full holds from the host loopback mapping too)
#
# Teardown (preserves images, drops volumes):
#
#   docker compose -f infra/lan-parity-test/docker-compose.yml down -v

name: ai-memory-lan-parity

services:
  pg-age:
    # Apache AGE on PostgreSQL 16 + pgvector — matches the production
    # pop-os PG major version. AGE 1.6.0 is the most recent pinned
    # release tag for PG16 as of 2025-09-18. pgvector is layered on
    # top via Dockerfile.pg-age-vector because the bare apache/age
    # image ships AGE but NOT pgvector, and the SAL postgres adapter
    # (feature `sal-postgres` → `dep:pgvector`) requires the
    # server-side `vector` type for embedding columns (#1065).
    build:
      context: .
      dockerfile: Dockerfile.pg-age-vector
    image: ai-memory-pg-age-vector:latest
    container_name: ai-memory-lan-parity-pg-age
    hostname: pg-age
    restart: unless-stopped
    # #3705 — TLS on the wire: the daemons connect with
    # sslmode=verify-full&sslrootcert=/tls/ca.pem (a plaintext DSN is
    # refused at the connect funnel), so the server presents the pair the
    # `ic-parity-tls` provisioner minted (SAN pg-age / localhost /
    # 127.0.0.1; key owned by the in-image `postgres` uid, mode 0600).
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/tls/pg/server.crt"
      - "-c"
      - "ssl_key_file=/tls/pg/server.key"
    depends_on:
      ic-parity-tls-provisioner:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: ai_memory
      POSTGRES_PASSWORD: ai_memory_test
      POSTGRES_DB: ai_memory_test
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Host-loopback exposure for cargo SAL-postgres tests from the
      # host process tree. 127.0.0.1 binding (not 0.0.0.0) avoids
      # advertising the test PG on the LAN.
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-age-data:/var/lib/postgresql/data
      - ./init-age.sql:/docker-entrypoint-initdb.d/01-init-age.sql:ro
      - ic-parity-tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_memory -d ai_memory_test"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - ic-parity-mesh

  ic-parity-alice:
    # #926 (2026-05-20): switched from Dockerfile.plan-c (heavy,
    # ~367 MB, carries test + bench pre-builds) to
    # Dockerfile.tier2-trackb (slim, ~335 MB, daemon-only). The mesh
    # exercises the federation / A2A peer-reach + SAL-postgres + AGE
    # path; it does not need the in-image test/bench binaries that
    # Dockerfile.plan-c bundles, so the slim image is the right
    # default for the lan-parity smoke. Operators wanting the full
    # plan-c image can override `dockerfile: Dockerfile.plan-c` via a
    # compose overlay file.
    build:
      context: ../..
      dockerfile: Dockerfile.tier2-trackb
      args:
        CARGO_FEATURES: sal-postgres
    image: ai-memory-lan-parity:latest
    container_name: ai-memory-lan-parity-alice
    hostname: ic-parity-alice
    restart: on-failure
    depends_on:
      pg-age:
        condition: service_healthy
      ic-parity-tls-provisioner:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # #926 (2026-05-20): break the peer-preflight chicken-and-egg.
      # Without this flag alice's entrypoint dies with `[#878
      # preflight] UNREACHABLE peer=http://ic-parity-bob:19077`
      # before bob has booted — bob can't boot if it's waiting for
      # alice. `depends_on` is necessary but not sufficient (TCP-up
      # != HTTP-handler-ready). Setting the flag on BOTH services
      # accepts the per-pair-of-daemons posture that no preflight
      # check fires on boot; the federation broadcast loop discovers
      # peers lazily on the first store/forward.
      AI_MEMORY_SKIP_PEER_PREFLIGHT: "1"
      AI_MEMORY_AGENT_ID: "ai:ic-parity-alice@lan-parity"
      # #1803 — pin the federation identity explicitly rather than
      # relying on the `host:<hostname>` fallback (resolver:
      # src/federation/identity/resolver.rs). This is the exact name
      # `entrypoint.plan-c.sh` mints a federation push-signing keypair
      # under, and the exact name `ic-parity-peer-key-provisioner`
      # below cross-copies into bob's key directory. Pinning it removes
      # any ambiguity from container-hostname resolution timing.
      AI_MEMORY_FED_IDENTITY: "host:ic-parity-alice"
      AI_MEMORY_TIER: autonomous
      AI_MEMORY_LISTEN_HOST: "0.0.0.0"
      AI_MEMORY_LISTEN_PORT: "19077"
      # Intra-bridge hostname `pg-age` resolves via Docker's embedded
      # DNS. Per-IronClaw schema in search_path keeps alice+bob data
      # cleanly separated even though they share the same database.
      # #3705 — the DSN pins sslmode=verify-full against the fleet CA; a DSN
      # without it is refused at the connect funnel (no downgrade exists).
      AI_MEMORY_STORE_URL: "postgres://ai_memory:ai_memory_test@pg-age:5432/ai_memory_test?options=-csearch_path%3Dic_alice%2Cag_catalog%2Cpublic&sslmode=verify-full&sslrootcert=/tls/ca.pem"
      AI_MEMORY_EMBED_MODEL: "nomic-embed-text"
      # #3705 — peers are https:// (the former AI_MEMORY_FED_ALLOW_PLAINTEXT_PEERS
      # acknowledgement is a REMOVED downgrade path: a truthy value refuses boot).
      # entrypoint.plan-c.sh turns the pair under AI_MEMORY_TLS_DIR into
      # --tls-cert/--tls-key (listener) and --quorum-client-cert/-key +
      # --quorum-ca-cert (outbound peer trust against the fleet CA).
      AI_MEMORY_PEER_URLS: "https://ic-parity-bob:19077"
      AI_MEMORY_TLS_DIR: "/tls/ic-parity-alice"
      # Enterprise-cert campaign 2026-08-08 (supersedes the 2026-05-31
      # OpenRouter Gemma 4 26B cost-optimization for THIS certified
      # enterprise-federated round): IronClaw containers run Grok 4.5 via
      # OpenRouter (`x-ai/grok-4.5`) as the AI NHI brain, matching the DO
      # substrate (infra/do-hive/cloud-init-agent.yaml.tpl runs the xAI-direct
      # `grok-4.5` model) so the free local lan-parity run and the paid DO run
      # exercise the SAME model family. Only the model id changes here; the
      # OpenRouter backend selection is unchanged. Operators who want the prior
      # cost-optimized Gemma brain override via env
      # (`AI_MEMORY_LLM_MODEL=google/gemma-4-26b-a4b-it`).
      # `OPENROUTER_API_KEY` comes from `~/.env` on this node;
      # `:?` syntax fails compose with a clear error if the shell env
      # hasn't sourced ~/.env first. Production operators run:
      #   set -a; source ~/.env; set +a
      #   docker compose -f infra/lan-parity-test/docker-compose.yml up -d
      AI_MEMORY_LLM_BACKEND: "openrouter"
      AI_MEMORY_LLM_MODEL: "${AI_MEMORY_LLM_MODEL:-x-ai/grok-4.5}"
      # auto_tag reuses the same paid Grok 4.5 model uniformly; operators with
      # extreme cost concerns can override via env to a cheaper OpenRouter model
      # (e.g. google/gemma-4-26b-a4b-it) or any other model.
      AI_MEMORY_AUTO_TAG_MODEL: "${AI_MEMORY_AUTO_TAG_MODEL:-x-ai/grok-4.5}"
      # Kept for backward compat with anything that still reads OLLAMA_BASE_URL
      # directly (e.g., tier-default fallback when AI_MEMORY_LLM_BACKEND unset
      # in some future config path). Harmless when AI_MEMORY_LLM_BACKEND=openrouter.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in shell env — source ~/.env before running docker compose up}"
      # Daemon HTTP X-API-Key auth secret. Reuses the OpenRouter key as
      # the high-entropy HTTP token (73-char random string is suitable
      # as an API key). Operators wanting separate secrets set both
      # OPENROUTER_API_KEY (LLM) and AI_MEMORY_API_KEY (HTTP) explicitly.
      AI_MEMORY_API_KEY: "${AI_MEMORY_API_KEY:-${OPENROUTER_API_KEY}}"
      RUST_LOG: "${RUST_LOG:-ai_memory=info,sqlx=warn}"
    volumes:
      - ic-parity-alice-keys:/root/.config/ai-memory/keys
      - ic-parity-alice-audit:/var/log/ai-memory/audit
      - ic-parity-tls:/tls:ro
    ports:
      - "127.0.0.1:19180:19077"
    networks:
      - ic-parity-mesh
    healthcheck:
      # Operator directive 2026-05-21: send X-API-Key on the healthcheck
      # otherwise the auth middleware returns 401 and the container is
      # reported `unhealthy` even though the daemon is fully functional.
      # The `$$XAI_API_KEY` form double-escapes for compose-vs-shell
      # interpolation: compose strips one `$`, the in-container shell
      # uses the env-injected value (passed via the AI_MEMORY_API_KEY
      # env var above so the in-container `curl` reads the same value
      # the daemon authenticates against).
      # #3705 — the listener is TLS-only; probe it by the hostname the
      # certificate names, trusting the fleet CA (never `-k`).
      test: ["CMD-SHELL", "curl -f -sS --max-time 3 --cacert /tls/ca.pem -H \"X-API-Key: $$AI_MEMORY_API_KEY\" https://ic-parity-alice:19077/api/v1/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ic-parity-bob:
    image: ai-memory-lan-parity:latest
    container_name: ai-memory-lan-parity-bob
    hostname: ic-parity-bob
    restart: on-failure
    depends_on:
      pg-age:
        condition: service_healthy
      ic-parity-alice:
        condition: service_started
      ic-parity-tls-provisioner:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # #926 — see alice's block above for the rationale. Both
      # services must skip preflight or the boot chain deadlocks.
      AI_MEMORY_SKIP_PEER_PREFLIGHT: "1"
      AI_MEMORY_AGENT_ID: "ai:ic-parity-bob@lan-parity"
      # #1803 — see alice's block above for the pinned-identity
      # rationale; this is bob's mirror-image counterpart.
      AI_MEMORY_FED_IDENTITY: "host:ic-parity-bob"
      AI_MEMORY_TIER: autonomous
      AI_MEMORY_LISTEN_HOST: "0.0.0.0"
      AI_MEMORY_LISTEN_PORT: "19077"
      # #3705 — see alice's block: verify-full against the fleet CA.
      AI_MEMORY_STORE_URL: "postgres://ai_memory:ai_memory_test@pg-age:5432/ai_memory_test?options=-csearch_path%3Dic_bob%2Cag_catalog%2Cpublic&sslmode=verify-full&sslrootcert=/tls/ca.pem"
      AI_MEMORY_EMBED_MODEL: "nomic-embed-text"
      # #3705 — https:// peer; see alice's block.
      AI_MEMORY_PEER_URLS: "https://ic-parity-alice:19077"
      AI_MEMORY_TLS_DIR: "/tls/ic-parity-bob"
      # See alice's block for the 2026-08-08 enterprise-cert Grok 4.5
      # rationale (`x-ai/grok-4.5` via OpenRouter; supersedes the
      # 2026-05-31 Gemma 4 26B cost-optimization for this cert round).
      AI_MEMORY_LLM_BACKEND: "openrouter"
      AI_MEMORY_LLM_MODEL: "${AI_MEMORY_LLM_MODEL:-x-ai/grok-4.5}"
      AI_MEMORY_AUTO_TAG_MODEL: "${AI_MEMORY_AUTO_TAG_MODEL:-x-ai/grok-4.5}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set in shell env — source ~/.env before running docker compose up}"
      AI_MEMORY_API_KEY: "${AI_MEMORY_API_KEY:-${OPENROUTER_API_KEY}}"
      RUST_LOG: "${RUST_LOG:-ai_memory=info,sqlx=warn}"
    volumes:
      - ic-parity-bob-keys:/root/.config/ai-memory/keys
      - ic-parity-bob-audit:/var/log/ai-memory/audit
      - ic-parity-tls:/tls:ro
    ports:
      - "127.0.0.1:19181:19077"
    networks:
      - ic-parity-mesh
    healthcheck:
      # See alice's block for the X-API-Key healthcheck rationale; #3705 —
      # TLS-only listener, probed by certificate hostname against the CA.
      test: ["CMD-SHELL", "curl -f -sS --max-time 3 --cacert /tls/ca.pem -H \"X-API-Key: $$AI_MEMORY_API_KEY\" https://ic-parity-bob:19077/api/v1/capabilities"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ic-parity-tls-provisioner:
    # #3705 — one-shot fleet-CA + certificate provisioner (see
    # infra/lan-parity-test/provision-tls.sh for the layout and why):
    # every hop in this stack is TLS — the pg DSNs pin verify-full, the
    # listeners serve TLS only, peers are https://. Runs BEFORE pg-age and
    # both daemons (they `depends_on` its successful completion) in the
    # pg image (which carries `openssl`), writing into the shared
    # `ic-parity-tls` volume that the others mount read-only at /tls.
    # Idempotent across `compose up` runs (an existing CA is reused).
    build:
      context: .
      dockerfile: Dockerfile.pg-age-vector
    image: ai-memory-pg-age-vector:latest
    container_name: ai-memory-lan-parity-tls-provisioner
    entrypoint: ["/bin/sh", "/usr/local/lib/ai-memory/provision-tls.sh"]
    user: "0:0"
    environment:
      TLS_OUT_DIR: "/tls"
      TLS_DAEMONS: "ic-parity-alice ic-parity-bob"
      TLS_PG_HOST: "pg-age"
      TLS_PG_UID: "999"
    volumes:
      - ./provision-tls.sh:/usr/local/lib/ai-memory/provision-tls.sh:ro
      - ic-parity-tls:/tls
    networks:
      - ic-parity-mesh
    restart: "no"

  ic-parity-peer-key-provisioner:
    # #1803 — auto-provisions the alice<->bob federation peer-key
    # cross-enrollment so a bare `docker compose up` yields a WORKING
    # enrolled mesh (the manual `.pub`-copy step the 2026-06-24 live
    # IronClaw A2A campaign had to work around, and which still 401'd
    # on the daemon's own signed push — see
    # infra/lan-parity-test/provision-peer-keys.sh for the full root-
    # cause writeup and entrypoint.plan-c.sh for where each side's
    # federation-identity-labeled signing keypair actually gets
    # minted). One-shot: mounts BOTH key volumes read-write, waits for
    # each daemon's own entrypoint keygen to land its `.pub`, then
    # cross-copies. Runs the same image as alice/bob (already built by
    # `compose up --build`) so no extra image pull/build is needed;
    # overrides the image's normal daemon entrypoint to run the
    # provisioning script instead.
    image: ai-memory-lan-parity:latest
    container_name: ai-memory-lan-parity-peer-key-provisioner
    entrypoint: ["/bin/sh", "/usr/local/lib/ai-memory/provision-peer-keys.sh"]
    environment:
      AI_MEMORY_FED_IDENTITY_ALICE: "host:ic-parity-alice"
      AI_MEMORY_FED_IDENTITY_BOB: "host:ic-parity-bob"
      ALICE_KEY_DIR: "/keys/alice"
      BOB_KEY_DIR: "/keys/bob"
    volumes:
      - ./provision-peer-keys.sh:/usr/local/lib/ai-memory/provision-peer-keys.sh:ro
      - ic-parity-alice-keys:/keys/alice
      - ic-parity-bob-keys:/keys/bob
    depends_on:
      ic-parity-alice:
        condition: service_healthy
      ic-parity-bob:
        condition: service_healthy
    networks:
      - ic-parity-mesh
    restart: "no"

networks:
  # Distinct subnet from infra/plan-c (172.31.78.0/24) so the two
  # composes can co-exist on the same Colima host without route
  # collisions.
  ic-parity-mesh:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.79.0/24

volumes:
  pg-age-data:
  # #3705 — fleet CA + per-service certificates (provision-tls.sh).
  ic-parity-tls:
  ic-parity-alice-keys:
  ic-parity-alice-audit:
  ic-parity-bob-keys:
  ic-parity-bob-audit:

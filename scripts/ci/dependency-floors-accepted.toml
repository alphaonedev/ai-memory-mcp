# Dated acceptances for scripts/check-dependency-floors.py (#8473 item 5).
#
# The gate asks OSV which locked crates.io versions are affected by a published
# advisory (RustSec and GHSA-only records) and fails on any finding that has no
# entry here. This file is NOT .cargo/audit.toml: that file belongs to
# cargo-audit and keeps its own schema.
#
# One [[accepted]] table per advisory. Every key is `key = value` on one line;
# value forms are "string", a bare positive number, or ["a", "b"] string lists.
# A trailing comment after a value is not supported.
#   id             advisory id (RUSTSEC-... or GHSA-...), string, required
#   aliases        other ids of the same advisory, list of strings, optional
#   package        crate name, string, required (an entry only covers its crate)
#   rationale      why the finding is accepted, non-empty string, required
#   review_by      ISO date (YYYY-MM-DD); the gate FAILS once this date is past
#   tracking_issue GitHub issue number that owns the fix or the review
#
# Rules: a finding whose id or alias matches no entry fails; an expired or
# malformed entry fails; an entry whose crate version is no longer affected
# only warns (remove it in the PR that lands the fix).


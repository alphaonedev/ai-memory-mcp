# docker-compose.batman-active.yml — Batman-active ai-memory stack in
# containers. Issue #800 Crack 6 + multi-OS support.
#
# Two services: the MCP server (long-running, stdio is exposed via the
# host wrapper, not this compose — it's here for live inspection) and
# the curator daemon. Both share a volume for the SQLite DB and another
# for the operator key + namespace governance state.
#
# Form 5 env vars wired into the curator (and the MCP service if you
# expose it). Form 7 operator key is generated on first launch by the
# init container.
#
# Usage (both variables are REQUIRED; compose refuses to render without them):
#   AI_MEMORY_IMAGE=ai-memory:local AI_MEMORY_API_KEY="$(openssl rand -hex 32)" \
#   docker compose -f scripts/docker/docker-compose.batman-active.yml up -d
#   docker compose -f scripts/docker/docker-compose.batman-active.yml logs -f curator
#   docker compose -f scripts/docker/docker-compose.batman-active.yml exec curator \
#       ai-memory --db /data/ai-memory.db rules list
#
# Run the acceptance suite from the host or inside an exec:
#   docker compose -f scripts/docker/docker-compose.batman-active.yml exec curator \
#       /opt/scripts/batman-mode-acceptance.sh --db /data/ai-memory.db
#
# To activate from a fresh container, run the install script inside the
# init container or against the daemon's shell. The compose file
# bind-mounts the host's scripts/ into /opt/scripts so the same recipes
# (install-batman-active.sh + acceptance) work without rebuild.

services:

  # First-launch initializer: keygen + sign-seed + enable R001-R004 +
  # write a Batman standard memory. Exits 0 after activation. Idempotent.
  init-batman:
    image: ${AI_MEMORY_IMAGE:?set AI_MEMORY_IMAGE to a v1.0.0+ ai-memory image (e.g. a local `docker build -t ai-memory:local .`); this stack assumes the TLS-only daemon}
    container_name: ai-memory-init-batman
    user: ${AI_MEMORY_UID:-1000}:${AI_MEMORY_GID:-1000}
    environment:
      AI_MEMORY_DB: /data/ai-memory.db
      AI_MEMORY_KEY_DIR: /keys
      BATMAN_NAMESPACE: ${BATMAN_NAMESPACE:-main}
      # #3838 — REQUIRED. `serve` refuses a keyless non-loopback bind
      # (`api_key_bind_guard`, #1458) and the mcp service binds 0.0.0.0 so the
      # published port can reach it. The key goes into the 0600 config.toml
      # below, never into argv and never into this file.
      AI_MEMORY_API_KEY: ${AI_MEMORY_API_KEY:?set AI_MEMORY_API_KEY — serve refuses a keyless non-loopback bind (#1458); it is written to the 0600 config.toml, never to argv}
    volumes:
      - ai-memory-data:/data
      - ai-memory-keys:/keys
      - ../../scripts:/opt/scripts:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        # init the DB if missing — ai-memory creates schema on first open
        if [ ! -f /data/ai-memory.db ]; then
          ai-memory --db /data/ai-memory.db stats >/dev/null 2>&1 || true
        fi
        # ensure scripts are executable when mounted from host
        chmod +x /opt/scripts/*.sh 2>/dev/null || true
        # run the activator — idempotent
        bash /opt/scripts/install-batman-active.sh --db /data/ai-memory.db --namespace "$$BATMAN_NAMESPACE"
        # #3838 -- `serve` takes no --tier flag (#703): the daemon's tier comes
        # from config.toml, resolved under XDG_CONFIG_HOME. Write it once, on
        # the shared data volume, so the mcp and curator services (which set
        # XDG_CONFIG_HOME=/data/xdg) boot at the autonomous tier this stack
        # documents. Idempotent: never overwrites an operator-edited file.
        #
        # The same file carries `api_key` (#3838), so it is a secret: 0700
        # directory, 0600 file, written under umask 077, and every service runs
        # as the same AI_MEMORY_UID. The key is added (at the top, where a TOML
        # top-level key must go) only when the file has none, so an
        # operator-set key is never replaced.
        case "$$AI_MEMORY_API_KEY" in
          ''|*[!A-Za-z0-9._~+/=-]*)
            echo "init-batman: AI_MEMORY_API_KEY must be non-empty and use only [A-Za-z0-9._~+/=-]" >&2
            exit 64 ;;
        esac
        mkdir -p /data/xdg/ai-memory
        chmod 700 /data/xdg /data/xdg/ai-memory
        cfg=/data/xdg/ai-memory/config.toml
        if [ ! -f "$$cfg" ]; then
          (umask 077; printf 'schema_version = 2\ntier = "autonomous"\n' > "$$cfg")
        fi
        if ! grep -q '^api_key[[:space:]]*=' "$$cfg"; then
          (umask 077; { printf 'api_key = "%s"\n' "$$AI_MEMORY_API_KEY"; cat "$$cfg"; } > "$$cfg.new")
          mv "$$cfg.new" "$$cfg"
        fi
        chmod 600 "$$cfg"
        echo "init-batman complete"
    restart: "no"

  # The MCP server. Default tier=autonomous + profile=full so Forms 1/3/4
  # are on from the first request; Form 5 env vars come from the
  # environment block here, picked up by every spawned process.
  mcp:
    image: ${AI_MEMORY_IMAGE:?set AI_MEMORY_IMAGE to a v1.0.0+ ai-memory image (e.g. a local `docker build -t ai-memory:local .`); this stack assumes the TLS-only daemon}
    container_name: ai-memory-mcp
    user: ${AI_MEMORY_UID:-1000}:${AI_MEMORY_GID:-1000}
    depends_on:
      init-batman:
        condition: service_completed_successfully
    environment:
      AI_MEMORY_DB: /data/ai-memory.db
      AI_MEMORY_KEY_DIR: /keys
      XDG_CONFIG_HOME: /data/xdg
      AI_MEMORY_AUTO_CONFIDENCE: "1"
      AI_MEMORY_CONFIDENCE_SHADOW: "1"
      AI_MEMORY_CONFIDENCE_DECAY: "1"
      AI_MEMORY_PROFILE: full
    volumes:
      - ai-memory-data:/data
      - ai-memory-keys:/keys
    # Stdio MCP server. Compose isn't the right transport — exec into
    # this container for ad-hoc CLI calls, and point your MCP-stdio
    # client at `docker exec -i ai-memory-mcp ai-memory --db /data/ai-memory.db mcp --tier autonomous`.
    # #3838 -- `serve` has `--host`/`--port` (no `--bind`) and no `--tier`
    # (the tier is the config.toml the init service wrote, above). The HTTP API
    # requires the AI_MEMORY_API_KEY from that same file on every call except
    # the `/api/v1/health` probe below. The bind is 0.0.0.0 because the port
    # mapping only reaches a listener on the container's 0.0.0.0; the published
    # port stays host-loopback (127.0.0.1:9077).
    command:
      - ai-memory
      - --db
      - /data/ai-memory.db
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9077"
    ports:
      - "127.0.0.1:9077:9077"
    restart: unless-stopped
    healthcheck:
      # TLS only (#3705): the daemon answers no plaintext, and `/healthz` was
      # never a route (`handlers::routes::HEALTH` is `/api/v1/health`). The
      # zero-config local CA (#3709) lives under AI_MEMORY_KEY_DIR (/keys).
      test: ["CMD", "curl", "-fs", "--cacert", "/keys/tls/local-ca.pem", "https://localhost:9077/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The autonomous curator. Form 1 background sweeps, Form 5
  # freshness-decay sweeps, Form 6 backfills, Rule-5 consolidation.
  # Always-on. Form 5 env vars baked in.
  curator:
    image: ${AI_MEMORY_IMAGE:?set AI_MEMORY_IMAGE to a v1.0.0+ ai-memory image (e.g. a local `docker build -t ai-memory:local .`); this stack assumes the TLS-only daemon}
    container_name: ai-memory-curator
    user: ${AI_MEMORY_UID:-1000}:${AI_MEMORY_GID:-1000}
    depends_on:
      init-batman:
        condition: service_completed_successfully
    environment:
      AI_MEMORY_DB: /data/ai-memory.db
      AI_MEMORY_KEY_DIR: /keys
      XDG_CONFIG_HOME: /data/xdg
      AI_MEMORY_AUTO_CONFIDENCE: "1"
      AI_MEMORY_CONFIDENCE_SHADOW: "1"
      AI_MEMORY_CONFIDENCE_DECAY: "1"
    volumes:
      - ai-memory-data:/data
      - ai-memory-keys:/keys
      - ../../scripts:/opt/scripts:ro
    command:
      - ai-memory
      - --db
      - /data/ai-memory.db
      - curator
      - --daemon
      - --interval-secs
      - "300"
      - --max-ops
      - "100"
    restart: unless-stopped

  # Optional: peer-to-peer sync daemon (Crack 6 — single-node mesh).
  # Disabled by default since it needs peer addresses. Enable by
  # providing the peer list via SYNC_PEERS (comma-separated https:// URLs —
  # an http:// peer is refused at boot, #2477/#3705), then:
  #   docker compose --profile sync up -d
  sync:
    image: ${AI_MEMORY_IMAGE:?set AI_MEMORY_IMAGE to a v1.0.0+ ai-memory image (e.g. a local `docker build -t ai-memory:local .`); this stack assumes the TLS-only daemon}
    container_name: ai-memory-sync
    profiles: ["sync"]
    user: ${AI_MEMORY_UID:-1000}:${AI_MEMORY_GID:-1000}
    depends_on:
      init-batman:
        condition: service_completed_successfully
    environment:
      AI_MEMORY_DB: /data/ai-memory.db
      AI_MEMORY_KEY_DIR: /keys
    volumes:
      - ai-memory-data:/data
      - ai-memory-keys:/keys
    command:
      - sh
      - -c
      - >
        if [ -z "${SYNC_PEERS:-}" ]; then
          echo "no SYNC_PEERS set — sync daemon idle, exiting";
          exit 0;
        fi
        exec ai-memory --db /data/ai-memory.db sync-daemon --peers "${SYNC_PEERS}"
    restart: unless-stopped

volumes:
  ai-memory-data:
    driver: local
  ai-memory-keys:
    driver: local

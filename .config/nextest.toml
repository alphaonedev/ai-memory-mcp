# Nextest configuration.
#
# Profiles:
#   default — local dev, fail-fast off, surface flakes
#   macos   — local macOS dev (alias of default with retries=1)
#   ci      — CI (every platform), retries=0, one PASS/FAIL line per test
#
# Usage:
#   cargo nextest run --features sal
#   cargo nextest run --profile ci --features sal
#
# See: https://nexte.st/docs/configuration/

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }
status-level = "fail"
final-status-level = "flaky"
test-threads = "num-cpus"

[profile.default.junit]
path = "junit.xml"

[profile.macos]
retries = 1
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"
test-threads = "num-cpus"

# ci is what .github/workflows/ci.yml runs (#7259): every non-doc test leg goes
# through `cargo nextest run --profile ci --no-fail-fast` (doc tests stay on
# `cargo test --doc`; nextest does not run them).
#
# - retries = 0: `cargo test` never retried, so a retry here could turn a red
#   test green and make the two runners disagree. A flaky test must fail.
# - slow-timeout: one test is terminated after 120s x 3 = 360s. That is far
#   stricter than the per-invocation watchdog it sits under (>= 2100s), never
#   looser.
# - status-level = "pass": one PASS/FAIL line per test lands in the CI log so
#   scripts/ci/compare_test_sets.py can diff the executed set against a
#   `cargo test` log. decision: no JUnit file for ci - the three shards and the
#   isolated lane all ran `--profile ci` into the same junit.xml path and no step
#   uploaded it, so it was never a record; the captured log IS the record and the
#   test-results artifact below already uploads it.
[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }
status-level = "pass"
final-status-level = "flaky"
test-threads = "num-cpus"

# The lib tests that touch the shared per-job Postgres database. The sal-postgres
# legs already pass `--test-threads 1` (translated from `-- --test-threads=1`
# by scripts/ci/nextest_args.py); this group keeps those tests single-threaded
# on any profile-only run too. The test names are scripts/ci/lib_pg_prefixes.txt
# (pinned by scripts/ci/tests/test_nextest_config_7259.py).
[test-groups]
pg-lib-serial = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'kind(lib) & (test(~store::postgres) | test(~store::update_atomicity_3152_tests) | test(~background::auto_tag_worker) | test(~cli::schema_init) | test(~curator::compaction) | test(~daemon_runtime::cov_boot_degrade_arms_3521::curator_store_handle_connects_postgres_without_an_embedder))'
test-group = 'pg-lib-serial'

# handlers_concurrent_http_no_block asserts a wall-clock bound (200 ms floor) on
# concurrent requests. `cargo test` ran it as one of a handful of tests in a few
# binaries; nextest schedules every test of every binary at once, and on the
# enterprise-fed leg the bound was measured at 229.8 ms while other tests held the
# CPU. `threads-required = 'num-cpus'` makes nextest run it with every thread
# reserved, so nothing else runs beside it. The bound itself is unchanged.
[[profile.ci.overrides]]
filter = 'binary(handlers_concurrent_http_no_block)'
threads-required = 'num-cpus'

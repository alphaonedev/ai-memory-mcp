# Nextest configuration.
#
# Profiles:
#   default — local dev, fail-fast off, surface flakes
#   macos   — local macOS dev (alias of default with retries=1)
#   ci      — CI / Linux, retries=2, JUnit output
#
# Usage:
#   cargo nextest run --features sal
#   cargo nextest run --profile ci --features sal
#
# See: https://nexte.st/docs/configuration/

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 4 }
status-level = "fail"
final-status-level = "flaky"
test-threads = "num-cpus"

[profile.default.junit]
path = "junit.xml"

[profile.macos]
retries = 1
fail-fast = false
slow-timeout = { period = "90s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"
test-threads = "num-cpus"

[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }
status-level = "fail"
final-status-level = "flaky"
test-threads = "num-cpus"

[profile.ci.junit]
path = "junit.xml"

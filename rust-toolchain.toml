# Project-standard Rust toolchain: current stable 1.99.1 (operator order
# 2026-11-02, #8473). This pins local + rustup-driven builds and every CI job
# that does not name its own toolchain to one compiler, so "works on my
# machine" matches CI: the dtolnay/rust-toolchain steps install 1.99.1 and
# rust-toolchain.toml makes cargo resolve to it. The published crate's MSRV
# floor is a separate, lower number (Cargo.toml `rust-version = "1.98"`); the
# dedicated `MSRV (Rust 1.98)` CI job `cargo +1.98.0 check`s the crate on
# exactly 1.98.0 and fails if the true minimum drifts above the declared floor.
[toolchain]
channel = "1.99.1"
profile = "minimal"

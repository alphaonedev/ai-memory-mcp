# systemd-sysusers fragment for ai-memory.
# Installed as /usr/lib/sysusers.d/ai-memory.conf (AUR PKGBUILD; distro
# packages should ship the same path). systemd-sysusers creates both
# users on first boot so the shipped units can start on a fresh host.
#
# Format: u NAME [UID] ["GECOS"] [HOME] [SHELL]
# UID `-` = dynamically allocated. Shell omitted → nologin.
# See systemd.sysusers(5) and packaging/systemd/README.md.
#
# #3578 item 3b — without `ai-memory-hub` the wake-hub unit fails to start
# (User= of an unknown account). The two users MUST stay distinct: the
# hub's InaccessiblePaths=/var/lib/ai-memory is only load-bearing if the
# hub uid cannot also own the store.
u ai-memory - "ai-memory daemon" /var/lib/ai-memory
u ai-memory-hub - "ai-memory wake hub" /run/ai-memory-hub

# ai-memory per-module coverage thresholds
# Generated 2026-05-13 at v0.7.0 L0.7-7 (post-integration cascade @ 83bc684).
# Source measurement: cargo llvm-cov --features sal,sal-postgres --lib --tests --workspace
#                     against .local-runs/L0.7-7-baseline/cov.json
#
# DISCIPLINE (per L0.7 playbook §8):
#   Operator standard (2026-06-11): the per-module floor is a UNIFORM
#   90%. Every module must reach 90% line coverage; the AI NHI writes
#   the tests to get there. A module may sit below 90 ONLY when it is
#   structurally impossible to cover (proven, with the exact
#   uncoverable lines + reason recorded in coverage/policy.md) — not
#   as a convenience. Thresholds never silently fall.
#
# RULE for derivation: threshold = floor(measured - 0.5).
#   - measured 96.5% → threshold 96   (~0.5pp noise tolerance below)
#   - measured 99.0% → threshold 98   (~1pp tolerance below)
#   - measured 100.0% → threshold 99  (never set 100 to avoid 1-line jitter trips)
#
# FRAGILE-PIN AUDIT (#1424 item 2, 2026-06-04): five floors were set at
# floor(measured) instead of floor(measured - 0.5), leaving <0.5pp headroom
# (one churn commit from a fragile-floor CI trip like the 2026-05-30
# daemon_runtime.rs regression):
#   mcp/tools/kg_query.rs (73, measured 73.21, 0.21pp)
#   cli/shell.rs          (92, measured 92.29, 0.29pp)
#   mcp/tools/update.rs   (83, measured 83.33, 0.33pp)
#   hooks/config.rs       (94, measured 94.47, 0.47pp)
#   mcp/tools/promote.rs  (88, measured 88.48, 0.48pp)
# These are NOT lowered (§8 thresholds rise / never fall without operator
# approval); instead coverage/check-thresholds.sh emits a non-fatal CANARY
# for every sub-0.5pp module so maintainers add test headroom before a trip.
# Each is tagged inline below with `# CANARY <0.5pp (#1424)`.
#
# Tier targets (raise per-module floor to these by v0.8.0):
#   A=98% (pure logic), B=95% (MCP/HTTP/CLI), C=92% (substrate),
#   D=85% (LLM-bound, documented rationale), E=90% (wire/IO, documented exceptions)
#
# EXCEPTIONS: modules listed in coverage/policy.md with structural ceilings
# are recorded here at their CURRENT-floor value (NOT the tier target). The
# tier target applies once the structural blocker is resolved or the file is
# reshaped.

[global]
# Global floor on the workspace TOTAL line coverage. Set at
# floor(measured - 0.5) over the LIVE-PG+AGE+pgvector workflow
# measurement.
#
# Current measured: 92.58% (live-PG + AGE + pgvector,
# --features sal,sal-postgres --lib --tests --workspace,
# 2026-05-20 measurement against .local-runs/coverage-tier4-audit.json
# from Tier 4 audit agent afaa498d2f92a9026). The 90 floor preserves
# ~2.58pp headroom over the live-PG measurement for run-to-run
# jitter — store/postgres.rs (5852 executable lines) at 70.54%
# accounts for ~4.10pp on the global denominator and is exercised
# by `live_*` / `serve_postgres_*` / `g[1-9]_postgres_*` /
# `federation_dlq_replay` tests when AI_MEMORY_TEST_POSTGRES_URL is
# set.
#
# This gate runs `.github/workflows/coverage.yml` which provisions a
# pgvector/AGE service container so the postgres-store tests connect
# at runtime instead of skipping. The workflow's `services:` block +
# `init-age.sql`-equivalent step ensures both pgvector AND apache/age
# extensions are loaded before cargo-llvm-cov runs.
#
# The `Code Coverage` job in .github/workflows/ci.yml runs a different
# feature set (`--features sal` only) and has its own absolute floor
# (90%) plus ratchet against `.coverage-baseline` (93.13). That job is
# unaffected by this gate.
min_line_coverage = 90.0


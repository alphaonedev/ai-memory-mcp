[package]
name = "ai-memory-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
libfuzzer-sys = "0.4"
ai-memory = { path = ".." }
serde_json = "1"

[[bin]]
name = "fuzz_validate"
path = "fuzz_targets/fuzz_validate.rs"
test = false
doc = false

[[bin]]
name = "fuzz_namespace"
path = "fuzz_targets/fuzz_namespace.rs"
test = false
doc = false

# R9 (#1960) capability/governance token fuzz target. Budget (ESTIMABLE):
# 15 min CPU/target on the CI fuzz lane; 1 core-hour local soak before any
# change to src/governance/capability.rs.
[[bin]]
name = "fuzz_capability"
path = "fuzz_targets/fuzz_capability.rs"
test = false
doc = false

# #8473 round 3 (R3-3): the root workspace patches paste to vendor/paste (#2050);
# the fuzz workspace has its own lock and patch table, so it needs the same
# entry or it resolves the registry paste 1.0.15 (RUSTSEC-2024-0436, #8478).
[patch.crates-io]
paste = { path = "../vendor/paste" }

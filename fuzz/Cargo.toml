[package]
name = "ai-memory-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
libfuzzer-sys = "0.4"
ai-memory = { path = ".." }
serde_json = "1"

[[bin]]
name = "fuzz_validate"
path = "fuzz_targets/fuzz_validate.rs"
test = false
doc = false

[[bin]]
name = "fuzz_namespace"
path = "fuzz_targets/fuzz_namespace.rs"
test = false
doc = false

# R9 (#1960) capability/governance token fuzz target. Budget (ESTIMABLE):
# 15 min CPU/target on the CI fuzz lane; 1 core-hour local soak before any
# change to src/governance/capability.rs.
[[bin]]
name = "fuzz_capability"
path = "fuzz_targets/fuzz_capability.rs"
test = false
doc = false

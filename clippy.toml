# #873 — per-function size budget. Companion to `[lints.clippy]
# too_many_lines = "deny"` in Cargo.toml. The integer threshold cannot
# live in `Cargo.toml` (stable cargo's `[lints]` table doesn't accept
# per-lint config payloads as of 1.88, see rust-lang/cargo#13310), so
# the value sits here.
#
# 250 is the discipline anchor. Existing offenders carry
# `#![allow(clippy::too_many_lines)] // tracked for split as #...` at
# the top of their containing file with a tracker reference. The
# allowance keeps CI green while the split lands; removing the
# allowance is the gate that says "this file is now under-budget".
too-many-lines-threshold = 250

# #1174 PR10 — pm-v3.1 lint-gate. Vendor-monoculture detection lives
# in the script gate `scripts/check-vendor-literals.sh` (file-level
# allowlist: `src/llm.rs` / `src/config.rs` / `src/mine.rs` /
# `src/validate.rs` / `src/cli/wrap.rs` / `src/harness.rs`); the script
# is wired into `.github/workflows/c8-precheck.yml` for CI enforcement.
#
# Why no `disallowed_methods = ["std::time::Duration::from_secs"]` entry
# (PR3 SECS_PER_* discipline): `Duration::from_secs` is called 90+ times
# in the codebase with legitimate small-int timeouts (5, 10, 30 seconds
# for HTTP / health probes / circuit-breaker cooldowns); clippy's
# `disallowed_methods` lint cannot distinguish "literal magic number"
# from "named const argument", so a blanket disallow would block all
# 90+ sites including the legitimate ones. The SECS_PER_* discipline
# (use `crate::SECS_PER_HOUR` / `SECS_PER_DAY` / `SECS_PER_WEEK` instead
# of raw `3600` / `86400` / `604_800` literals) is enforced at the
# code-review layer + grep-as-gate (the script also greps for the
# specific literal forms `Duration::from_secs(3600|86400|604800|3_600|
# 86_400|604_800|7200|21600)` to catch the documented regression
# patterns). See `scripts/check-vendor-literals.sh` for the full
# discipline.

# #10176 process-start gate, layer 1. The compiler resolves every path
# before this lint runs, so a use alias, a grouped use, a re-export, a type
# alias, a macro body, a path attribute, an include and a function pointer all
# reach the same entry below. Every entry point that code in this repository
# can call to start a process is listed, including the two #1937 audited
# chokepoints, so a caller of a chokepoint is a reasoned site too. A justified site carries an
# item-level `#[expect(clippy::disallowed_methods, reason = "...")]`: expect,
# not allow, so a site that stops firing (an entry removed here, a clippy
# change) turns the clippy gate red as an unfulfilled expectation.
#
# Layer 2 is the source ratchet tests/test_child_spawner_isolation_10176.rs:
# it pins this exact list, counts every attribute that can silence the lint
# against an exact per-file allowlist, and refuses extern blocks, asm and a
# path or include target outside src/ and tests/.
#
# The libc names are the POSIX process-creation family (fork, vfork, the exec
# family, posix_spawn, posix_spawnp, system, popen) plus the Linux clone,
# daemon, forkpty, fexecve, execveat and the raw syscall entry, plus dlopen,
# dlsym and dlvsym, which look any of those up by name at run time. clippy reports
# an entry that does not resolve as a warning that -D warnings does not raise,
# so tests/spawn_gate_pins_10176.rs holds one expectation per entry: an entry
# that stops resolving turns clippy red there.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "tokio::process::Command::new", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "assert_cmd::Command::new", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "assert_cmd::Command::cargo_bin", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "assert_cmd::cargo::CommandCargoExt::cargo_bin", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "ai_memory::spawn_audit::audited_command", reason = "process start through the #1937 chokepoint: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "ai_memory::spawn_audit::audited_tokio_command", reason = "process start through the #1937 chokepoint: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::fork", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::vfork", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::clone", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::daemon", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::forkpty", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::execl", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::execle", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
    { path = "libc::execlp", reason = "process start: needs an expect attribute and a row in tests/test_child_spawner_isolation_10176.rs (#10176)" },
